  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-band"/></svg><div><div class="eyebrow">Day 9 · 2026년 기준</div><h2>예방접종</h2><p class="lead">2026년 미국에는 "두 개의 일정표"가 있습니다. 캘리포니아와 Kaiser가 무엇을 따르는지, 우리 아기의 접종 날짜는 언제인지, 한국 일정과 무엇이 다른지를 정확히 알고 2개월 검진에 들어갑니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 6가지</h3>
    <ol>
      <li>캘리포니아주(CDPH)는 <strong>AAP 2026 일정표를 공식 채택</strong>했고 보험 적용도 그대로입니다. Kaiser도 B형간염 출생접종을 계속합니다. 이 페이지의 기준도 AAP 2026입니다.</li>
      <li>CDC가 2026-01-05 발표한 "축소 일정표"는 2026-03-16 법원 명령으로 효력 정지 중이며, CDC 사이트는 2025년판을 표시합니다. 항소심 결과에 따라 화면이 바뀔 수 있지만 캘리포니아 권고는 유지됩니다.</li>
      <li>0~12개월에서 CDC 2025판과 AAP 2026의 실질적 차이는 <strong>코로나19 하나</strong>(AAP 6~23개월 권장 / CDC 공동 의사결정)입니다.</li>
      <li>12월 말 출생은 RSV 시즌 한가운데: <strong>니르세비맙(Beyfortus) 또는 클레세로비맙을 출생 1주 이내</strong>(이상적으로 분만 입원 중). 엄마가 분만 14일 전까지 Abrysvo를 맞았다면 불필요.</li>
      <li>로타바이러스 1차는 <strong>생후 14주 6일(2027-04-11)까지</strong> 시작해야 합니다. 2개월 검진을 미루면 안 되는 이유.</li>
      <li>한국 일정과 0~12개월은 거의 같고, <strong>BCG(한국만, 4주 이내)</strong>와 <strong>일본뇌염(한국, 12개월~)</strong>만 다릅니다.</li>
    </ol>
  </div>

  <h3>1. 왜 두 일정표가 생겼나 (2025~2026 타임라인)</h3>
  <div class="box note">
    <ul>
      <li><strong>2025-05-29</strong> HHS 장관 지시로 CDC 일정표의 건강한 6개월~17세 코로나19 접종이 "공동 임상 의사결정(SCDM)"으로 바뀜(법원이 이 부분은 정지하지 않음).</li>
      <li><strong>2025-12-05 → 12-16</strong> 재구성된 ACIP가 8:3으로 HBsAg 음성 산모의 신생아 B형간염 출생접종을 "개별 의사결정"으로 변경 의결, CDC 대행 국장 승인. 같은 날 Kaiser는 "출생 시 B형간염 백신을 계속 제공" 공식 입장. <a class="src" href="https://about.kaiserpermanente.org/news/the-importance-of-hepatitis-b-vaccination-for-newborns">Kaiser</a></li>
      <li><strong>2026-01-05</strong> CDC/HHS 소아 일정표 전면 개편: 일상 권장을 11개 질환으로 축소, 로타·독감·코로나·A형간염·B형간염·수막구균은 SCDM, RSV는 고위험군으로. <a class="src" href="https://www.contemporarypediatrics.com/view/cdc-changes-childhood-vaccine-schedule-recommends-fewer-vaccines-for-all-children">Contemporary Pediatrics</a></li>
      <li><strong>2026-01-26</strong> AAP 2026 일정표 발행(Pediatrics, 12개 단체 지지). 같은 날 CDPH와 서부해안 보건연합(CA·OR·WA·HI)이 AAP 일정표 채택. 캘리포니아 주법(Health and Safety Code §120164)으로 AAP 권고가 주 권고가 되어 보험 적용 보장. <a class="src" href="https://www.cdph.ca.gov/Programs/OPA/Pages/NR26-006.aspx">CDPH NR26-006</a> <a class="src" href="https://www.aap.org/en/news-room/news-releases/aap/2026/american-academy-of-pediatric-issues-recommended-childhood-and-adolescent-immunization-schedule-for-2026/">AAP 보도자료</a></li>
      <li><strong>2026-03-16</strong> 매사추세츠 연방지법 예비적 금지명령(AAP v. Kennedy): 2026-01-05 개편, ACIP 위원 임명, 재구성 ACIP의 모든 표결(B형간염 변경 포함) 효력 정지. CDC 사이트는 2025년판(2025-07-02 갱신)을 표시. <a class="src" href="https://hpmmatters.publichealth.gwu.edu/american-academy-pediatrics-et-al-v-kennedy-et-al">GWU 소송 추적</a></li>
      <li><strong>2026-10-06</strong> 제1순회항소법원 구두변론. 판결은 2026-10-19 현재 미정. ACIP는 2025-12 이후 회의가 없어 2026~27 연방 독감·코로나 지침도 미발표. <a class="src" href="https://www.medicaldaily.com/aap-kennedy-vaccine-lawsuit-paused-october-6-appeal-478666">Medical Daily</a></li>
    </ul>
  </div>

  <h3>3. 우리 아기 접종 캘린더 (2026-12-28 출생, AAP 2026 + Kaiser 관행)</h3>
  <div class="tbl"><table>
    <tr><th>시기(예상 날짜)</th><th>백신</th><th>비고·마감</th></tr>
    <tr><td>출생 (분만 입원 중)</td><td><strong>HepB 1차</strong>(24시간 이내, ≥2,000 g) · <strong>RSV 항체</strong> 니르세비맙 50 mg(&lt;5 kg) 또는 클레세로비맙 105 mg</td><td>RSV 항체는 퇴원 전, 늦어도 2027-01-04까지. 엄마가 2026-12-14 이전에 Abrysvo(임신 32~36주)를 맞았다면 불필요 <a class="src" href="https://www.cdc.gov/rsv/hcp/vaccine-clinical-guidance/infants-young-children.html">CDC RSV 지침</a></td></tr>
    <tr><td>1~2개월 (2027-01-28~02-28)</td><td>HepB 2차</td><td>Kaiser는 보통 2개월 방문에서 Pediarix에 포함(혼합백신 사용 시 총 4회 허용)</td></tr>
    <tr><td>2개월 (2027-02-28 전후, 최소 6주 = 2027-02-08)</td><td><strong>DTaP·IPV·HepB(Pediarix) + Hib + PCV(15/20) + 로타 1차(경구)</strong></td><td><strong>로타 1차 마감 생후 14주 6일 = 2027-04-11</strong>(15주 0일 이후 시작 금지)</td></tr>
    <tr><td>4개월 (2027-04-28 전후)</td><td>Pediarix + Hib + PCV + 로타 2차</td><td>Rotarix(RV1)면 2차로 완료</td></tr>
    <tr><td>6개월 (2027-06-28 전후)</td><td>Pediarix 3차(= HepB 3차, 최소 24주 이후) + Hib(제품 따라) + PCV + 로타 3차(RotaTeq)</td><td>로타 최종 마감 8개월 0일 = 2027-08-28. 이때부터 독감·코로나 접종 가능 연령</td></tr>
    <tr><td>6~11개월 (2027년 9~11월)</td><td><strong>인플루엔자 2회</strong>(4주 이상 간격, 첫 시즌)</td><td>아기가 6개월이 되는 2027년 6월은 시즌이 끝난 뒤라 첫 독감 접종은 2027년 가을, 출시 즉시 10월 말까지 <a class="src" href="https://www.healthychildren.org/English/news/Pages/aap-%28influenza%29-flu-prevention-recommendations-for-2026-27.aspx">AAP 독감 2026-27</a></td></tr>
    <tr><td>6개월 이후</td><td><strong>코로나19</strong>: AAP는 6~23개월 Moderna 2회(0, 4~8주) / CDC는 SCDM</td><td>2027~28 절기 제품·연령 허가는 그때 확인. 부모가 실제로 "선택"하는 유일한 항목</td></tr>
    <tr><td>9개월 (2027-09-28)</td><td>정기 백신 없음</td><td>발달 선별검사 방문(Day 10)</td></tr>
    <tr><td>12개월 (2027-12-28 전후, 12~15개월 창)</td><td><strong>MMR 1차 + 수두 1차 + A형간염 1차</strong> + Hib 추가 + PCV 4차</td><td>A형간염 2차는 6개월 뒤. DTaP 4차는 15~18개월. MMR+수두를 따로 맞을지 MMRV로 맞을지는 선택(MMRV 1차는 열성경련 약간↑)</td></tr>
    <tr><td>두 번째 RSV 시즌 (2027-10~)</td><td>니르세비맙 200 mg</td><td><strong>고위험군만</strong>(32주 미만 조산, 만성폐질환, 선천성심질환 등). 건강한 아기는 불필요</td></tr>
  </table></div>

  <h3>4. 백신별 핵심</h3>
  <ul>
    <li><strong>B형간염</strong>: 산모 HBsAg 음성이면 0 / 1~2 / 6~18개월 3회. 출생체중 2,000 g 미만이면 1개월 또는 퇴원 시 1차. 산모가 양성·미상이면 12시간 이내 HepB + HBIG. 영아기 감염은 약 90%가 만성화되므로 출생접종이 안전망입니다. <a class="src" href="https://www.cdc.gov/hepatitis-b/hcp/vaccine-administration/index.html">CDC</a></li>
    <li><strong>RSV 예방(둘 중 하나)</strong>: ① 산모 Abrysvo(임신 32~36주, 9월~3월; 항체 전달에 약 14일) 또는 ② 영아 항체 니르세비맙(Beyfortus, &lt;5 kg 50 mg / ≥5 kg 100 mg)·클레세로비맙(Enflonsia, 105 mg). 입원 예방 효과 80~90%. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/immunizations/Pages/RSV-immunizations-new-ways-to-protect-babies.aspx">AAP RSV</a> <a class="src" href="https://www.fda.gov/news-events/press-announcements/fda-approves-new-drug-prevent-rsv-babies-and-toddlers">FDA Beyfortus</a></li>
    <li><strong>로타바이러스(경구)</strong>: Rotarix 2회(2·4개월) 또는 RotaTeq 3회(2·4·6개월). 15주 0일 이후 시작 금지, 최종 8개월 0일. 금기: 중증복합면역결핍(SCID), 장중첩증 병력. <a class="src" href="https://www.cdc.gov/vaccines/hcp/imz-best-practices/contraindications-precautions.html">CDC 금기</a></li>
    <li><strong>DTaP·IPV·Hib·PCV</strong>: DTaP 5회(2·4·6, 15~18개월, 4~6세), IPV 2·4·6~18개월·4~6세, Hib 4회(PedvaxHIB는 3회), PCV15/20 4회(2·4·6·12~15개월).</li>
    <li><strong>인플루엔자</strong>: 6개월 이상 매년. 첫해는 2회(4주 이상 간격). 달걀 알레르기여도 모든 독감백신 가능.</li>
    <li><strong>12개월 MMR·수두·A형간염</strong>: MMR 12~15개월·4~6세, 수두 12~15개월·4~6세, A형간염 12~23개월 2회(최소 6개월 간격). 해외여행 시 6~11개월에 MMR·A형간염 1회 조기 접종 가능(이후 정규 시리즈 다시). 한국 방문 계획이 있으면 소아과에 미리 말하세요.</li>
  </ul>

  <h3>5. 혼합백신·동시접종·금기·접종 후</h3>
  <ul>
    <li><strong>혼합백신</strong>: Pediarix(DTaP+HepB+IPV), Pentacel(DTaP+IPV+Hib), Vaxelis(DTaP+IPV+Hib+HepB), ProQuad(MMRV). 개별 백신과 같은 안전성·효과로 시험되며 주사 횟수를 줄입니다. MMRV 1차는 4세 미만에서 열성경련이 약간 더 많아 CDC는 1차를 MMR+수두 분리 권장. <a class="src" href="https://www.cdc.gov/vaccines-children/about/combination-vaccines.html">CDC</a></li>
    <li><strong>동시접종</strong>: 여러 백신을 한 번에 맞아도 면역계에 과부하가 아닙니다. 2개월 검진에서 보통 7~8개 질환 백신을 함께 맞습니다. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/immunizations/Pages/Multiple-Vaccinations-at-One-Time.aspx">AAP</a></li>
    <li><strong>연기 사유가 아닌 것</strong>: 미열·콧물·기침·중이염·가벼운 설사, 항생제 복용 중. 중등도·중증 급성질환은 회복 후로. 이전 접종에 아나필락시스 → 금기. <a class="src" href="https://www.cdc.gov/vaccines-children/before-during-after-shots/when-your-child-is-sick.html">CDC</a></li>
    <li><strong>접종 후</strong>: 주사부위 통증·붓기, 미열, 보챔, 24시간 정도 식욕 저하가 흔합니다. 시원한 젖은 수건, 수분 자주. 해열제는 <strong>접종 후</strong> 의사와 상의해 사용. <strong>접종 전 예방적 해열제는 권장하지 않습니다</strong>(항체 반응 저하, Prymula 2009). 통증 완화는 안고 있기·모유수유·주의 분산. <a class="src" href="https://www.cdc.gov/vaccines-children/before-during-after-shots/index.html">CDC</a> <a class="src" href="https://pubmed.ncbi.nlm.nih.gov/19837254/">Lancet 2009</a></li>
    <li><strong>주의</strong>: 생후 3개월 미만 아기가 38.0°C 이상이면 접종 후라도 바로 연락합니다(Day 8). 2개월 접종 후 열은 흔하지만 규칙은 같습니다. 부작용 신고는 VAERS. <a class="src" href="https://vaers.hhs.gov/">VAERS</a></li>
  </ul>

  <h3>6. 기록 확인과 학교 요건</h3>
  <ul>
    <li>Kaiser: kp.org·앱의 Records → Immunizations에서 조회·출력. 캘리포니아 등록부 CAIR2에 자동 보고되고, 부모는 Digital Vaccine Record(myvaccinerecord.cdph.ca.gov)로 QR·PDF를 받습니다. <a class="src" href="https://myvaccinerecord.cdph.ca.gov/">Digital Vaccine Record</a></li>
    <li>보육시설·학교 요건(Shots for School)은 "연방 변경에도 캘리포니아 요건은 동일". <a class="src" href="https://www.cdph.ca.gov/Programs/CID/DCDC/Pages/Immunization/School/shotsforschool.aspx">CDPH</a></li>
  </ul>

  <h3>7. 안전성 근거</h3>
  <ul>
    <li>VAERS는 누구나 신고하는 수동 시스템(인과관계 판단 자료 아님), VSD는 CDC와 Kaiser NCAL 등 11개 의료기관의 전자의무기록 기반 능동 감시입니다. 우리 아기가 다니는 Kaiser NCAL이 바로 VSD 참여기관입니다. <a class="src" href="https://www.cdc.gov/vaccine-safety-systems/vsd/index.html">CDC VSD</a></li>
    <li>AAP가 정리한 근거: 2002 Madsen(덴마크 53만 명, MMR-자폐 무관), 2014 Taylor 메타분석(125만 명, 인과관계 없음), 2015 Jain(JAMA, 자폐 형제가 있어도 MMR 무관), 2025 Andersson(덴마크 120만 명, 알루미늄 함유 백신과 신경발달장애 무관). 동시접종은 면역계를 약화시키지 않고, 백신은 SIDS를 유발하지 않습니다. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/immunizations/Pages/vaccine-studies-examine-the-evidence.aspx">AAP 근거 정리</a> <a class="src" href="https://www.healthychildren.org/English/safety-prevention/immunizations/Pages/Weighing-the-Risks-and-Benefits.aspx">AAP 위험·이익</a></li>
    <li><strong>주의</strong>: CDC의 "자폐와 백신" 페이지는 2025-11 이후 문구가 바뀌어 현재 "'백신은 자폐를 일으키지 않는다'는 주장은 근거 기반이 아니다"라고 적혀 있습니다. 이는 위 대규모 연구 결과 및 AAP·WHO 입장과 상충하므로, 설명 자료로는 AAP 페이지를 권합니다. <a class="src" href="https://www.cdc.gov/vaccine-safety/about/autism.html">CDC 자폐 페이지</a></li>
  </ul>

  <div class="box tip"><h4>한국에 갈 가능성이 있다면</h4><p>미국 기록은 CAIR Digital Vaccine Record(영문 PDF/QR)와 kp.org 출력본으로 확보해 두면 제품명(Pediarix, PCV20, RotaTeq 등)과 접종일이 적혀 있어 한국 의료진이 해석할 수 있습니다. 귀국 후 거주지 보건소에 영문 기록을 가져가 예방접종통합관리시스템 등록을 요청하면 예방접종도우미에서 남은 일정이 안내됩니다(문의 1339). 추가로 챙길 것은 BCG(피부검사 필요 가능)와 일본뇌염(12개월~). 등록 절차의 공식 안내문은 이번에 확인하지 못했으니 보건소에서 최종 확인하세요.</p></div>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>"뉴스에서 연방 일정이 바뀌었다더라"로 2개월 접종을 미루기 (캘리포니아·Kaiser 기준은 AAP)</li>
      <li>로타 1차를 생후 15주 이후로 미루기 (이후엔 시작 불가)</li>
      <li>접종 전에 "미리" 해열제 먹이기</li>
      <li>콧물·미열을 이유로 접종을 연기하기 (가벼운 질환은 연기 사유가 아님)</li>
      <li>RSV 항체주사를 "백신이 아니니까" 건너뛰기 (12월생은 첫 시즌 대상)</li>
      <li>접종 후 3개월 미만 아기의 38°C 이상 열을 "접종 열이겠지"로 넘기기</li>
      <li>한국 가족의 "BCG 안 맞았으니 큰일"에 당황하기 (미국엔 일정에 없고, 귀국 시 가능)</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 2026년 캘리포니아에서 아기 접종의 공식 기준은?</p><div class="opts"><button type="button" class="opt">CDC 2026-01-05 축소 일정표</button><button type="button" class="opt">부모가 원하는 것만</button><button type="button" class="opt">AAP 2026 일정표(CDPH 공식 채택, 보험 적용 유지)</button><button type="button" class="opt">한국 일정표</button></div><p class="exp" hidden>정답 3. CDPH가 2026-01-26 AAP 일정표를 채택했고 주법으로 보험 적용을 보장합니다. CDC 축소판은 법원 명령으로 정지 중입니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 12월 28일생 아기의 RSV 예방으로 맞는 것은?</p><div class="opts"><button type="button" class="opt">6개월 이후 RSV 백신</button><button type="button" class="opt">엄마가 Abrysvo를 안 맞았다면 출생 1주 이내 니르세비맙(Beyfortus) 등 항체주사 1회</button><button type="button" class="opt">2개월 검진 때 다른 백신과 함께</button><button type="button" class="opt">필요 없다</button></div><p class="exp" hidden>정답 2. 10~3월 출생아는 분만 입원 중 또는 1주 이내. 엄마가 분만 14일 전까지 Abrysvo를 맞았다면 불필요합니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 로타바이러스 1차 접종을 시작할 수 있는 마지막 시점은?</p><div class="opts"><button type="button" class="opt">생후 14주 6일(우리 아기 2027-04-11)</button><button type="button" class="opt">생후 6개월</button><button type="button" class="opt">돌 전 아무 때나</button><button type="button" class="opt">생후 8개월</button></div><p class="exp" hidden>정답 1. 15주 0일 이후엔 시작할 수 없고, 최종 접종은 8개월 0일까지입니다. 2개월 검진을 제때 가는 이유입니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 2개월 접종 당일 아기가 콧물이 조금 나고 체온은 37.4°C입니다.</p><div class="opts"><button type="button" class="opt">접종을 2주 미룬다</button><button type="button" class="opt">해열제를 먼저 먹이고 접종한다</button><button type="button" class="opt">접종은 하되 로타만 뺀다</button><button type="button" class="opt">가벼운 질환은 연기 사유가 아니므로 예정대로 접종한다</button></div><p class="exp" hidden>정답 4. 미열·콧물·기침·가벼운 설사·항생제 복용 중은 연기 사유가 아닙니다. 예방적 해열제는 항체 반응을 낮출 수 있어 권장하지 않습니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 한국 일정에는 있고 미국 일정에는 없는 영아 백신은?</p><div class="opts"><button type="button" class="opt">로타바이러스</button><button type="button" class="opt">BCG(4주 이내)와 일본뇌염(12개월~)</button><button type="button" class="opt">B형간염</button><button type="button" class="opt">PCV</button></div><p class="exp" hidden>정답 2. 나머지 0~12개월 일정은 거의 같습니다. 반대로 RSV 항체와 영유아 코로나19는 미국에만 있습니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q6. 2개월 접종 후 저녁에 생후 9주 아기의 직장 체온이 38.3°C입니다.</p><div class="opts"><button type="button" class="opt">접종 열이니 타이레놀 먹이고 재운다</button><button type="button" class="opt">내일 아침까지 지켜본다</button><button type="button" class="opt">3개월 미만 발열 규칙대로 advice nurse에 바로 전화한다</button><button type="button" class="opt">찬물로 닦는다</button></div><p class="exp" hidden>정답 3. 접종 후 열이 흔하긴 하지만 3개월 미만의 38°C 이상은 예외 없이 연락합니다. 의사가 8주 이상 아기의 접종 후 열에 아세트아미노펜을 승인할 수 있습니다.</p></div>
  </div>

  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-star"/></svg><div><div class="eyebrow">Day 10 · 1년의 지도</div><h2>발달·놀이·성장, 그리고 흔한 병</h2><p class="lead">소아과 검진에서 무엇을 보는지, 월령별로 "대부분의 아기가 하는 것"과 "기다리지 말고 물어볼 신호"는 무엇인지, 성장곡선은 어떻게 읽는지, 그리고 첫 1년에 만나는 흔한 병의 빨간불을 한 표에 모았습니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>검진 일정: <strong>3~5일, 1, 2, 4, 6, 9, 12개월</strong>(AAP Bright Futures = Kaiser). 9개월엔 발달 선별검사(ASQ), 12개월엔 빈혈·납 검사.</li>
      <li>CDC 2022 이정표는 "75% 이상의 아기가 그 월령까지 하는 것"입니다. 하나라도 못 하거나 <strong>하던 것을 못 하게 되면</strong> 기다리지 말고 선별검사를 요청하세요.</li>
      <li>대략: 사회적 미소 2개월, 고개 가누기 4개월, 뒤집기 4~6개월, 혼자 앉기 6~9개월, 기기 7~10개월, 잡고 서기 9~12개월, 걷기 9~15개월.</li>
      <li>성장은 <strong>백분위 숫자가 아니라 자기 곡선을 따라가는지</strong>가 핵심. 2세 미만은 WHO 성장표준(한국 2017 성장도표도 동일).</li>
      <li>18개월 미만은 영상통화 외 <strong>화면 금지</strong>. 가장 좋은 자극은 말 걸기·책 읽기·터미타임·까꿍입니다.</li>
    </ol>
  </div>

  <h3>2. 발달 이정표 (CDC "Learn the Signs. Act Early." 2022 개정)</h3>
  <p>2022 개정 체크리스트는 "아이의 75% 이상이 해당 월령까지 하는 것"을 기준으로 삼습니다(평균이 아니라 '대부분'). 한 가지라도 못 하거나, 하던 것을 못 하게 되면 "기다리지 말고" 의사에게 발달 선별검사를 요청하세요. <a class="src" href="https://www.cdc.gov/act-early/milestones/index.html">CDC</a></p>
  <div class="tbl"><table>
    <tr><th>월령</th><th>사회·정서</th><th>언어·의사소통</th><th>인지</th><th>운동·신체</th></tr>
    <tr><td><strong>2개월</strong></td><td>말 걸거나 안아주면 진정; 얼굴 바라봄; <strong>말 걸거나 웃어주면 미소(사회적 미소)</strong></td><td>울음 외 소리 냄; 큰 소리에 반응</td><td>움직이는 사람을 눈으로 따라감; 장난감을 몇 초 바라봄</td><td>엎드려 고개 듦; 양팔·양다리 움직임; 손을 잠깐 폄</td></tr>
    <tr><td><strong>4개월</strong></td><td>관심 끌려고 스스로 미소; 웃기려 하면 킥킥; 눈 맞춤·소리로 관심 유지</td><td>"우-" "아-" 옹알이; 말 걸면 소리로 응답; 목소리 쪽으로 고개 돌림</td><td>배고프면 젖·젖병 보고 입 벌림; 자기 손을 흥미롭게 봄</td><td>안으면 <strong>고개를 흔들림 없이 가눔</strong>; 손에 쥐어준 장난감 잡음; 손을 입으로; 엎드려 팔꿈치로 상체 들기</td></tr>
    <tr><td><strong>6개월</strong></td><td>낯익은 사람 알아봄; 거울 보기 좋아함; 소리 내어 웃음</td><td>소리 주고받기; 입술 떨며 "푸르르"; 꺅 소리</td><td>물건을 입에 넣어 탐색; 원하는 장난감에 손 뻗음; 더 안 먹겠다고 입 다묾</td><td><strong>엎드린 자세에서 등으로 뒤집기</strong>; 엎드려 팔 펴고 밀어 올리기; 앉혀주면 손으로 짚고 버팀</td></tr>
    <tr><td><strong>9개월</strong></td><td><strong>낯선 사람에게 수줍어하거나 매달림(낯가림)</strong>; 이름 부르면 봄; 부모가 떠나면 반응; 까꿍에 웃음</td><td>다양한 소리로 옹알이("마마바바바"); 안아달라고 팔 듦</td><td><strong>시야에서 떨어진 물건 찾음(대상영속성)</strong>; 두 물건 맞부딪침</td><td><strong>혼자 앉기</strong>; 물건 손에서 손으로 옮김; 손가락으로 음식 긁어모음</td></tr>
    <tr><td><strong>12개월</strong></td><td>짝짜꿍 같은 놀이 함께 함</td><td>"빠이빠이" 손 흔듦; 엄마·아빠를 "마마/다다"로 부름; "안 돼" 이해(잠시 멈춤)</td><td>컵에 블록 넣기; 숨기는 것을 본 물건 찾기</td><td><strong>잡고 일어서기; 가구 잡고 걷기</strong>; 컵 잡아주면 마심; <strong>엄지·검지로 집기</strong></td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/act-early/milestones/2-months.html">CDC 2개월</a> <a class="src" href="https://www.cdc.gov/act-early/milestones/4-months.html">4개월</a> <a class="src" href="https://www.cdc.gov/act-early/milestones/6-months.html">6개월</a> <a class="src" href="https://www.cdc.gov/act-early/milestones/9-months.html">9개월</a> <a class="src" href="https://www.cdc.gov/act-early/milestones/1-year.html">12개월</a> · CDC Milestone Tracker 앱(영어)으로 기록해 검진 때 보여 줄 수 있습니다.</p>
  <ul>
    <li><strong>대략적 범위</strong>: 사회적 미소 ~2개월(6~8주), 고개 가누기 4개월, 뒤집기 4~6개월, 혼자 앉기 6~9개월, 기기 7~10개월(일부는 기기를 건너뛰고 걷기도 함), 잡고 서기·가구 잡고 걷기 9~12개월, 혼자 걷기 9~15개월.</li>
    <li><strong>12개월 주의 신호(AAP)</strong>: 기지 않음, 기면서 한쪽 몸을 한 달 이상 끎, 잡아줘도 서지 못함, 숨긴 물건을 찾지 않음, "마마/다다" 같은 단어가 없음, 손 흔들기·고개 젓기 같은 제스처가 없음, 가리키기를 안 함. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Developmental-Milestones-12-Months.aspx">AAP</a></li>
    <li><strong>조기개입</strong>: 캘리포니아 Early Start(출생~36개월, 무료 평가) — BabyLine 800-515-2229. Redwood City는 Golden Gate Regional Center(San Mateo 650-524-4500)가 담당합니다. 소아과 의뢰 없이 부모가 직접 연락해도 됩니다. <a class="src" href="https://www.dds.ca.gov/services/early-start/">CA Early Start</a> <a class="src" href="https://www.ggrc.org/">GGRC</a></li>
  </ul>

  <h3>3. 놀이와 자극: 월령별</h3>
  <ul>
    <li><strong>출생부터</strong>: 말 걸기·책 읽어주기·노래(한국어로 충분합니다). 깨어 있을 때 보호자가 보는 터미타임. 2개월까지는 흑백 대비 그림·얼굴 바라보기.</li>
    <li><strong>4~6개월</strong>: 손 뻗을 장난감, 소리 주고받기, 거울. <strong>6~9개월</strong>: 까꿍, 물건 숨기기, 앉아서 놀기, 다양한 질감. <strong>9~12개월</strong>: 컵에 넣기·꺼내기, 짝짜꿍, 가리키며 이름 말해주기, 잡고 서기 유도. <a class="src" href="https://www.cdc.gov/act-early/milestones/index.html">CDC</a></li>
    <li><strong>화면</strong>: AAP는 18개월 미만에서 영상통화 외 화면 시청을 피하라고 합니다(한국 조부모와 영상통화는 예외). 달래기·재우기·먹이기 용도로 화면을 쓰지 말고, 보게 된다면 함께 보며 이야기합니다. <a class="src" href="https://www.healthychildren.org/English/family-life/Media/Pages/Why-to-Avoid-TV-Before-Age-2.aspx">AAP</a> <a class="src" href="https://www.healthychildren.org/English/family-life/Media/Pages/infants-and-screen-time-5-cs-questions-to-ask.aspx">AAP 영아 화면 지침(2024)</a></li>
    <li>이중언어: 집에서 한국어, 밖에서 영어를 듣는 것은 발달을 늦추지 않습니다. 각 언어를 자연스럽게, 많이 들려주면 됩니다(베싸TV 언어 영상 참고).</li>
  </ul>

  <h3>4. 성장: 숫자와 곡선 읽기</h3>
  <div class="tbl"><table>
    <tr><th>시기</th><th>체중</th><th>신장</th><th>머리둘레</th></tr>
    <tr><td>출생(37~40주)</td><td>2.5~4.0 kg</td><td>–</td><td>약 35 cm</td></tr>
    <tr><td>생후 1주</td><td>7~10% 감소 → <strong>2주 전후 출생체중 회복</strong></td><td></td><td></td></tr>
    <tr><td>0~1개월</td><td>약 28 g/일(≈200 g/주)</td><td>+3.8~5 cm</td><td>1개월 약 38 cm</td></tr>
    <tr><td>1~4개월</td><td>0.7~0.9 kg/월(≈150~200 g/주)</td><td>+2.5~4 cm/월</td><td>+1.25 cm/월</td></tr>
    <tr><td>4~6개월</td><td>약 450~560 g/월로 둔화; <strong>출생체중 2배는 대략 4~6개월</strong></td><td>+2 cm/월</td><td></td></tr>
    <tr><td>6~12개월</td><td>6개월경 ≤10 g/일; <strong>첫돌에 출생체중 3배</strong></td><td>첫돌 71~81 cm(첫해 +약 24 cm)</td><td>첫돌 약 46 cm</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://kidshealth.org/en/parents/grownewborn.html">KidsHealth</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/First-Month-Physical-Appearance-and-Growth.aspx">AAP 1개월</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Physical-Appearance-and-Growth-8-to-12-Months.aspx">AAP 8~12개월</a> <a class="src" href="https://www.mymlc.com/health-information/faqs/i/infant-growth-whats-normal">Mayo Clinic Care Network</a></p>
  <ul>
    <li><strong>성장도표</strong>: 미국은 2세 미만에 WHO 성장표준(수유 방식 무관)을 씁니다. 한국 「2017 소아청소년 성장도표」도 0~35개월에 WHO 표준을 채택했으므로 Kaiser 차트와 같은 기준입니다. <a class="src" href="https://www.cdc.gov/growth-chart-training/hcp/using-growth-charts/who-using.html">CDC</a> <a class="src kr" href="https://kdca.go.kr/kdca/5458/subview.do">질병관리청 성장도표</a></li>
    <li><strong>백분위 해석</strong>: 10백분위든 90백분위든 낮은 숫자 자체가 문제가 아닙니다. 핵심은 <strong>자기 곡선을 따라가는지</strong>, 백분위 선을 크게 가로질러 떨어지는지입니다. 건강한 아기도 체중이 잠시 정체되거나 약간 줄 수 있습니다.</li>
  </ul>

  <h3>5. 첫 1년에 만나는 흔한 병: 빠른 참조</h3>
  <div class="tbl"><table>
    <tr><th>질환</th><th>핵심</th><th>연락·응급</th></tr>
    <tr><td>감기</td><td>생후 2년간 8~10회가 보통. 식염수 + 흡입기. 감기약 금지(4세 미만)</td><td><strong>3개월 이하는 첫 증상부터 연락</strong>; 빠른·힘든 호흡, 입술 청색, 콧물 10~14일 이상, 처짐 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/ear-nose-throat/Pages/Children-and-Colds.aspx">AAP</a></td></tr>
    <tr><td>RSV·세기관지염</td><td>2세 전 거의 모두 감염. 3~5일째 최악, 7~14일. 1세 미만 입원 1위. 항생제·스테로이드 무효</td><td>무호흡·호흡곤란, 창백·청색, 8시간에 기저귀 1개 미만, 3개월 미만 38°C <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/chest-lungs/Pages/RSV-When-Its-More-Than-Just-a-Cold.aspx">AAP</a></td></tr>
    <tr><td>중이염</td><td>3세 전 5/6이 경험. 귀 통증(밤에 심함), 발열, 수면 장애. 귀 잡아당기기만으로는 판단 불가. 약 80%는 자연 호전, 2세 미만은 항생제 흔함</td><td>귀에서 진물, 고열·심한 통증, 48~72시간 후 악화 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/ear-nose-throat/Pages/Ear-Infection-Information.aspx">AAP</a></td></tr>
    <tr><td>결막염·눈물길 막힘</td><td>세균성(누런 분비물, 아침에 눈 붙음)·바이러스성·알레르기성. 신생아 눈물 고임·눈곱은 눈물길 막힘이 흔하고 대부분 자연 개통(마사지)</td><td>신생아 눈 분비물·부종은 진료; 눈 주위 붉게 붓고 열 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/eyes/Pages/Pinkeye-Conjunctivitis.aspx">AAP</a></td></tr>
    <tr><td>아구창(thrush)</td><td>닦이지 않는 흰 반점(칸디다). 항진균제, 젖꼭지·공갈젖꼭지 소독, 수유모 유두 치료</td><td>9개월 이후 반복 시 진료 <a class="src" href="https://kidshealth.org/en/parents/thrush.html">KidsHealth</a></td></tr>
    <tr><td>역류(GER) vs GERD</td><td>토해도 잘 크고 편안하면 'happy spitter'(질병 아님). 4~5개월 최고, 9~12개월 소실. 트림·수유 후 30분 세우기·소량 자주</td><td>수유 거부·등 젖히며 울기, 피·초록 토, 분수토 증가, 쌕쌕·기침, 체중 부진 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/abdominal/Pages/GERD-Reflux.aspx">AAP</a></td></tr>
    <tr><td>변비 vs 뜸한 변</td><td>변비 = 딱딱하고 힘든 변. <strong>모유 아기는 며칠~1주 변이 없어도 부드러우면 정상</strong>. 이유식 후 자두·배</td><td>피 섞인 딱딱한 변, 10분 이상 힘줘도 안 나옴 <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Pooping-By-the-Numbers.aspx">AAP</a></td></tr>
    <tr><td>설사·탈수</td><td>대부분 바이러스. 모유·분유 계속. 중등도 이상이면 시판 경구수액(Pedialyte; 주스·스포츠음료 대체 불가). 2세 미만 지사제 금지</td><td>탈수 징후, 혈변, 12~24시간 이상 구토, 초록·커피색 토, 배 팽만 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/abdominal/Pages/Diarrhea.aspx">AAP</a></td></tr>
    <tr><td><strong>장중첩증</strong></td><td>5~9개월에 가장 흔함(2세 미만 복부 응급 1위). 갑자기 심하게 울며 무릎 당기기 → 멈춤 반복, 구토, 처짐, <strong>'건포도 젤리' 혈변</strong>. 초음파 후 관장으로 대부분 정복</td><td><strong>즉시 응급실</strong> <a class="src" href="https://kidshealth.org/en/parents/intussusception.html">KidsHealth</a></td></tr>
    <tr><td><strong>유문협착증</strong></td><td>생후 3~5주 시작. 수유 직후 <strong>분수토</strong>, 토한 뒤 다시 배고파함, 체중 감소. 첫째 남아·가족력. 초음파 진단, 수술</td><td>분수토 반복·탈수 → 당일 진료 <a class="src" href="https://kidshealth.org/en/parents/pyloric-stenosis.html">KidsHealth</a></td></tr>
    <tr><td>아토피피부염·습진</td><td>아동 1/4. 두피·볼·이마부터. 무향 보습제 매일 듬뿍, 짧은 미온욕, 처방 시 국소스테로이드. 음식이 원인은 아니지만 식품 알레르기 동반 많음(Day 11 땅콩 조기 도입)</td><td>진물·감염 징후, 수면 방해 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/skin/Pages/Eczema.aspx">AAP</a></td></tr>
    <tr><td>기저귀 발진 / 지루성 피부염</td><td>자극성(접힌 부위는 멀쩡) → 자주 갈기·공기 말리기·산화아연 두껍게. 칸디다성(접힌 곳이 더 붉고 경계 뚜렷) → 항진균제. 두피 노란 비늘(cradle cap)은 오일로 불려 솔질</td><td>2~3일 치료에도 악화, 물집·고름·발열 <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Diaper-Rash.aspx">AAP</a></td></tr>
    <tr><td><strong>열성 경련</strong></td><td>6개월~5세(12~18개월 최다), 38°C 이상 발열 시. 대개 수 분 내 멈춤. <strong>옆으로 눕히고, 입에 아무것도 넣지 말고, 붙잡지 말고, 시간 재기</strong></td><td><strong>5분 이상, 청색증·호흡곤란, 24시간 내 재발 → 911</strong>; 끝난 뒤 원인 확인 진료 <a class="src" href="https://kidshealth.org/en/parents/febrile.html">KidsHealth</a></td></tr>
    <tr><td>돌발진(roseola)</td><td>6~24개월. 3~5일 고열 후 열 내리며 몸통 발진(가렵지 않음)</td><td>깨우기 힘들 정도 처짐, 수분 섭취 불량 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/skin/Pages/Roseola-Infantum.aspx">AAP</a></td></tr>
    <tr><td>수족구</td><td>발열·입안 물집·손발·엉덩이 발진. 첫 주 전염력 최고</td><td>3일 이상 발열, 수분 섭취 못 함 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/infections/Pages/Hand-Foot-and-Mouth-Disease.aspx">AAP</a></td></tr>
    <tr><td>탈장</td><td>배꼽탈장: 울면 볼록, 통증 없음, 12~18개월 내 대개 닫힘. 서혜부탈장: 수술 필요</td><td>서혜부 덩어리가 단단·통증·구토(감돈) → 응급 <a class="src" href="https://kidshealth.org/en/parents/hernia.html">KidsHealth</a></td></tr>
    <tr><td>잠복고환</td><td>만삭 남아 1~3%. 6개월까지 자연 하강 가능</td><td>6개월에도 안 내려오면 비뇨기과, 18개월 이내 수술 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/genitourinary-tract/Pages/Undescended-Testicles.aspx">AAP</a></td></tr>
    <tr><td>고관절 이형성증</td><td>여아·첫아이·역아·가족력. 6개월 미만 치료는 Pavlik 보조기. 속싸개는 다리가 자유롭게</td><td>다리 길이 차이·주름 비대칭·'딸깍' <a class="src" href="https://kidshealth.org/en/parents/ddh.html">KidsHealth</a></td></tr>
    <tr><td>사경·납작머리</td><td>터미타임, 머리 방향 바꾸기, 카시트·바운서 시간 줄이기. 사경은 스트레칭·물리치료</td><td>목이 한쪽으로 기울고 반대쪽으로 잘 안 돌아감 <a class="src" href="https://kidshealth.org/en/parents/torticollis.html">KidsHealth</a></td></tr>
    <tr><td>설소대(tongue-tie)</td><td>많은 아기는 수유 문제 없음. 젖을 자꾸 놓침·딸깍 소리·체중 부진 등 <strong>수유 문제가 있을 때만</strong> 절제 고려</td><td>체중 증가 부진 <a class="src" href="https://kidshealth.org/en/parents/tongue-tie.html">KidsHealth</a></td></tr>
    <tr><td>요로감염</td><td>영아는 <strong>원인 모를 발열·보챔</strong>만 보이기도. 소변은 도뇨로 채취, 6개월 미만은 입원 가능</td><td>발열 + 수유 불량·반복 구토·심한 보챔 <a class="src" href="https://kidshealth.org/en/parents/urinary.html">KidsHealth</a></td></tr>
    <tr><td>수막염</td><td>신생아: 발열·식욕부진·처짐·보챔(미묘함). 영아: 발열·구토·졸림·발진·경련. Hib·PCV 백신이 예방</td><td>즉시 응급 <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/head-neck-nervous-system/Pages/Meningitis.aspx">AAP</a></td></tr>
  </table></div>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>"옆집 아기는 벌써 기는데"로 비교하기 (75% 기준은 범위가 넓습니다)</li>
      <li>반대로, 하던 것을 못 하게 됐는데 "크면 괜찮아지겠지" 하고 기다리기</li>
      <li>백분위 숫자 하나로 "작다/크다" 걱정하기 (곡선을 보세요)</li>
      <li>18개월 전 달래기·재우기 용도로 영상 틀어 주기</li>
      <li>보행기·점퍼루에 오래 앉혀 두기 (발달에 도움 안 되고 위험)</li>
      <li>열성 경련 때 입에 손가락·숟가락 넣기, 붙잡기</li>
      <li>건포도 젤리 같은 혈변·분수토를 "체했나" 하고 넘기기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="1"><p class="qq">Q1. CDC 2022 발달 이정표의 "기준"은?</p><div class="opts"><button type="button" class="opt">아기의 50%가 하는 평균 시점</button><button type="button" class="opt">아기의 75% 이상이 그 월령까지 하는 것</button><button type="button" class="opt">가장 빠른 아기 기준</button><button type="button" class="opt">한국 아기 평균</button></div><p class="exp" hidden>정답 2. 그래서 하나라도 못 하면 "기다리지 말고" 선별검사를 요청하라는 의미입니다. 하던 것을 못 하게 되는 퇴행은 언제나 주의 신호입니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q2. 생후 9개월 검진에서 특별히 하는 것은?</p><div class="opts"><button type="button" class="opt">MMR 접종</button><button type="button" class="opt">납 검사</button><button type="button" class="opt">청력 정밀검사</button><button type="button" class="opt">발달 선별검사(ASQ 등), 정기 백신은 없음</button></div><p class="exp" hidden>정답 4. 9개월은 백신 없이 발달 선별검사와 낯가림·기기를 확인하는 방문입니다. 한국 영유아검진 3차(9~12개월)의 K-DST와 대응됩니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 아기 체중이 25백분위에서 계속 25백분위를 따라갑니다.</p><div class="opts"><button type="button" class="opt">자기 곡선을 따라가므로 정상</button><button type="button" class="opt">평균(50) 아래이니 분유를 늘린다</button><button type="button" class="opt">성장 호르몬 검사가 필요하다</button><button type="button" class="opt">모유가 부족한 것이다</button></div><p class="exp" hidden>정답 1. 백분위 숫자가 아니라 곡선 추적이 핵심입니다. 백분위 선을 크게 가로질러 떨어질 때가 평가 대상입니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q4. 7개월 아기가 갑자기 심하게 울며 무릎을 당기다 멈추기를 반복하고, 기저귀에 건포도 젤리 같은 변이 있습니다.</p><div class="opts"><button type="button" class="opt">장염이니 수분 보충</button><button type="button" class="opt">이앓이</button><button type="button" class="opt">장중첩증 의심, 즉시 응급실</button><button type="button" class="opt">내일 소아과</button></div><p class="exp" hidden>정답 3. 5~9개월에 가장 흔한 복부 응급입니다. 초음파 후 관장으로 대부분 정복되지만 지체하면 장이 괴사할 수 있습니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 14개월 아기가 열이 나면서 몸이 뻣뻣해지고 떨립니다(열성 경련).</p><div class="opts"><button type="button" class="opt">입에 숟가락을 물려 혀를 보호한다</button><button type="button" class="opt">옆으로 눕히고 아무것도 입에 넣지 않고 시간을 잰다. 5분 넘으면 911</button><button type="button" class="opt">꽉 붙잡아 멈추게 한다</button><button type="button" class="opt">찬물에 담근다</button></div><p class="exp" hidden>정답 2. 대개 수 분 내 멈춥니다. 5분 이상, 청색증, 24시간 내 재발이면 911. 끝난 뒤엔 원인 확인을 위해 진료합니다.</p></div>
  </div>

<section class="day" data-day="14" id="d14" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-cap"/></svg><div><div class="eyebrow">Day 14 · 졸업</div><h2>0–12개월 로드맵과 졸업 체크</h2><p class="lead">13일 동안 배운 것을 월별 한 장으로 접습니다. 아기가 자라는 동안 이 표를 다시 열어 "지금" 줄을 보면 됩니다. 아래 졸업 체크리스트를 둘이 함께 채우면 과정 끝입니다.</p></div></header>

  <h3>1. 월별 로드맵 (출생일 기준으로 "지금" 줄이 표시됩니다)</h3>
  <div class="tbl"><table>
    <tr><th>월령</th><th>수유</th><th>수면</th><th>발달·놀이</th><th>접종·검진</th><th>안전·할 일</th></tr>
    <tr data-month="0"><td><strong>0~1개월</strong></td><td>8~12회/일, 밤 4시간 넘기면 깨우기. 5일 이후 기저귀 6개+. 비타민 D 400 IU. 분유는 70°C 물 조제</td><td>14~17시간, 밤낮 없음. 등 대고, 맨 침대, 같은 방 다른 침대. 터미타임 시작</td><td>얼굴 바라보기, 소리 반응. 말 걸기·노래</td><td>출생 HepB·RSV 항체. 3~5일·1개월 검진(체중·황달·산모 우울)</td><td>3개월 미만 발열 38°C = 즉시 전화. 탯줄 건조 관리, 스펀지 목욕. 방문객 규칙. 서류: 보험 31일·영사관 1개월</td></tr>
    <tr data-month="1"><td><strong>1~2개월</strong></td><td>울음 정점(6~8주, 하루 3시간). 성장 급등기·집중수유. 분유 90~120 mL × 6~8회</td><td>속싸개 중단 시기 관찰(뒤집기 조짐). 밤낮 구분 돕기 시작</td><td>사회적 미소(6~8주). 흑백 대비 그림</td><td>2개월 검진·1차 접종 묶음(Pediarix+Hib+PCV+로타). 로타 1차 마감 14주 6일</td><td>PURPLE 울음: 흔들지 않기, 감당 안 되면 내려놓기. 공갈젖꼭지(3~4주~). 산후우울 체크</td></tr>
    <tr data-month="2"><td><strong>2~3개월</strong></td><td>분유 120~180 mL × 5~7회. 젖병 소독은 2개월 지나면 매일 필수 아님</td><td>3개월쯤 6~8시간 연속 수면 가능. 뒤집기 조짐 → 속싸개 중단</td><td>옹알이 시작, 손 바라보기, 고개 가누기 연습</td><td>2개월 접종 후 열 관리(3개월 미만 규칙 유지)</td><td>12주부터 의사 OK 시 아세트아미노펜 가능. 산책 자유. 엄마 6주 검진</td></tr>
    <tr data-month="3"><td><strong>3~4개월</strong></td><td>수유 간격 늘어남, 밤중 수유 줄기 시작</td><td>4개월 수면 퇴행(1~2주). drowsy-but-awake 시작</td><td>4개월: 고개 가누기, 킥킥 웃음, 장난감 잡기. 거울</td><td>4개월 검진·2차 접종. 철분 드롭 상담(모유), 땅콩 조기 도입 상담(습진 있으면)</td><td>모빌 제거(5개월 전), 배시넷→크립 준비. 교환대 절대 혼자 두지 않기</td></tr>
    <tr data-month="4"><td><strong>4~5개월</strong></td><td>출생체중 2배 전후. 이유식 준비 신호 관찰(목 가누기·앉기·관심)</td><td>12~16시간, 낮잠 3~4회</td><td>뒤집기(4~6개월), 손 뻗기, 소리 주고받기</td><td>—</td><td>손·무릎으로 일어서면 배시넷 졸업. 가구 고정 시작</td></tr>
    <tr data-month="5"><td><strong>5~6개월</strong></td><td>6개월: 이유식 시작(철분 먼저: 고기·철분 시리얼). 땅콩·계란 조기 도입. 물 소량 컵</td><td>6개월 이후 본격 수면교육 가능. 밤중 수유 중단은 소아과와</td><td>엎드려→등 뒤집기, 앉혀주면 버팀, 낯익은 사람 알아봄</td><td>6개월 검진·3차 접종. 첫 이 나면 불소치약 쌀알 크기·불소 바니시. 독감·코로나 가능 연령</td><td>아기방어 1차(콘센트·찬장·계단문·블라인드 코드리스). 자외선차단제 가능. 하이체어 식사, 질식 식품 금지</td></tr>
    <tr data-month="6"><td><strong>6~7개월</strong></td><td>이유식 1→2회, 퓨레. 모유·분유 24~32 oz. 단일 재료 3~5일 간격</td><td>낮잠 2~3회. 취침 루틴 고정</td><td>첫 이(6개월 전후), 소리 내어 웃기, 물건 입으로 탐색</td><td>6개월 접종 후. 로타 최종 마감 8개월 0일</td><td>이부프로펜 가능(6개월~). 열성 경련 대처 숙지. 장중첩증 빨간불(5~9개월)</td></tr>
    <tr data-month="7"><td><strong>7~8개월</strong></td><td>으깬 음식·핑거푸드(8개월 전후, 손가락 모양 스틱). 2~3회 식사. 요거트·치즈 가능</td><td>분리불안으로 밤에 깨기 흔함, 짧게 토닥이고 나오기</td><td>혼자 앉기 준비, 손에서 손으로 옮기기, 옹알이 다양해짐</td><td>—</td><td>기기 시작 전 아기방어 완료. 작은 물건·버튼 배터리 바닥 점검</td></tr>
    <tr data-month="8"><td><strong>8~9개월</strong></td><td>3회 식사 + 간식 1~2회. 컵 연습</td><td>낮잠 2회</td><td>9개월: 혼자 앉기, 낯가림, 대상영속성, 까꿍, "마마바바바"</td><td>9개월 검진·발달 선별검사(ASQ). 정기 백신 없음</td><td>첫 독감 시즌(2027년 9~11월) 2회 접종. 한국 조부모 방문 시 접종 확인</td></tr>
    <tr data-month="9"><td><strong>9~10개월</strong></td><td>잘게 썬 가족 음식. 10개월까지 덩어리 시작 못 하면 섭식 지연 위험</td><td>밤 9~12시간</td><td>기기(7~10개월), 잡고 서기, 손가락으로 집기</td><td>첫 치과(첫 이 후 6개월 내, 돌 전)</td><td>잡고 서기 시작: 크립 매트리스 최저 단, 창문 가드, 모서리 보호대</td></tr>
    <tr data-month="10"><td><strong>10~11개월</strong></td><td>식사 3회 + 간식 2회. 젖병 줄이기 계획</td><td>—</td><td>가구 잡고 걷기, 짝짜꿍, 가리키기, "빠이빠이"</td><td>—</td><td>가스레인지 손잡이 커버, 문 끼임 방지. 돌잔치 준비</td></tr>
    <tr data-month="11"><td><strong>11~12개월</strong></td><td>돌 준비: 전지 우유 전환(16~24 oz), 젖병 떼기(12~18개월)</td><td>11~14시간 쪽으로</td><td>"마마/다다", "안 돼" 이해, 컵에 블록 넣기, 걷기 준비(9~15개월)</td><td>12개월 검진: MMR·수두·A형간염·Hib·PCV, 빈혈·납 검사</td><td>12개월 주의 신호 확인(기지 않음, 단어 없음, 제스처 없음). 아들: 체류 증빙 보관</td></tr>
    <tr data-month="12"><td><strong>12개월 · 돌</strong></td><td>가족 식사, 꿀 해금, 우유 24 oz 이하</td><td>낮잠 2회→1회로 가는 중(12~18개월)</td><td>혼자 걷기(9~15개월), 첫 단어</td><td>MMR·수두 1차 완료. 2차 RSV 시즌은 고위험군만. DTaP 4차 15~18개월</td><td>걷기 시작 후 안전 재점검. 졸업 축하</td></tr>
  </table></div>

      <li class="ck"><input type="checkbox" class="cb" id="c-g5" data-id="g5"><div><label for="c-g5" class="t">분유를 CDC 방식으로 타고, 보관 기한과 젖병 세척·소독을 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g6" data-id="g6"><div><label for="c-g6" class="t">기저귀 갈기·변 색깔 차트·발진 대처, 스펀지 목욕과 통목욕 순서를 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g7" data-id="g7"><div><label for="c-g7" class="t">울음 달래기 순서와 "감당이 안 될 때 내려놓는 법", 부부 교대 신호를 정했다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g8" data-id="g8"><div><label for="c-g8" class="t">우리 아기 접종 캘린더(출생·2·4·6·12개월, 로타 마감)와 한국과의 차이를 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g9" data-id="g9"><div><label for="c-g9" class="t">월령별 이정표와 "기다리지 말아야 할 신호", Early Start 연락처를 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g10" data-id="g10"><div><label for="c-g10" class="t">이유식 시작 신호, 철분 먼저, 땅콩·계란 조기 도입, 질식 식품, 불소치약 쌀알을 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g11" data-id="g11"><div><label for="c-g11" class="t">집안 아기방어 타임라인과 영아 CPR 30:2를 알고, CPR 수업을 예약했다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g12" data-id="g12"><div><label for="c-g12" class="t">엄마 응급 경고 신호 7가지와 산후우울증 신호, 도움 전화번호를 안다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g13" data-id="g13"><div><label for="c-g13" class="t">Kaiser advice nurse·Poison Control·Early Start 번호를 두 사람 폰에 저장했다</label><div class="by"></div></div></li>
      <li class="ck"><input type="checkbox" class="cb" id="c-g14" data-id="g14"><div><label for="c-g14" class="t">조부모·도우미에게 수면·흔들기·뽀뽀·접종 규칙을 공유했다</label><div class="by"></div></div></li>
    </ul>
  </section>

  <h3>종합 퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 생후 10일, 직장 체온 38.1°C, 잘 먹습니다.</p><div class="opts"><button type="button" class="opt">타이레놀 1.25 mL</button><button type="button" class="opt">이마 체온계로 재확인 후 관찰</button><button type="button" class="opt">즉시 advice nurse → 응급실</button><button type="button" class="opt">옷을 벗기고 아침에 소아과</button></div><p class="exp" hidden>정답 3. 3개월 미만 발열은 예외 없이 즉시 평가. 해열제를 먼저 쓰지 않습니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q2. 생후 3주, 밤중 수유 후 엄마가 소파에서 아기를 안은 채 졸립니다.</p><div class="opts"><button type="button" class="opt">아빠가 받아서 아기 침대에 등 대고 눕힌다 (소파 동침은 최대 67배 위험)</button><button type="button" class="opt">쿠션으로 받쳐 둔다</button><button type="button" class="opt">그대로 둔다</button><button type="button" class="opt">부모 침대로 옮겨 같이 잔다</button></div><p class="exp" hidden>정답 1. 소파·안락의자에서 함께 잠드는 것이 가장 위험합니다. 밤중 수유는 소파가 아닌 곳에서, 끝나면 아기 침대로.</p></div>
    <div class="q" data-a="3"><p class="qq">Q3. 생후 6주 분유 아기, 하루 총 750 mL를 먹고 체중이 잘 늡니다. 기저귀 7개.</p><div class="opts"><button type="button" class="opt">너무 많이 먹는다</button><button type="button" class="opt">너무 적게 먹는다</button><button type="button" class="opt">분유를 바꿔야 한다</button><button type="button" class="opt">정상 범위(2~4주 480~720 mL, 1~2개월 600~900 mL)</button></div><p class="exp" hidden>정답 4. 체중과 기저귀가 정상이면 양은 아기가 정합니다. 하루 32 oz(950 mL)를 넘는 날이 계속될 때만 상의.</p></div>
    <div class="q" data-a="1"><p class="qq">Q4. 생후 2개월 검진 날짜가 2027-02-28입니다. 가족 여행으로 2027-04-20으로 미루려 합니다.</p><div class="opts"><button type="button" class="opt">괜찮다, 2개월 정도 차이는 문제없다</button><button type="button" class="opt">로타 1차 마감(14주 6일 = 2027-04-11)을 넘기므로 여행 전에 접종한다</button><button type="button" class="opt">로타만 빼고 나중에 맞으면 된다</button><button type="button" class="opt">한국 가서 맞는다</button></div><p class="exp" hidden>정답 2. 로타는 15주 0일 이후 시작할 수 없습니다. 다른 백신도 2개월 접종이 늦어질수록 백일해 등 위험이 큽니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q5. 6개월, 습진이 없는 아기. 첫 이유식 일주일째 쌀미음만 먹고 있습니다.</p><div class="opts"><button type="button" class="opt">한 달 더 쌀미음만</button><button type="button" class="opt">과일 퓨레로 바꾼다</button><button type="button" class="opt">소고기·오트밀 등 철분 식품을 더하고 땅콩·계란도 묽게 소량 시작한다</button><button type="button" class="opt">돌까지 알레르겐은 금지</button></div><p class="exp" hidden>정답 3. 6개월엔 철분이 바닥나고, 알레르겐은 늦출수록 알레르기가 늡니다. 쌀만 오래 먹이면 비소 노출도 문제입니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q6. 9개월 아기가 혼자 앉지 못하고 옹알이가 거의 없습니다.</p><div class="opts"><button type="button" class="opt">기다리지 말고 소아과에 발달 선별검사를 요청하고, 필요하면 Early Start(800-515-2229)에 직접 연락</button><button type="button" class="opt">돌까지 기다린다</button><button type="button" class="opt">남자아이는 원래 늦다</button><button type="button" class="opt">보행기로 연습시킨다</button></div><p class="exp" hidden>정답 1. 9개월 이정표(혼자 앉기, 다양한 옹알이)를 못 하면 선별검사 대상입니다. 조기개입은 무료이고 부모가 직접 의뢰할 수 있습니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q7. 출산 후 10일째 엄마가 "내가 쓸모없고 아기한테 미안하다"며 매일 울고 잠을 못 잡니다.</p><div class="opts"><button type="button" class="opt">baby blues이니 2주 더 지켜본다</button><button type="button" class="opt">산후우울증 가능성이 있으니 Kaiser 산과·정신건강에 바로 연락하고, 자해 생각이 있으면 988</button><button type="button" class="opt">미역국을 더 먹인다</button><button type="button" class="opt">친정 엄마에게만 말한다</button></div><p class="exp" hidden>정답 2. baby blues는 가볍고 2주 내 사라집니다. 매일 울고 수면·식사가 무너지고 죄책감이 크면 치료가 필요한 산후우울증일 수 있습니다(Day 13).</p></div>
    <div class="q" data-a="3"><p class="qq">Q8. 아기가 태어났습니다. 아빠가 첫 한 달 안에 반드시 끝내야 할 서류는?</p><div class="opts"><button type="button" class="opt">미국 여권</button><button type="button" class="opt">한국 여권</button><button type="button" class="opt">529 개설</button><button type="button" class="opt">Kaiser·HR 보험 추가(31일), 한국 영사관 출생신고(1개월), 출생증명서 5부 구매</button></div><p class="exp" hidden>정답 4. 여권 둘은 인증본과 수리 통보 뒤의 일입니다. 아빠 할 일 탭의 마감 줄을 보세요.</p></div>
  </div>

  <div class="box ok"><h3>졸업</h3><p>14일 동안 읽고 풀었다면 미국 소아과에서 쓰는 기준은 대부분 들어본 것이 됐습니다. 아기가 태어나면 이 페이지는 "공부"가 아니라 "참고"로 바뀝니다. 월별 로드맵의 "지금" 줄, Day 8의 분류표, Day 13의 엄마 경고 신호 세 곳만 즐겨찾기해 두세요. 모르는 것은 Kaiser advice nurse에게 물어보는 것이 정답이고, 그 전화는 아무리 자주 해도 괜찮습니다.</p></div>

<section class="day" data-day="5" id="d5" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-foot"/></svg><div><div class="eyebrow">Day 5 · 하루 10번</div><h2>기저귀·배변·피부</h2><p class="lead">하루 8~12번 하는 일이라 금방 손에 익지만, 변 색깔과 발진의 종류는 알고 봐야 보입니다. 아빠가 처음부터 맡기 가장 좋은 영역입니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>하루 <strong>8~12회</strong>. 대변은 즉시, 소변은 2~3시간마다 확인. 여아는 <strong>앞에서 뒤로</strong>.</li>
      <li>N 사이즈는 1~2팩만, <strong>1호를 주력</strong>으로. 허벅지 자국·새는지로 사이즈를 올립니다.</li>
      <li>변 색은 노랑·녹색·갈색이면 모두 정상. <strong>빨강(피)·흰색/회색·생후 4일 이후 검정</strong>만 소아과.</li>
      <li>발진은 자주 갈기 + 공기 노출 + <strong>산화아연이나 바셀린 두껍게</strong>. 선명하게 붉고 주변에 점이 있으면 곰팡이(칸디다) → 소아과. 파우더·항생제 연고는 쓰지 않습니다.</li>
      <li>피부는 무향 제품, 비누 최소. "매일 보습이 아토피를 예방한다"는 근거는 엇갈리므로 건조할 때 바르면 됩니다.</li>
    </ol>
  </div>

  <h3>1. 기저귀 갈기 7단계</h3>
  <ol class="steps">
    <li>준비: 새 기저귀, 무향 물티슈(또는 젖은 면 수건), 발진 크림, 갈아입힐 옷, 방수 패드. 손 씻기. 모두 손 닿는 곳에 둔 뒤 눕힙니다.</li>
    <li>한 손으로 두 발목을 잡아 엉덩이를 살짝 들고, 펼친 새 기저귀를 헌 기저귀 아래에 깔아 둡니다(탭이 등 쪽).</li>
    <li>헌 기저귀 앞면으로 큰 변을 먼저 걷어낸 뒤, 헌 기저귀를 접어 아기 밑에 두고(새 소변 받이) 물티슈로 닦습니다. <strong>여아는 반드시 앞→뒤</strong>.</li>
    <li>남아: 찬 공기에 소변이 뿜어져 나오니 수건·헌 기저귀로 덮고 작업하고, 새 기저귀를 채울 때 음경을 아래로 향하게(새는 것 방지).</li>
    <li>헌 기저귀·물티슈를 아기 손 안 닿는 곳에 치우고, 피부를 톡톡 두드려 완전히 말린 뒤 필요하면 크림.</li>
    <li>새 기저귀 앞판은 배꼽 아래로(탯줄 떨어지기 전엔 접어 내리거나 NB 사이즈의 배꼽 커팅 사용), 뒤는 배꼽 높이까지, 양쪽 탭 대칭, 다리 주름 밴드를 밖으로 빼서 새지 않게.</li>
    <li>손 씻기. 생후 4개월 전엔 보통 뒤집지 못하지만 그래도 한 손은 항상 아기에게.</li>
  </ol>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Changing-Diapers.aspx">AAP 기저귀 갈기</a> <a class="src" href="https://kidshealth.org/en/parents/guide-parents.html">KidsHealth 신생아 가이드</a></p>

  <h3>2. 횟수·사이즈·브랜드</h3>
  <ul>
    <li>신생아는 하루 8~12회, 주 약 70개. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Changing-Diapers.aspx">AAP</a></li>
    <li>사이즈(Pampers 기준): N(Newborn) 4.5 kg 미만 · 1호 3.6~6.4 kg · 2호 4.5~10 kg · 3호 6~12 kg. 구간이 겹치니 허벅지 자국·새는지로 판단. 12월 말 출생아가 3.3 kg이면 2~4주 안에 1호. N은 1~2팩만 사고(병원에서도 줌) 1호를 주력으로. <a class="src" href="https://www.pampers.com/en-us/baby/diapers/article/diaper-size-and-weight-chart">Pampers 사이즈표</a></li>
    <li>미국 주요 브랜드: Pampers Swaddlers(병원 기본, 배꼽 커팅·소변 표시선), Huggies Little Snugglers, Kirkland(Costco, 가성비), Coterie(프리미엄 구독, 월 $95부터), Honest(식물성 소재). 피부 반응은 아기마다 달라 한 팩씩 시험.</li>
    <li>일회용 vs 천: AAP는 환경·발진 면에서 어느 쪽도 명확한 우위가 없다고 봅니다. 처음 3개월은 일회용이 현실적입니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Diapers-Disposable-or-Cloth.aspx">AAP</a></li>
    <li>물티슈는 무향·무염료, 발진 중엔 물티슈 대신 젖은 면 수건. 기저귀 쓰레기통은 편의품이지 필수는 아닙니다.</li>
  </ul>

  <h3>3. 변 색깔 차트</h3>
  <div class="tbl"><table>
    <tr><th>색·상태</th><th>의미</th><th>대응</th></tr>
    <tr><td>검고 끈적한 타르(태변)</td><td>생후 1~3일 정상</td><td>없음</td></tr>
    <tr><td>겨자색 노랑, 씨앗 같은 알갱이, 묽음</td><td>모유수유 아기 정상</td><td>없음</td></tr>
    <tr><td>황갈색~녹색 기운, 더 되직</td><td>분유수유 아기 정상</td><td>없음</td></tr>
    <tr><td>녹색·갈색 각종 변형</td><td>태변 이후 대체로 정상(철분·감기·이유식 영향)</td><td>잘 먹고 편안하면 관찰</td></tr>
    <tr><td><strong>빨강(피)</strong></td><td>항문 미세 찢어짐, 삼킨 엄마 피, 우유 단백 알레르기, 감염 등</td><td>"어떤 양이든" 소아과 평가</td></tr>
    <tr><td><strong>검정(생후 4일 이후)</strong></td><td>위장관 출혈 가능(철분제 복용이면 흔한 무해 원인)</td><td>소아과 연락</td></tr>
    <tr><td><strong>흰색·회색·점토색</strong></td><td>담도 폐쇄 등 간·담도 문제 신호</td><td>즉시 소아과(지체 금지)</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/english/ages-stages/baby/pages/the-many-colors-of-poop.aspx">AAP 변 색깔</a> · 첫 주 날짜별 기저귀 개수는 Day 1, 뜸한 변 vs 변비는 Day 10 표 참고. 생후 1개월 이후 모유 아기는 며칠에 한 번 변을 봐도 부드러우면 정상이지만, <strong>첫 1개월에 하루 1회 미만</strong>이면 모유 부족 신호일 수 있습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Pooping-By-the-Numbers.aspx">AAP</a></p>

  <h3>4. 기저귀 발진</h3>
  <ul>
    <li><strong>예방</strong>: 약 2시간마다 갈기(대변은 즉시), 톡톡 두드려 말리기, 하루 몇 번 기저귀 없이 공기 노출, 섬유유연제·건조기 시트 피하기. <a class="src" href="https://kidshealth.org/en/parents/diaper-rash.html">KidsHealth</a></li>
    <li><strong>치료</strong>: 산화아연(zinc oxide: Desitin, Triple Paste 등) 또는 바셀린(petrolatum: Aquaphor 등)을 <strong>두껍게</strong>. 더러워지지 않은 크림은 닦아내지 말고 위에 덧바릅니다. 무향 제품. 2~3일 안에 좋아지는 것이 보통. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Diaper-Rash.aspx">AAP</a></li>
    <li><strong>하지 말 것</strong>: 시판 항생제 연고(자극), 베이비파우더(AAP 치료 옵션에 없음, 흡입 위험).</li>
    <li><strong>곰팡이(칸디다) 발진 신호</strong>: 선명한 붉은색, 경계가 뚜렷, 주변에 작은 붉은 점(satellite lesions), 사타구니 주름 안쪽이 더 심함, 아기나 수유모가 항생제를 쓴 뒤 → 소아과(항진균 크림).</li>
    <li><strong>연락</strong>: 2~3일 치료해도 호전 없음·악화, 물집·고름·진물·껍질, 열 동반, 아파서 심하게 울 때.</li>
  </ul>

  <h3>5. 신생아 피부 관리</h3>
  <ul>
    <li>기본: 무향(fragrance-free) 제품, 비누 최소, 목욕 후 건조하면 무향 보습제. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Bathing-Your-Newborn.aspx">AAP</a></li>
    <li>"매일 보습이 아토피를 예방한다"는 근거는 엇갈립니다. 2014년 고위험군 소규모 시험은 6개월 아토피를 절반으로 줄였지만(22% vs 43%), 2020년 영국 BEEP 시험(1,394명)은 2세 습진에 차이가 없었고 1년차 피부 감염이 오히려 늘었습니다. 결론: 예방 목적의 "의무 보습"은 근거 부족. 건조·거칠면 바르고, 바를 땐 손을 씻고 깨끗한 통에서 덜어 씁니다. <a class="src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4180007/">2014 파일럿 RCT</a> <a class="src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7086156/">BEEP 2020</a></li>
    <li>이미 습진·아토피가 생겼다면 얘기가 다릅니다: 무향 보습제를 매일 듬뿍, 짧은 미온욕, 처방 시 국소 스테로이드(Day 10 표). 습진 아기는 땅콩 조기 도입 상담(Day 11).</li>
    <li>비립종·신생아 여드름·중독성 홍반·몽고반점은 치료 없이 사라집니다(Day 1 표). 짜거나 문지르지 않습니다.</li>
    <li>머리 모양(사두증) 예방: 깨어 있을 때 터미타임을 하루 총 1시간까지 늘리고, 안을 때 팔을 바꾸고, 침대에서 머리 방향을 번갈아. "짱구베개"·머리 모양 베개는 질식 위험이 있고 효과 근거도 없습니다(Day 2). <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/Cleft-Craniofacial/Pages/Positional-Skull-Deformities-and-Torticollis.aspx">AAP</a></li>
    <li>세탁: 아기 옷을 가족 빨래와 따로 할 필요는 없습니다(민감 피부가 아니라면). 무향·무염료 세제(Tide Free &amp; Gentle, All Free Clear, Dreft 등)로 바꾸고, 섬유유연제·정전기 시트는 피합니다. <a class="src" href="https://kidshealth.org/en/parents/laundry.html">KidsHealth</a></li>
  </ul>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>여아를 뒤에서 앞으로 닦기</li>
      <li>교환대에서 한 손 떼고 돌아서기 (안전띠를 채워도)</li>
      <li>베이비파우더 듬뿍, 시판 항생제 연고, 향 있는 물티슈·로션</li>
      <li>발진에 크림을 매번 닦아내고 새로 바르기 (덧바르기가 맞음)</li>
      <li>흰색·회색 변을 "분유 때문이겠지" 하고 넘기기</li>
      <li>짱구베개, 아기 옷에 섬유유연제</li>
      <li>비립종·여드름 짜기, 피부가 멀쩡한데 "예방"으로 하루 2번 전신 보습 강박</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 생후 3주 모유 아기의 변이 겨자색이고 씨앗 같은 알갱이가 섞여 묽습니다.</p><div class="opts"><button type="button" class="opt">설사이니 소아과</button><button type="button" class="opt">엄마가 매운 걸 먹어서</button><button type="button" class="opt">모유 아기의 정상 변</button><button type="button" class="opt">분유로 바꿔야 한다</button></div><p class="exp" hidden>정답 3. 모유 변은 원래 노랗고 묽고 알갱이가 있습니다. 걱정할 색은 빨강·흰색/회색·생후 4일 이후 검정입니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 기저귀 발진이 선명하게 붉고 경계가 뚜렷하며 주변에 작은 붉은 점이 흩어져 있고, 주름 안쪽이 더 심합니다.</p><div class="opts"><button type="button" class="opt">산화아연을 더 두껍게 바른다</button><button type="button" class="opt">칸디다(곰팡이) 발진 의심, 소아과에서 항진균 크림</button><button type="button" class="opt">파우더를 뿌린다</button><button type="button" class="opt">항생제 연고를 바른다</button></div><p class="exp" hidden>정답 2. 전형적인 칸디다 발진 소견입니다. 일반 발진 크림으로는 낫지 않고 항진균제가 필요합니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 기저귀 사이즈를 올려야 하는 신호는?</p><div class="opts"><button type="button" class="opt">허벅지에 붉은 자국이 남고 자주 샌다</button><button type="button" class="opt">생후 1개월이 됐다</button><button type="button" class="opt">포장에 적힌 최대 체중에 가까워졌다</button><button type="button" class="opt">변 색이 변했다</button></div><p class="exp" hidden>정답 1. 체중 구간은 겹치므로 자국과 새는지로 판단합니다. N은 1~2팩만, 1호를 주력으로 사 두세요.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 건강한 피부의 신생아에게 "아토피 예방"으로 하루 2번 전신 보습을 해야 할까요?</p><div class="opts"><button type="button" class="opt">반드시 해야 한다</button><button type="button" class="opt">절대 하면 안 된다</button><button type="button" class="opt">향 있는 로션이면 된다</button><button type="button" class="opt">근거가 엇갈리므로 의무는 아니고, 건조할 때 무향 보습제를 바르면 된다</button></div><p class="exp" hidden>정답 4. 2020년 대규모 BEEP 시험에서 예방 효과가 없었고 감염이 늘었습니다. 이미 습진이 있으면 매일 보습이 치료의 핵심입니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 남아 기저귀를 갈 때 새는 것을 줄이는 요령은?</p><div class="opts"><button type="button" class="opt">기저귀를 한 치수 크게</button><button type="button" class="opt">음경을 아래로 향하게 하고 다리 주름 밴드를 밖으로 빼기</button><button type="button" class="opt">탭을 느슨하게</button><button type="button" class="opt">파우더로 흡수</button></div><p class="exp" hidden>정답 2. 작업 중엔 수건으로 덮어 소변 분수도 막습니다. 탯줄이 있는 동안은 앞판을 접어 내립니다.</p></div>
  </div>

<section class="day" data-day="6" id="d6" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-duck"/></svg><div><div class="eyebrow">Day 6 · 손에 익히기</div><h2>목욕·탯줄·손톱·옷·환경</h2><p class="lead">목욕은 주 2~3회면 충분하고, 5~10분이면 끝납니다. 중요한 건 순서보다 "한 손은 항상 아기에게"와 물 온도입니다. 옷 겹수·방 온도·가습기·세탁까지 집 환경을 한 번에 정리합니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>첫 목욕은 출생 24시간 이후(WHO). 탯줄이 떨어질 때까지(1~3주) <strong>스펀지 목욕</strong>, 그 뒤 <strong>통목욕</strong>. 주 2~3회면 충분.</li>
      <li>물은 <strong>5 cm(2인치)</strong>, 온도는 손목·팔꿈치로 "따뜻하되 뜨겁지 않게"(약 37~38°C). 온수기는 49°C 이하. <strong>단 한 순간도 혼자 두지 않기.</strong></li>
      <li>탯줄은 <strong>마르게</strong>(알코올 불필요), 비포경 남아의 포피는 당기지 않기, 여아는 앞→뒤.</li>
      <li>옷은 <strong>어른보다 한 겹 더</strong>, 실내 모자 금지, 끈·리본 없는 옷. 세탁은 무향 세제, 섬유유연제 금지.</li>
      <li>손톱은 목욕 후·잠들었을 때 파일이나 아기 손톱깎이로. 손싸개는 꼭 필요할 때만 잠깐.</li>
    </ol>
  </div>

  <h3>1. 첫 목욕과 빈도</h3>
  <ul>
    <li>WHO는 출생 후 24시간 이후 첫 목욕을 권고합니다(체온·혈당 유지, 피부접촉·모유수유 정착). 미국 병원 대부분이 따르며, 병원에서 첫 목욕을 시켜 주고 방법을 보여 줍니다. 입원 중 "When is the first bath, and can we watch?"라고 물어보세요. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Bathing-Your-Newborn.aspx">AAP</a></li>
    <li>빈도: 첫 1년은 <strong>주 2~3회</strong>면 충분. 더 자주 하면 피부가 마릅니다. 기저귀 부위·주름·얼굴은 매일 닦아 주면 됩니다. 수유 직후는 피하고(서울아산병원: 수유 30분 후), 저녁 목욕은 수면 루틴에 도움. 아기가 통목욕을 싫어하면 1~2주 스펀지 목욕으로 돌아갔다 다시 시도. <a class="src" href="https://kidshealth.org/en/parents/guide-parents.html">KidsHealth</a> <a class="src kr" href="https://www.amc.seoul.kr/asan/healthtv/video/videoDetail.do?videoId=1318">서울아산병원 건강TV</a></li>
  </ul>

  <h3>2. 스펀지 목욕 (탯줄이 떨어질 때까지)</h3>
  <p>준비물: 미지근한 물 대야, 부드러운 수건 2장(닦는 용·덮는 용), 면 수건 2장, 기저귀, 갈아입힐 옷, 필요시 순한 무향 비누. 방은 따뜻하게, 외풍 없이.</p>
  <ol class="steps">
    <li>손을 씻고 준비물을 모두 손 닿는 곳에. 아기를 평평하고 안전한 곳에 눕히고, 높은 곳이면 한 손을 항상 아기에게.</li>
    <li>옷을 벗기되 수건으로 감싸 두고, 씻는 부위만 그때그때 드러냅니다(체온 유지).</li>
    <li>얼굴 먼저, 비누 없이 물만 적신 면 수건으로. 눈은 안쪽(코 쪽)에서 바깥쪽으로, 눈마다 수건의 깨끗한 면을 사용.</li>
    <li>귀·코는 바깥쪽만. 면봉을 귓구멍·콧구멍 안에 넣지 않습니다. <a class="src" href="https://kidshealth.org/en/parents/earwax.html">KidsHealth</a></li>
    <li>목·겨드랑이·팔꿈치·무릎 뒤·사타구니 주름: 젖과 땀이 고이는 곳이라 꼼꼼히, 닦은 뒤 톡톡 두드려 말립니다.</li>
    <li>몸통·팔다리 → 마지막에 기저귀 부위. 여아는 앞에서 뒤로.</li>
    <li>탯줄: 물로만 살짝 닦고 두드려 말립니다. 알코올은 필요 없고, 기저귀 앞단을 접어 탯줄 아래로.</li>
    <li>머리: 주 2~3회, 순한 베이비 샴푸 소량을 젖은 수건에 묻혀 두피를 문지르고 물수건으로 헹굽니다. 바로 수건으로 머리를 덮어 체온을 지킵니다.</li>
  </ol>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Bathing-Your-Newborn.aspx">AAP 신생아 목욕</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Umbilical-Cord-Care.aspx">AAP 탯줄 관리</a></p>

  <h3>3. 통목욕 (탯줄이 떨어지고, 포경수술 부위가 아문 뒤)</h3>
  <p>준비물: 단단한 플라스틱 영아 욕조(2017-10-02 이후 제조 = 현행 안전기준) 또는 싱크대 인서트. <strong>목욕 의자(bath seat)는 뒤집혀 익사 사고가 나므로 AAP가 쓰지 말라고 합니다.</strong> 수건, 면 수건, 무향 비누·샴푸, 물 끼얹을 컵, 기저귀·옷.</p>
  <ol class="steps">
    <li>방을 따뜻하게 하고 물을 <strong>5 cm(2인치)</strong>만 받습니다. 흐르는 수돗물 아래에서 씻기지 않습니다(온도 급변).</li>
    <li>온도: 손목 안쪽·팔꿈치로 "따뜻하되 뜨겁지 않게". 온도계를 쓰면 약 37~38°C(100°F) 선. 서울아산병원은 38~40°C로 안내하니 38°C 전후가 양쪽 모두에 맞습니다. 집 온수기는 49°C(120°F) 이하.</li>
    <li>옷을 벗기자마자 발부터 넣고, 한 손으로 머리·목을 받칩니다. 몸 대부분은 물 밖이므로 컵으로 따뜻한 물을 자주 끼얹어 체온 유지.</li>
    <li>순서(AAP): 얼굴·머리를 부드러운 수건으로 먼저 → 몸은 위에서 아래로, 주름 부위 꼼꼼히 → 기저귀 부위 마지막. 한국 병원은 체온 손실을 줄이려 머리를 맨 나중에 감기기도 합니다. 어느 쪽이든 <strong>5~10분 안에</strong> 끝내는 것이 핵심.</li>
    <li>생식기: 여아는 앞→뒤로 물로만. 포경수술 안 한 남아는 포피를 절대 뒤로 당기지 말고 겉만(자연 분리에 수개월~수년). <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Care-for-an-Uncircumcised-Penis.aspx">AAP</a></li>
    <li>포경수술 한 남아: 아물 때까지(보통 1주 전후) 기저귀 갈 때마다 따뜻한 물로만 닦고(물티슈 X) 바셀린+거즈. 붉은기가 며칠 지나 심해지거나 고름 물집이 생기면 즉시 소아과.</li>
    <li>비누는 소량, 중성 pH, 무향. 쓰면 바로 헹굽니다. 끝나면 바로 수건으로 감싸 톡톡 두드려 말리고, 건조하면 무향 보습제.</li>
    <li><strong>절대 혼자 두지 않기.</strong> 전화·초인종이 울리면 아기를 수건에 싸서 데리고 갑니다. 아기는 몇 cm 물에서도 익사합니다.</li>
  </ol>

  <p>지루성 두피(cradle cap): 치료가 필요 없는 경우가 대부분. 격일 순한 샴푸, 부드러운 솔로 각질 떼기, 심하면 미네랄오일·코코넛오일·바셀린을 밤새 바르고 아침에 감기기. 긁어 떼지 않습니다. 진물·고름·냄새·몸 전체 발진이면 소아과. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Cradle-Cap.aspx">AAP</a></p>
  <div class="box note"><h4>한국 자료와 다른 점</h4><p>서울아산병원 영상은 탯줄을 매일 알코올 솜으로 소독하고 실내 26~28°C를 권하지만, AAP는 "깨끗하고 마르게만, 알코올 불필요", 실내는 과열 금지(20~22°C, 목욕하는 동안만 잠깐 따뜻하게)입니다. 미국 소아과 지시를 따르세요. 한국 조부모께는 "여기 병원이 이렇게 하라고 했다"로 설명하면 쉽습니다.</p></div>

  <h3>4. 손톱과 손싸개</h3>
  <ul>
    <li>첫 몇 주는 주 2회 정도 깎을 만큼 빨리 자랍니다. 목욕 후 부드러울 때나 잠들었을 때, 에머리보드(파일)·아기 손톱깎이·끝이 둥근 가위로. 손끝 살을 아래로 눌러 깎고 모서리는 파일로. 입으로 물어뜯지 않습니다(헤르페스 손가락 감염 위험). 발톱은 월 1~2회. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Nail-Care-Fingers-and-Toes.aspx">AAP</a> <a class="src" href="https://kidshealth.org/en/parents/trimming-nails.html">KidsHealth</a></li>
    <li>손싸개(mittens): AAP·Nemours 모두 손싸개 대신 "손톱을 짧게"를 해법으로 제시합니다. 손 탐색·입에 손 넣기(자기 진정)를 막으므로 꼭 필요할 때만 잠깐.</li>
  </ul>

  <h3>5. 옷·실내 온도·습도·공기·세탁</h3>
  <ul>
    <li><strong>옷</strong>: 같은 환경에서 어른보다 한 겹만 더. 24°C(75°F) 미만이면 속옷+기저귀+우주복(또는 잠옷)+속싸개/슬립색, 24°C 이상이면 한 겹. 끈·리본·목 조이는 디자인 금지, 신축성 좋은 원단. 퇴원 후 실내 모자 금지. 과열 신호는 땀, 뜨거운 가슴, 홍조. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Dressing-Your-Newborn.aspx">AAP 옷 입히기</a></li>
    <li><strong>실내 온도</strong>: AAP는 "가볍게 입은 어른이 편안한 온도"와 과열 신호 관찰을 기준으로 하고, 흔히 20~22°C(68~72°F)로 안내합니다. 영국 Lullaby Trust는 16~20°C. 어느 쪽이든 아기 가슴·목 뒤를 만져 확인(Day 2 표).</li>
    <li><strong>습도</strong>: EPA 기준 실내 상대습도 60% 미만, 이상적으로 30~50%. <a class="src" href="https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home">EPA</a></li>
    <li><strong>가습기</strong>: 찬 안개(cool-mist)만(온풍식은 화상). 매일 물 비우고 말리기, 2~3일마다 희석 표백제로 세척, 증류수 사용, 아기침대에서 1 m 이상 떨어뜨리기, 방 크기에 맞는 용량. <a class="src" href="https://www.chop.edu/news/health-tip/vaporizer-or-humidifier-which-best">CHOP</a></li>
    <li><strong>공기</strong>: 실내외 금연(3차 흡연도 SIDS 위험), 향초·인센스·강한 방향제·디퓨저 금지.</li>
    <li><strong>세탁</strong>: 가족 빨래와 분리할 필요 없음. 무향·무염료 세제, 섬유유연제·정전기 시트 금지(Day 5). 새 옷은 첫 착용 전 한 번 세탁(일반 권고).</li>
    <li><strong>아기띠·포대기</strong>: T.I.C.K.S.(밀착, 얼굴 보이게, 입 맞출 높이, 턱 들리게, 등 지지)와 다리 M자(Day 12). 한국식 포대기도 M자와 얼굴 노출만 지키면 문제없습니다.</li>
  </ul>

  <h3>6. 0~3개월 필수 vs 불필요</h3>
  <div class="tbl"><table>
    <tr><th>구분</th><th>품목</th></tr>
    <tr><td>필수·안전</td><td>카시트(퇴원 필수), 단단하고 평평한 아기 침대/배시넷/플레이야드 + 맞는 시트(범퍼·베개·인형 금지)</td></tr>
    <tr><td>필수·수유</td><td>젖병 4~6개(모유라도 유축분 대비), 전용 세척 대야·솔, 유축기(Kaiser 제공), 분유 소량(비상용)</td></tr>
    <tr><td>필수·기저귀</td><td>N 1~2팩 + 1호, 무향 물티슈, 산화아연/바셀린 크림, 방수 패드</td></tr>
    <tr><td>필수·목욕</td><td>단단한 영아 욕조 또는 싱크 인서트, 면 수건, 무향 비누·샴푸 소량, 후드 타월</td></tr>
    <tr><td>필수·건강</td><td>디지털 직장 체온계, 식염수 + 벌브 흡입기(또는 NoseFrida), 아기 손톱 파일, 바셀린</td></tr>
    <tr><td>필수·옷</td><td>우주복·잠옷 6~8벌(N·0~3M 섞어서), 속싸개 2~3, 슬립색 2, 양말, 외출용 모자</td></tr>
    <tr><td>있으면 좋음</td><td>아기띠(M자 지원), 바운서(깨어 있을 때만), cool-mist 가습기, 기저귀 가는 매트, 백색소음기</td></tr>
    <tr><td><strong>불필요·위험</strong></td><td>짱구베개·머리 모양 베개, 침대 범퍼·포지셔너·경사 침대, 가중 담요/속싸개, 목욕 의자, 베이비파우더, 손싸개 다량, 젖병 소독기(끓이기로 충분), 물티슈 워머, 보행기, 공갈젖꼭지 끈</td></tr>
  </table></div>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>목욕 중 한 손 떼기, 목욕 의자 믿기, 흐르는 수돗물 아래서 씻기기</li>
      <li>탯줄 떨어지기 전 통목욕, 탯줄 알코올·과산화수소 소독</li>
      <li>면봉을 귀·코 안에 넣기</li>
      <li>비포경 남아 포피 젖히기, 포경 부위 물티슈로 닦기</li>
      <li>매일 뜨거운 물로 오래 목욕 (피부 건조)</li>
      <li>실내에서 모자, 어른 기준으로 두껍게 입히기, 방을 26°C 넘게 덥히기</li>
      <li>온풍식 가습기, 청소 안 한 가습기, 향초·디퓨저</li>
      <li>손톱을 입으로 물어뜯기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="1"><p class="qq">Q1. 생후 10일, 탯줄이 아직 붙어 있습니다. 목욕은?</p><div class="opts"><button type="button" class="opt">통목욕을 매일</button><button type="button" class="opt">탯줄이 떨어질 때까지 스펀지 목욕, 주 2~3회</button><button type="button" class="opt">탯줄만 물에 안 닿게 통목욕</button><button type="button" class="opt">목욕하지 않는다</button></div><p class="exp" hidden>정답 2. 탯줄은 1~3주에 떨어지며 그 전엔 물에 담그지 않습니다. 기저귀 부위·주름·얼굴은 매일 닦아 줍니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q2. 통목욕 물 깊이와 온도 확인법은?</p><div class="opts"><button type="button" class="opt">배까지 잠기게, 손가락으로</button><button type="button" class="opt">10 cm, 발로</button><button type="button" class="opt">약 5 cm(2인치), 손목 안쪽·팔꿈치로 "따뜻하되 뜨겁지 않게"(약 37~38°C)</button><button type="button" class="opt">깊이는 상관없고 40°C 이상</button></div><p class="exp" hidden>정답 3. 손목과 팔꿈치는 손바닥보다 온도에 민감합니다. 온수기는 49°C(120°F) 이하로 설정해 둡니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 포경수술을 하지 않은 남아의 생식기 세척은?</p><div class="opts"><button type="button" class="opt">포피를 당기지 않고 겉만 물로</button><button type="button" class="opt">포피를 뒤로 젖혀 안쪽까지 비누로</button><button type="button" class="opt">면봉으로 안쪽을 닦는다</button><button type="button" class="opt">알코올로 소독</button></div><p class="exp" hidden>정답 1. 포피는 수개월~수년에 걸쳐 저절로 분리됩니다. 억지로 당기면 찢어지고 흉터가 생깁니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 실내 21°C, 어른은 긴팔 티셔츠 한 장이 편합니다. 아기 옷은?</p><div class="opts"><button type="button" class="opt">긴팔 내복 + 우주복 + 담요 + 모자</button><button type="button" class="opt">반팔 바디수트만</button><button type="button" class="opt">어른과 똑같이 한 겹</button><button type="button" class="opt">어른보다 한 겹 더: 긴팔 내복(또는 바디수트) + 1.0 TOG 슬립색, 모자 없이</button></div><p class="exp" hidden>정답 4. 한 겹 더가 기준이고, 담요 대신 슬립색, 실내 모자는 금지. 가슴·목 뒤가 뜨겁거나 땀이 나면 한 겹 벗깁니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 가습기를 쓰려 합니다. 맞는 것은?</p><div class="opts"><button type="button" class="opt">온풍식이 세균이 적어 좋다</button><button type="button" class="opt">찬 안개(cool-mist), 매일 비우고 2~3일마다 세척, 증류수, 침대에서 1 m 이상</button><button type="button" class="opt">아기 침대 바로 옆에 둔다</button><button type="button" class="opt">습도 70%를 유지한다</button></div><p class="exp" hidden>정답 2. 온풍식은 화상 위험, 청소 안 한 가습기는 곰팡이·세균을 뿜습니다. 습도는 30~50%가 이상적입니다.</p></div>
  </div>

<section class="day" data-day="13" id="d13" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-bear"/></svg><div><div class="eyebrow">Day 13 · 부모 자신</div><h2>엄마 회복·산후우울·아빠의 역할</h2><p class="lead">조리원 없이 1~3일 만에 집으로 오는 미국에서는 아빠가 산후조리사이자 관찰자입니다. 엄마 몸의 회복 과정, 응급 경고 신호, 베이비블루스와 산후우울증의 차이, 그리고 한국식 산후조리를 근거에 맞게 조정하는 법을 배웁니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 6가지</h3>
    <ol>
      <li>오로(출혈)는 최대 6주. <strong>1시간에 패드 1장이 흠뻑</strong> 젖으면 응급.</li>
      <li>엄마 응급 신호 7가지(출혈·열 38°C·두통/시야·가슴 통증/숨참·다리 부종·절개부 감염·자해 생각)는 <strong>아빠가 외웁니다.</strong> 출산 후 1년까지 의료진에게 "출산한 지 N주"라고 말하게 하세요.</li>
      <li>베이비블루스(50~80%, 2주 내 사라짐)와 산후우울증(8명 중 1명, 2주 넘게 지속)은 다릅니다. 2주가 기준.</li>
      <li>아빠도 산후우울증(7~10%, 3~6개월 정점)이 옵니다. 짜증·분노·회피가 신호.</li>
      <li>아빠의 가장 큰 일은 <strong>엄마의 연속 수면 블록</strong>(밤 수유 1~2회를 유축분·분유로 맡기)과 방문객 게이트키핑.</li>
      <li>산후조리의 핵심(휴식·영양·감염 예방)은 미국 기준과 같습니다. 다만 <strong>미역국은 하루 2그릇 이내</strong>, 땀내기·누워만 있기는 근거가 없고, 아기 방을 덥히면 위험합니다.</li>
    </ol>
  </div>

  <h3>1. 몸의 회복: 오로·회음부·제왕절개</h3>
  <div class="tbl"><table>
    <tr><th>오로(lochia) 단계</th><th>시기</th><th>양상</th></tr>
    <tr><td>Rubra</td><td>출산 후 3~4일 이상</td><td>진한·선홍색, 생리보다 많음, 작은 덩어리</td></tr>
    <tr><td>Serosa</td><td>약 4~12일</td><td>분홍~갈색, 묽어짐, 양 감소</td></tr>
    <tr><td>Alba</td><td>약 12일~최대 6주</td><td>누런 흰색, 소량</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://my.clevelandclinic.org/health/symptoms/22485-lochia">Cleveland Clinic</a> · 패드만 사용(탐폰·생리컵 금지). 한국 아이사랑 포털도 4~6주로 안내. <a class="src kr" href="https://www.childcare.go.kr/?menuno=276">아이사랑 산욕기</a></p>
  <ul>
    <li><strong>회음부</strong>: 소변 후 페리보틀 따뜻한 물로 헹구고 앞→뒤로 톡톡 말리기. 좌욕은 첫 며칠 시원한 물, 이후 따뜻한 물. 얼음팩·냉장한 위치하젤 패드(Tucks), 도넛방석. 봉합사는 저절로 녹습니다. <a class="src" href="https://kidshealth.org/en/parents/recovering-delivery.html">KidsHealth</a></li>
    <li><strong>제왕절개</strong>: 절개부는 순한 비누·물로 살살 씻고 두드려 말리기, Steri-Strip은 저절로 떨어짐(약 1주). <strong>6~8주간 아기보다 무거운 것 들지 않기, 최소 2주 운전 금지</strong>(마약성 진통제 복용 중엔 금지). 욕조·수영은 약 3주 후 허락 뒤. 걷기·가벼운 집안일은 회복·혈전 예방에 도움. 대부분 4~8주면 일상 복귀. <a class="src" href="https://medlineplus.gov/ency/patientinstructions/000624.htm">MedlinePlus</a></li>
    <li><strong>훗배앓이</strong>: 며칠간 자궁 수축통, 수유 중 심해짐. <strong>변비·치질</strong>: 수분·섬유질, 의사와 상의해 변 연화제. <strong>요실금·골반저근</strong>: 케겔 10초 조이고 10초 풀기 10회를 하루 3~5세트, 4~6주면 호전. 한국 자료는 출산 3일째부터 시작을 권합니다. <a class="src" href="https://medlineplus.gov/ency/article/003975.htm">MedlinePlus 케겔</a> <a class="src kr" href="https://www.childcare.go.kr/?menuno=412">아이사랑 산후운동</a></li>
    <li><strong>유방 울혈·유선염</strong>: Day 3 참고. 유선염은 수유를 계속하고 12~24시간 자가 관리로 호전 없으면 진료(항생제). <a class="src" href="https://www.nhs.uk/conditions/mastitis/">NHS</a></li>
    <li><strong>산후 탈모</strong>: 출산 약 4개월에 정점, 돌 무렵 회복. 치료 불필요. <a class="src" href="https://www.aad.org/public/diseases/hair-loss/insider/new-moms">AAD</a></li>
    <li><strong>운동</strong>: 순산이면 준비되는 대로 걷기·스트레칭·골반저근. 고충격 운동은 6주 검진 후. 관절이 몇 달간 느슨하므로 부상 주의. <a class="src" href="https://www.nhs.uk/conditions/baby/support-and-services/keeping-fit-and-healthy-with-a-baby/">NHS</a></li>
    <li><strong>성관계·피임</strong>: 보통 4~6주 후(의사 확인). <strong>출산 3주 후부터 임신 가능</strong>, 모유수유 중이고 생리가 없어도. 모유수유 피임법(LAM)은 "6개월 미만 + 완전 모유수유 + 생리 없음" 3조건이 모두 맞을 때만. 에스트로겐 복합 피임약은 젖양을 줄일 수 있어 프로게스틴 단일제·콘돔·IUD를 상의. <a class="src" href="https://www.nhs.uk/conditions/baby/support-and-services/sex-and-contraception-after-birth/">NHS</a></li>
    <li><strong>산후 검진</strong>: ACOG는 출산 3주 이내 첫 접촉, 12주 이내 종합 검진. Kaiser는 4~6주. 퇴원 시 "postpartum visit"과 "lactation visit" 예약을 잡아 달라고 하세요. 혈압·기분·피임·백신(독감·백일해)을 확인합니다. <a class="src" href="https://www.marchofdimes.org/find-support/topics/postpartum/your-postpartum-checkups">March of Dimes</a></li>
  </ul>

  <h3>2. 엄마 응급 경고 신호: 아빠가 외우는 표</h3>
  <div class="tbl"><table>
    <tr><th>신호</th><th>의심 상황</th><th>행동</th></tr>
    <tr><td><strong>1시간에 패드 1장 이상 흠뻑</strong>, 골프공보다 큰 덩어리</td><td>산후 출혈·자궁 이완·잔류 태반</td><td>911 또는 응급실</td></tr>
    <tr><td><strong>열 38°C(100.4°F) 이상</strong>, 오한</td><td>자궁내막염·상처 감염·유선염</td><td>즉시 산부인과 연락(야간은 advice nurse)</td></tr>
    <tr><td><strong>가시지 않거나 심해지는 두통, 시야 흐림·빛 번쩍임, 얼굴·손 심한 부종, 명치/오른쪽 윗배 통증</strong></td><td>산후 전자간증(출산 후 48시간~6주, 혈압 140/90 이상)</td><td>즉시 진료, 경련·호흡곤란이면 911 <a class="src" href="https://my.clevelandclinic.org/health/diseases/17733-postpartum-preeclampsia">Cleveland Clinic</a></td></tr>
    <tr><td><strong>가슴 통증, 숨 참, 심장이 빨리 뜀</strong></td><td>폐색전증·심근병증</td><td>911</td></tr>
    <tr><td><strong>한쪽 다리(또는 팔)가 붓고 붉고 아픔</strong>(출산 후 6주까지)</td><td>심부정맥혈전(DVT)</td><td>당일 진료/응급실</td></tr>
    <tr><td>절개부·회음부가 붉어지고 붓고 진물·고름, 벌어짐; 악취 나는 분비물, 배 통증 심해짐</td><td>상처·자궁 감염</td><td>당일 진료</td></tr>
    <tr><td>어지럼·실신, 심한 구토, 극심한 피로</td><td>출혈·감염·심장 문제</td><td>즉시 연락</td></tr>
    <tr><td><strong>자신이나 아기를 해칠 생각, 환각·망상·극도의 혼란</strong></td><td>산후우울증·산후정신병(응급)</td><td>911 / 988 / 응급실. 아기와 단둘이 두지 않기</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/hearher/maternal-warning-signs/index.html">CDC Hear Her</a> <a class="src" href="https://my.clevelandclinic.org/health/symptoms/22485-lochia">Cleveland Clinic</a> <a class="src" href="https://kidshealth.org/en/parents/recovering-delivery.html">KidsHealth</a> · CDC 캠페인의 핵심: 출산 후 1년까지 이런 증상이 있으면 의료진에게 "내가 출산한 지 N주 됐다"고 반드시 말하기.</p>

  <h3>3. 베이비블루스 vs 산후우울증</h3>
  <div class="tbl"><table>
    <tr><th></th><th>베이비블루스</th><th>산후우울증(PPD)</th></tr>
    <tr><td>빈도</td><td>출산 여성의 50~80%</td><td>약 8명 중 1명</td></tr>
    <tr><td>시작·기간</td><td>출산 2~3일 후 시작, <strong>최대 2주</strong></td><td><strong>2주 넘게 지속</strong>, 출산 후 1년 내 언제든</td></tr>
    <tr><td>증상</td><td>울컥함, 짜증, 불안, 기분 기복. 일상은 가능</td><td>깊은 슬픔·공허, 아기가 잘 때도 못 잠, 식욕 변화, 죄책감·수치심, 분노 폭발, 아기와 유대감 없음, 자해·아기 해칠 생각</td></tr>
    <tr><td>필요한 것</td><td>휴식·지지·설명</td><td>평가·치료(그대로 두면 길어짐)</td></tr>
    <tr><td>선별</td><td>–</td><td>EPDS 10문항: 0~8 정상, 9~12 상담 권고, 13 이상 심한 우울(한국 아이사랑 기준). 미국 소아과는 아기 1·2·4·6개월 검진에서 엄마 우울을 선별합니다. 설문지를 받으면 솔직히 답하세요</td></tr>
    <tr><td>치료</td><td>–</td><td>인지행동치료·대인관계치료, 항우울제(많은 SSRI가 모유수유와 병용 가능), 중증은 주라놀론(경구, FDA 승인)</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/prenatal/delivery-beyond/Pages/Understanding-Motherhood-and-Mood-Baby-Blues-and-Beyond.aspx">AAP</a> <a class="src" href="https://www.cdc.gov/reproductive-health/depression/index.html">CDC</a> <a class="src" href="https://www.nimh.nih.gov/health/publications/perinatal-depression">NIMH</a> <a class="src kr" href="https://www.childcare.go.kr/?menuno=417">아이사랑 산후우울</a></p>
  <div class="box tip"><h4>도움 전화 (모두 무료)</h4>
    <ul>
      <li><strong>988</strong> Suicide &amp; Crisis Lifeline: 전화·문자 988, 24시간, 통역 가능. <a class="src" href="https://988lifeline.org/">988</a></li>
      <li><strong>1-833-852-6262</strong> National Maternal Mental Health Hotline: 전화·문자, 24시간, 통역.</li>
      <li><strong>1-800-944-4773</strong> Postpartum Support International: 문자 "Help", 회신형. 온라인 지지모임, 아빠 모임. <a class="src" href="https://www.postpartum.net/get-help/psi-helpline/">PSI</a></li>
      <li><strong>Kaiser</strong>: kp.org 앱 Appointments → Mental Health, 또는 산후 진료 때 "I'd like a referral to perinatal mental health". 야간 advice nurse(Day 8).</li>
      <li>한국어 상담: 아이사랑 포털 산전후우울증 온라인 상담(정신건강의학과 전문의 답변), 한국 상담전화 1644-7373(시차 유의). <a class="src kr" href="https://www.childcare.go.kr/?menuno=308">아이사랑 상담</a></li>
    </ul>
  </div>
  <ul>
    <li><strong>산후불안</strong>도 흔하고 PPD와 같이 옵니다. <strong>산후 갑상선염</strong>(5~10%)은 4~8개월 저하기 증상(피로·우울·추위·젖양 감소)이 PPD와 겹치므로 "우울+피로+추위"면 TSH 검사를 요청. <a class="src" href="https://my.clevelandclinic.org/health/diseases/15294-postpartum-thyroiditis">Cleveland Clinic</a></li>
    <li><strong>아빠 산후우울</strong>: 7~10%, 출산 후 3~6개월에 가장 높습니다. 짜증·분노·공격성, 회피(일·게임·술), 수면·식욕 변화, 아기와 유대 어려움. 치료는 엄마와 같습니다. PSI에 아빠 전용 온라인 모임이 있습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/prenatal/delivery-beyond/Pages/Dads-Can-Get-Postpartum-Depression-Too.aspx">AAP 아빠 산후우울</a> <a class="src" href="https://www.postpartum.net/get-help/help-for-dads/">PSI Dads</a></li>
  </ul>

  <h3>4. 아빠의 역할: 첫날부터</h3>
  <ul>
    <li><strong>피부접촉</strong>: 분만 직후·제왕절개 중 엄마가 못 할 때 아빠 가슴에. 이후 매일 20~30분.</li>
    <li><strong>기저귀·목욕·탯줄·손톱·트림·달래기</strong>: Day 5~7의 모든 작업은 아빠 전담 가능. 병원에서 간호사에게 "직접 해 보겠다"고 말하기.</li>
    <li><strong>야간 교대</strong>: 유축 모유·분유로 밤 수유 1~2회를 아빠가 맡아 엄마에게 4~5시간 연속 수면 블록을 만들어 주기. AAP·PSI 모두 "밤 돌봄을 나누라"고 권고합니다. 예: 밤 9시~2시 아빠, 2시~7시 엄마. 주 단위로 재조정.</li>
    <li><strong>모유수유 지원</strong>: 아빠에게 모유수유 교육을 한 무작위 시험(Pisacane 2005, Pediatrics)에서 6개월 완전모유수유율이 25% vs 15%로 높았습니다. 실천: 수유 자세 잡아 주기, 물·간식 가져다주기, 유축기 세척, 밤 수유 때 아기 데려오고 트림·기저귀 담당, "분유 먹이자"는 말 대신 Kaiser 수유상담 예약 잡기. <a class="src" href="https://pubmed.ncbi.nlm.nih.gov/16199674/">Pisacane 2005</a></li>
    <li><strong>방문객 게이트키핑</strong>: 아픈 사람·백신 미접종자 차단, 방문 시간 제한, 손 씻기 요구(Day 12). 식사·청소·장보기·세탁(무향 세제)·미역국.</li>
    <li><strong>기록</strong>: 수유 시간·양, 기저귀(소변 6회+/일), 수면을 앱에 기록해 소아과에 보여 주기(Huckleberry, Baby Tracker).</li>
    <li><strong>엄마 관찰</strong>: 2번 표의 출혈·열·두통·호흡·다리 부종·기분을 아빠가 체크. 2주 넘게 매일 울거나 잠을 못 자면 산후우울 평가.</li>
    <li><strong>유대</strong>: 말 걸기·노래·책 읽기(한국어로), 아기띠 산책. AAP 2024 정책은 출생 직후부터 책을 읽어 주라고 합니다. <a class="src" href="https://healthychildren.org/English/news/Pages/beyond-literacy-shared-reading-starting-in-infancy-offers-lifelong-benefits.aspx">AAP</a></li>
    <li><strong>부부</strong>: 매일 5분 체크인("오늘 어땠어 / 뭐가 힘들어 / 내일 누가 뭘 해"). 역할표를 냉장고에. 울음에 지칠 때 교대 신호(Day 7). 커플 워크숍: Stanford Medicine Children's Health "Becoming New Parents"(온라인). <a class="src" href="https://www.stanfordchildrens.org/en/classes/community/after-birth.html">Stanford 클래스</a></li>
    <li><strong>클래스</strong>: Kaiser Redwood City Health Education(650-299-2433) Newborn Care·Breastfeeding·Infant CPR, Stanford Children's Newborn Care·CPR Infant Only·Infant Safety(타 병원 출산자도 수강 가능). PSI Dads Support Group(온라인, 무료).</li>
    <li><strong>조부모가 한국에서 오실 때</strong>: 출국 2주 전 Tdap·독감(·코로나) 접종, 기침·감기 있으면 방문 연기, 도착 후 2~3일은 야간 담당 제외(시차), 역할 조율(조부모는 식사·청소·낮 안기, 부모는 수유·밤·의료 결정). 아래 7번 표를 미리 한국어로 보여 드리기. 미국 안전 수면(등으로, 빈 침대, 같은 방 다른 침대)은 타협 불가 항목.</li>
  </ul>

  <h3>5. 한국식 산후조리, 근거에 맞게</h3>
  <ul>
    <li><strong>핵심은 같습니다</strong>: 아이사랑 포털(보건복지부)도 산욕기 4~6주, 오로 4~6주, 우울감 2주 넘으면 진료, 샤워 가능, 유산소 운동은 의사 확인 후 4주 내 시작 가능이라고 안내합니다. <a class="src kr" href="https://www.childcare.go.kr/?menuno=415">아이사랑 산후 일상</a></li>
    <li><strong>미역국과 요오드</strong>: 식약처 2020년 조사에서 출산 1~4주 일부 산모가 요오드 상한(2.4 mg/일)을 초과했고, 권고는 <strong>미역국 하루 2회 이내, 다시마 육수 대신 다른 재료</strong>. 2025년 한국 산모 684명 연구에서 산후 요오드 섭취 평균은 WHO 수유부 권장(250 µg)의 10배 이상이었고 80% 이상이 미역국에서 왔습니다. 갑상선 병력이 있으면 OB와 상의하고, 신생아 선별검사(TSH) 재검 연락이 오면 "엄마가 미역국을 많이 먹는다"고 알리세요. <a class="src kr" href="https://eiec.kdi.re.kr/policy/materialView.do?num=198148">식약처 보도자료</a> <a class="src" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11819937/">Nutrients 2025</a></li>
    <li><strong>땀내기·찬바람·누워만 있기</strong>: 한국 산부인과 교수들도 "뜨거운 방에서 일부러 땀 낼 필요 없고, 샤워·에어컨 괜찮고, 21일 내내 누워 있는 것은 회복을 늦춘다"고 말합니다. 이불 덮고 땀내기는 부종을 악화시킵니다. 미국 근거도 샤워 즉시, 걷기는 혈전 예방에 필수. 더위는 산모 탈수와 <strong>아기 과열(SIDS 위험)</strong>을 부릅니다. 절충: 양말·가디건으로 본인이 편한 만큼 따뜻하게, 실내 온도는 아기 기준, 찬물 설거지는 아빠가. <a class="src kr" href="https://www.medicaldaily.co.kr/news/3796">의약일보</a> <a class="src kr" href="https://kormedi.com/1182782/">코메디닷컴</a></li>
    <li><strong>삼칠일·백일·돌</strong>: 삼칠일(21일 외부인 제한)은 미국의 방문객 제한·백신·손 씻기 권고와 완전히 호환됩니다(Day 12). 백일은 4개월 검진·백신 일정과 겹치니 파티는 백신 뒤로. 돌·돌잡이는 가족 전통대로.</li>
  </ul>

  <h3>7. 한국 조부모와 부딪히기 쉬운 지점: 근거로 설명하기</h3>
  <div class="tbl"><table>
    <tr><th>한국 관습</th><th>미국 근거</th></tr>
    <tr><td>짱구베개·머리 모양 베개, 엎어 재우기</td><td>베개·포지셔너는 질식 위험, 효과 없음. 등으로 재우고 깨어 있을 때 터미타임</td></tr>
    <tr><td>옷 두껍게·이불 많이·방 덥게</td><td>어른보다 한 겹만 더, 실내 모자 X, 과열은 SIDS 위험</td></tr>
    <tr><td>꿀물·꿀 묻힌 공갈젖꼭지</td><td>12개월 미만 꿀 절대 금지(보툴리누스)</td></tr>
    <tr><td>배꼽 알코올 소독</td><td>깨끗하고 마르게만</td></tr>
    <tr><td>매일 뜨거운 물로 목욕</td><td>주 2~3회, 5 cm 물, 손목으로 온도 확인</td></tr>

    <tr><td>베이비파우더 듬뿍</td><td>발진엔 산화아연/바셀린</td></tr>

    <tr><td>엄마는 땀내고 누워만 있기</td><td>샤워·걷기·케겔은 바로, 땀내기는 부종 악화</td></tr>
    <tr><td>미역국 하루 세끼 이상</td><td>하루 2회 이내, 다시마 육수 X</td></tr>
    <tr><td>"돌 전엔 계란·땅콩 금지"</td><td>4~6개월 이후 조기 도입이 알레르기를 줄임(Day 11)</td></tr>

  <div class="box dont"><h3>하면 안 되는 것</h3>

    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 출산 5일째 엄마가 "머리가 계속 아프고 눈앞이 번쩍인다"고 합니다.</p><div class="opts"><button type="button" class="opt">수면 부족이니 낮잠</button><button type="button" class="opt">타이레놀 먹고 지켜보기</button><button type="button" class="opt">산후 전자간증 가능성, 즉시 진료(경련·호흡곤란이면 911)</button><button type="button" class="opt">미역국을 더 먹인다</button></div><p class="exp" hidden>정답 3. 산후 전자간증은 출산 후 6주까지 생길 수 있고 두통·시야 이상·부종·명치 통증이 신호입니다. "출산한 지 5일"이라고 꼭 말하세요.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 베이비블루스와 산후우울증을 가르는 가장 실용적인 기준은?</p><div class="opts"><button type="button" class="opt">우는 횟수</button><button type="button" class="opt">2주: 2주 넘게 지속되거나 일상·수면·유대가 무너지면 PPD 평가</button><button type="button" class="opt">첫째인지 둘째인지</button><button type="button" class="opt">모유수유 여부</button></div><p class="exp" hidden>정답 2. 블루스는 2~3일에 시작해 2주 안에 사라집니다. 자해·아기를 해칠 생각은 기간과 무관하게 즉시 응급입니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q3. 산모의 미역국에 대한 식약처 권고는?</p><div class="opts"><button type="button" class="opt">세끼 모두</button><button type="button" class="opt">먹지 말 것</button><button type="button" class="opt">다시마 육수를 진하게</button><button type="button" class="opt">하루 2회 이내, 다시마 육수 대신 다른 재료</button></div><p class="exp" hidden>정답 4. 요오드 과다 때문입니다. 소고기·닭·두부 등 단백질과 채소를 함께 먹습니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q4. 아빠가 엄마의 산후우울 예방에 가장 직접적으로 기여하는 행동은?</p><div class="opts"><button type="button" class="opt">밤 수유 1~2회를 맡아 엄마에게 연속 수면 블록을 만들어 주기</button><button type="button" class="opt">아기 용품을 더 사기</button><button type="button" class="opt">손님을 많이 초대해 기분 전환</button><button type="button" class="opt">엄마가 알아서 쉬게 두기</button></div><p class="exp" hidden>정답 1. AAP·PSI가 "밤 돌봄을 나누라"고 권고합니다. 방문객은 오히려 제한하는 쪽이 맞습니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q5. 제왕절개 후 엄마가 출산 10일째 운전해서 장을 보러 가려 합니다.</p><div class="opts"><button type="button" class="opt">걸을 수 있으면 괜찮다</button><button type="button" class="opt">진통제를 먹고 가면 된다</button><button type="button" class="opt">최소 2주 운전 금지, 6~8주간 아기보다 무거운 것 들지 않기. 장보기는 아빠가</button><button type="button" class="opt">6개월간 운전 금지</button></div><p class="exp" hidden>정답 3. 급정거 시 복근을 쓸 수 없고, 마약성 진통제 복용 중엔 운전 자체가 금지입니다. 걷기는 즉시 권장됩니다.</p></div>
