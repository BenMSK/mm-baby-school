<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="육아 학교"></head><body>
<title>M&M 육아 학교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFF8F1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#201A28" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-title" content="육아 학교">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style id="css">
/* Layout: sticky app header with two pill tabs; one 820px column; the course shows one lesson at a time behind a chip day-nav. */
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --soft:#FFF1E8; --ink:#3B2F3A; --muted:#8B7B87; --line:#F1DED5; --line2:#E4CDC2;
  --peach:#F2857A; --peach-ink:#C44A3E; --sky:#6FB3E8; --sky-ink:#2E6FA8; --sky-soft:#E8F3FC;
  --mint:#5FC9A8; --mint-ink:#1F8A68; --mint-soft:#E2F7EF; --butter:#F6C85F; --butter-ink:#8A6400; --butter-soft:#FFF4D4;
  --rose:#E05A6D; --rose-ink:#B8364A; --rose-soft:#FDE6EA; --lilac:#B9A3E3; --lilac-ink:#6A4FB0; --lilac-soft:#F0EAFB;
  --skin:#FFD9C2; --cheek:#FFB3B3; --hair:#6B4A3A; --focus:#6FB3E8; --hover:rgba(59,47,58,.06);
  --shadow:0 1px 2px rgba(80,50,40,.06),0 6px 18px rgba(80,50,40,.07);
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#201A28; --surface:#2B2434; --soft:#352B3D; --ink:#F3EAEE; --muted:#AB9CA8; --line:#3F3549; --line2:#4F4359;
    --peach:#F79A8E; --peach-ink:#FFB9AE; --sky:#8CC5EF; --sky-ink:#A9D6F7; --sky-soft:#25364A;
    --mint:#76D6B8; --mint-ink:#9FE6CF; --mint-soft:#213D35; --butter:#F7D27A; --butter-ink:#F7D27A; --butter-soft:#3F3620;
    --rose:#F08294; --rose-ink:#FFAABB; --rose-soft:#44242C; --lilac:#C3B0EA; --lilac-ink:#D6C7F5; --lilac-soft:#352C48;
    --skin:#F7C9AE; --cheek:#F49C9C; --hair:#E2C3B2; --focus:#8CC5EF; --hover:rgba(255,255,255,.07);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#201A28; --surface:#2B2434; --soft:#352B3D; --ink:#F3EAEE; --muted:#AB9CA8; --line:#3F3549; --line2:#4F4359;
  --peach:#F79A8E; --peach-ink:#FFB9AE; --sky:#8CC5EF; --sky-ink:#A9D6F7; --sky-soft:#25364A;
  --mint:#76D6B8; --mint-ink:#9FE6CF; --mint-soft:#213D35; --butter:#F7D27A; --butter-ink:#F7D27A; --butter-soft:#3F3620;
  --rose:#F08294; --rose-ink:#FFAABB; --rose-soft:#44242C; --lilac:#C3B0EA; --lilac-ink:#D6C7F5; --lilac-soft:#352C48;
  --skin:#F7C9AE; --cheek:#F49C9C; --hair:#E2C3B2; --focus:#8CC5EF; --hover:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--sky-ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
a:hover{text-decoration-color:var(--sky-ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0;letter-spacing:0}
h1{font-size:1.9rem}
h2{font-size:1.5rem}
h3{font-size:1.15rem;margin-block:1.6em .5em;color:var(--peach-ink)}
h4{font-size:1.02rem;margin-block:1.2em .35em}
p{margin:0 0 .9em}
ul,ol{margin:0 0 1em;padding-left:1.3em}
li{margin:.25em 0}
li::marker{color:var(--peach)}
strong{font-weight:700}
small,.small{font-size:.85rem}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:1.2em;height:1.2em;vertical-align:-.25em;flex:none}
.ico.lg{width:48px;height:48px}
.ico.xl{width:96px;height:96px}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .ico{width:40px;height:40px}
.brand h1{font-size:1.35rem;line-height:1.1}
.brand .sub{font-size:.78rem;color:var(--muted);line-height:1.2}
.brand .ver{font-family:var(--f-display);color:var(--peach-ink);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .sp{flex:1}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-family:var(--f-display);font-size:1rem;padding:8px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .ico{width:1.3em;height:1.3em}
select,input[type=date]{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;max-width:100%}
.btn{font:inherit;font-family:var(--f-display);font-size:.95rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px 3px 8px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.shared::before{background:var(--mint)}
.sync.local::before{background:var(--butter)}
.sync.busy::before{background:var(--butter);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* main */
main{padding-block:20px 90px}
.pane>section{margin-block:0 28px}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.hero .big{font-family:var(--f-display);font-size:2rem;line-height:1.1}
.hero .lead{color:var(--muted);margin:0;font-size:.95rem}
.hero .art{width:110px;height:110px}
@media (max-width:520px){
  .hero{grid-template-columns:1fr}.hero>div{padding-right:64px}.hero .art{position:absolute;top:14px;right:14px;width:60px;height:60px}
  .brand h1{font-size:1.15rem}.brand .sub{font-size:.7rem}.btn .lbl{display:none}.top .wrap{gap:6px;padding-block:8px}
  .day-h{gap:10px}.day-h .ico{width:44px;height:44px}.day-h h2{font-size:1.3rem}
}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .3s;border-radius:4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.sync.busy::before{animation:none}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:560px){.facts{grid-template-columns:1fr 1fr}}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.fact .k{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.fact .v{font-family:var(--f-display);font-size:1.15rem;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.fact .s{font-size:.78rem;color:var(--muted)}
/* callouts */
.box{border-radius:16px;padding:14px 16px;margin:14px 0;border:1px solid transparent}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box h3,.box h4{margin-top:0;display:flex;align-items:center;gap:.4em}
.key{background:var(--butter-soft);border-color:color-mix(in srgb,var(--butter) 40%,transparent)}
.key h3{color:var(--butter-ink)}
.dont{background:var(--rose-soft);border-color:color-mix(in srgb,var(--rose) 35%,transparent)}
.dont h3,.dont h4{color:var(--rose-ink)}
.dont li::marker{color:var(--rose)}
.tip{background:var(--sky-soft);border-color:color-mix(in srgb,var(--sky) 35%,transparent)}
.tip h3,.tip h4{color:var(--sky-ink)}
.note{background:var(--lilac-soft);border-color:color-mix(in srgb,var(--lilac) 35%,transparent)}
.note h3,.note h4{color:var(--lilac-ink)}
.ok{background:var(--mint-soft);border-color:color-mix(in srgb,var(--mint) 35%,transparent)}
.ok h3,.ok h4{color:var(--mint-ink)}
.src{display:inline-block;font-size:.72rem;line-height:1.3;color:var(--sky-ink);background:var(--sky-soft);border-radius:6px;padding:1px 6px;text-decoration:none;margin-left:2px;vertical-align:.1em;white-space:nowrap}
.src:hover{text-decoration:underline}
.kr{background:var(--lilac-soft);color:var(--lilac-ink)}
/* tables */
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5;min-width:420px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-family:var(--f-display);font-weight:400;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.now td{background:var(--mint-soft)}
tr.now td:first-child::after{content:" · 지금";color:var(--mint-ink);font-family:var(--f-display)}
td.c,th.c{text-align:center}
/* phone: each table row becomes a card, column headers become small labels (data-label set by script) */
@media (max-width:640px){
  .tbl{border:0;overflow:visible}
  .tbl table{min-width:0;font-size:.95rem}
  .tbl tr:first-child{display:none}
  .tbl tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0;margin-bottom:8px}
  .tbl tr:last-child{margin-bottom:0}
  .tbl td{display:block;border:0;padding:4px 12px}
  .tbl td:empty{display:none}
  .tbl td:first-child{font-weight:700}
  .tbl td.c{text-align:left}
  .tbl td::before{content:attr(data-label);display:block;font-size:.7rem;line-height:1.3;color:var(--muted);font-family:var(--f-display);letter-spacing:.04em}
  .tbl td:not([data-label])::before{display:none}
  tr.now{border-color:var(--mint)}
}
/* checklist */
.phase{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.phase>header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phase>header .ico{width:34px;height:34px}
.phase>header h2{font-size:1.25rem;flex:1;min-width:0}
.phase>header .pcount{font-family:var(--f-display);color:var(--muted);font-size:.9rem}
.phase .pbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.phase .pbar i{display:block;height:100%;background:var(--peach);width:0;transition:width .3s}
.phase .when{font-size:.8rem;color:var(--muted);margin:-4px 0 8px}
.cks{list-style:none;margin:0;padding:0}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);margin:0}
.ck:first-child{border-top:0}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:7px;margin:2px 0 0;background:var(--surface);cursor:pointer;display:grid;place-content:center;flex:none}
.ck input::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--mint);transform:scale(0);transition:transform .12s}
.ck input:checked{border-color:var(--mint);background:var(--mint-soft)}
.ck input:checked::before{transform:scale(1)}
.ck .t{font-weight:700;cursor:pointer}
.ck.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.ck .d{font-size:.88rem;color:var(--muted);margin-top:2px}
.ck .d p{margin:0 0 .3em}
.ck .by{font-size:.75rem;color:var(--mint-ink);font-family:var(--f-display)}
.dl{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-family:var(--f-display);background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 9px;white-space:nowrap;vertical-align:middle}
.dl .dd{color:var(--muted)}
.dl.soon{background:var(--butter-soft);color:var(--butter-ink)}
.dl.over{background:var(--rose-soft);color:var(--rose-ink)}
.dl.hard{border:1px solid var(--rose)}
/* course */
.daynav{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity}
.dchip{flex:none;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font:inherit;font-family:var(--f-display);font-size:.9rem;border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;scroll-snap-align:start}
.dchip.on{background:var(--peach);border-color:var(--peach);color:#fff}
.dchip.done-mark:not(.on){color:var(--mint-ink);border-color:var(--mint)}
.dchip.done-mark::after{content:" ✓"}
.syllabus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:640px){.syllabus{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scard{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.scard:hover{background:var(--hover)}
.scard .ico{width:34px;height:34px}
.scard .n{font-size:.72rem;color:var(--muted);font-family:var(--f-display);letter-spacing:.05em}
.scard .tt{font-family:var(--f-display);font-size:1rem;line-height:1.25}
.scard .ss{font-size:.78rem;color:var(--muted);line-height:1.35;margin-top:2px}
.scard.done-mark{border-color:var(--mint);background:var(--mint-soft)}
.scard.done-mark .n::after{content:" · 완료 ✓";color:var(--mint-ink)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow)}
@media (max-width:480px){.day{padding:16px 14px;border-radius:16px}}
.day-h{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.day-h .ico{width:56px;height:56px}
.day-h h2{font-size:1.5rem}
.day-h .lead{color:var(--muted);margin:.3em 0 0;font-size:.95rem}
.day>p,.day>ul,.day>ol{max-width:70ch}
.q{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.q .qq{font-weight:700;margin:0 0 8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;font:inherit;font-size:.95rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--hover)}
.opt:disabled{cursor:default;opacity:.85}
.opt.ok{background:var(--mint-soft);border-color:var(--mint);color:var(--ink);opacity:1}
.opt.no{background:var(--rose-soft);border-color:var(--rose);opacity:1}
.exp{margin:8px 0 0;font-size:.9rem;color:var(--ink);background:var(--surface);border-radius:10px;padding:8px 12px;border-left:4px solid var(--mint)}
.refs{font-size:.85rem;color:var(--muted);margin-top:20px;padding-top:12px;border-top:1px dashed var(--line2)}
.refs ol{padding-left:1.4em}
.refs li{margin:.15em 0;overflow-wrap:anywhere}
.refs a{color:var(--sky-ink)}
.yt{list-style:none;padding:0;margin:0}
.yt li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);margin:0}
.yt li:first-child{border-top:0}
.yt .play{flex:none;width:22px;height:22px;border-radius:6px;background:var(--rose);display:grid;place-content:center;margin-top:3px}
.yt .play::before{content:"";border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff;margin-left:2px}
.yt .ch{font-size:.8rem;color:var(--muted)}
.done-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.done-btn{font:inherit;font-family:var(--f-display);font-size:1rem;border:2px solid var(--mint);background:var(--surface);color:var(--mint-ink);border-radius:999px;padding:9px 18px;cursor:pointer}
.done-btn.on{background:var(--mint);color:#fff}
.nav2{display:flex;gap:8px}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{counter-increment:s;position:relative;padding-left:2.2em;margin:.5em 0}
.steps>li::before{content:counter(s);position:absolute;left:0;top:.1em;width:1.6em;height:1.6em;border-radius:50%;background:var(--peach);color:#fff;font-family:var(--f-display);display:grid;place-content:center;font-size:.85em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{font-size:.8rem;background:var(--soft);border-radius:999px;padding:2px 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.sticker{position:absolute;pointer-events:none}
/* illustrations: one deliberate "colored pencil on cream paper" look in both themes */
.ill{margin:16px 0;background:#FFF6EA;border:1px solid #EAD9C8;border-radius:16px;padding:10px 12px 6px;max-width:100%}
.ill svg{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
.ill figcaption{font-size:.82rem;color:#6E4F45;text-align:center;margin-top:4px;line-height:1.5}
.ill figcaption a{color:#2E6FA8}
.ill .ln{fill:none;stroke:#6E4F45;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.85}
.ill .fl{stroke:#6E4F45;stroke-width:1.6;stroke-linejoin:round;stroke-opacity:.7;fill-opacity:.92}
.ill text{font-family:var(--f-body);fill:#5A4038;font-size:11px}
.ill text.b{font-family:var(--f-display);font-size:12px;fill:#6E4F45}
.ill .x{fill:none;stroke:#E05A6D;stroke-width:3.5;stroke-linecap:round}
.ill .ok{fill:none;stroke:#3FA77F;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
/* Q&A */
.qa-search{display:flex;gap:8px;align-items:center;margin-top:10px}
.qa-search input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink)}
.chip.qa-cat{border:1px solid transparent;background:var(--soft);cursor:pointer;font:inherit;font-size:.82rem;color:var(--ink);padding:3px 11px}
.chip.qa-cat.on{background:var(--peach);color:#fff}
.qa-group>h3{margin-top:1.4em}
.qa{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}

<section class="box tip">
  <h3><svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg>서류 흐름 한눈에</h3>
  <ol class="steps">
    <li><strong>병원 (D+0~2)</strong> Birth Certificate Worksheet에 이름·SSN 신청·Kaiser 가입 양식. 이름이 미국 출생증명서, 한국 출생신고서, 두 나라 여권에 그대로 들어가므로 철자를 여기서 확정합니다.</li>
    <li><strong>D+14~21</strong> 카운티 출생증명서 인증본(certified copy) 4~5부 구매. 모든 서류의 출발점입니다.</li>
    <li><strong>D+30~31</strong> 한국 영사관 우편 출생신고(원본 1부 소진) + Kaiser·회사 보험에 아기 추가 + 아빠 PFL 청구.</li>
    <li><strong>D+30~45</strong> SSN 카드 도착 확인 → 미국 여권 DS-11(양 부모 + 아기 출석).</li>
    <li><strong>한국 출생신고 수리 후 (약 D+60~90)</strong> 영사관 방문 예약 → 아기 한국 여권, 재외국민등록 추가.</li>
  </ol>
  <p class="small muted" style="margin:6px 0 0">임신 중 준비(출산가방·카시트·클래스)는 <a href="https://claude.ai/artifact/LKWaj7cPM95xvSJJUHEwf4">출산 준비 노트</a>에 있습니다. 여기는 태어난 뒤의 일만 모았습니다.</p>
</section>

<section class="phase" id="ph-a">
  <header><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg><h2>출산 전 마지막 점검 (서류 관점)</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <p class="when">지금 ~ 12월. 태어난 뒤 허둥대지 않도록 서류와 계정을 미리 만들어 두는 단계.</p>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-a1" data-id="a1"><div><label for="c-a1" class="t">아기 이름 3종 세트 확정</label><div class="d"><p>① 영문 이름(미국 출생증명서·미국 여권, First·Middle·Last. 영문 26자와 하이픈·아포스트로피만 허용, 숫자·악센트 불가) ② 한글 이름 + 한자 + 본(한국 출생신고서) ③ 한국 여권 영문명 = 한글 음역. 미국 출생증명서 영문이 한글 음역과 맞으면 한국 여권에 그대로 쓸 수 있고, 한 번 정하면 바꾸기 어렵습니다. 이름은 붙여 쓰기(SEOJUN), 띄어 쓰면 미들네임으로 오인. <a class="src" href="https://www.passport.go.kr/home/kor/contents.do?menuPos=37">외교부 로마자 표기</a> <a class="src" href="https://www.milemoa.com/bbs/board/3994002">마일모아 이름 사례</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a2" data-id="a2"><div><label for="c-a2" class="t">부모 서류 한 폴더에 모으기</label><div class="d"><p>양 부모 한국 여권(유효기간 확인) + DS-2019·비자·I-94 출력본, 부모 SSN, 엄마의 결혼 전 성(maiden name), 우편을 확실히 받는 주소. Worksheet·여권·영사관에 반복해서 쓰이고, 아기 미국 여권 신청 때 부모 체류 신분 증빙을 요구하는 국무부 초안(2026-09)이 있어 DS-2019·I-94는 꼭 챙깁니다. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.babys-birth-certificate-social-security-card">Kaiser 출생증명서·SSN</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a3" data-id="a3"><div><label for="c-a3" class="t">부모 각각 가족관계증명서 1통 발급 + 한국 혼인신고 등재 확인</label><div class="d"><p>영사관 출생신고 구비서류. 영사관 우편 발급 $1/통 또는 방문. 한국에 혼인신고가 안 되어 있으면 출생신고가 반려된 사례가 있으니 먼저 확인. <a class="src" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4671/view.do?seq=1302388&amp;page=1">SF 총영사관 증명서 발급</a> <a class="src" href="https://www.milemoa.com/bbs/board/11614563">마일모아 반려 사례</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a4" data-id="a4"><div><label for="c-a4" class="t">영사관 출생신고서·번역문 양식 내려받아 미리 채우기, 수수료 이메일로 확인</label><div class="d"><p>출생장소는 "미국 → 캘리포니아주 → 레드우드시티 → Kaiser Permanente Redwood City Medical Center", 등록기준지는 한국 주소. 출생신고 수수료는 공식 페이지에 금액이 없어(무료로 추정) sfkoreapassport@mofa.go.kr(408-351-7767 / 415-921-9577)로 우편 접수 수수료·반송봉투 요건을 미리 확인. <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_23046/view.do?seq=1084974&amp;page=1">양식 다운로드</a> <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4671/view.do?seq=994219&amp;page=1">출생신고 안내</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a5" data-id="a5"><div><label for="c-a5" class="t">myEDD 계정 만들기 + 급여명세서에서 CASDI 공제 확인</label><div class="d"><p>아빠 PFL(bonding) 청구는 SDI Online에서 합니다. 급여명세서에 "CASDI / CA SDI / SDI EE"가 빠지고 있으면 자격이 생깁니다(이민 신분 무관). UC 계열은 SDI 미가입으로 자체 제도(포닥 8주 100%)를 씁니다. <a class="src" href="https://edd.ca.gov/en/disability/paid-family-leave/">EDD PFL</a> <a class="src" href="https://edd.ca.gov/en/disability/Am_I_Eligible_for_PFL_Benefits/">자격 요건</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a6" data-id="a6"><div><label for="c-a6" class="t">HR · 국제처(RO/ARO)에 휴가 계획 사전 통보</label><div class="d"><p>HR에 물을 것: CFRA 자격일(재직 12개월 + 1,250시간, 12주 직장 보호), 기관 자체 유급 육아휴직, PFL과 병행 방법, 아기 보험 추가 절차(31일), Dependent Care FSA 변경 창구. 국제처에는 J-1 유급 휴가 기간을 미리 알리기(무급 휴직은 신분 위험). <a class="src" href="https://calcivilrights.ca.gov/family-medical-pregnancy-leave">CRD: CFRA</a> <a class="src" href="https://edd.ca.gov/en/disability/faqs-fmla-cfra">EDD: PFL은 직장 보호 아님</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a7" data-id="a7"><div><label for="c-a7" class="t">Kaiser 소아과 의사 지정, kp.org에서 아기 계정 연결 방법 확인</label><div class="d"><p>kp.org 의사 디렉토리에서 Redwood City 소아과 의사를 고르고(무료 인사 방문 가능), 출생 후 아기 MRN이 나오면 부모 계정에 proxy로 연결해 메시지·예약·접종기록을 봅니다. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/maternity/baby-101/baby-health">Kaiser: 소아과 선택</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a8" data-id="a8"><div><label for="c-a8" class="t">산후도우미·doula 예약, 방문 조부모 접종 부탁</label><div class="d"><p>조리원이 없고 1~3일 만에 퇴원하므로 12월은 조기 마감이 흔합니다. 한인 입주 6주 약 $8,400, 출퇴근 주 $1,100~1,300 수준. 방문할 조부모는 Tdap(백일해)·독감 접종을 2주 전까지(Day 12 참고). <a class="src" href="https://www.koreadaily.com/article/20240313203100972">중앙일보 산후도우미 비용</a> <a class="src" href="https://www.mom1004usa.com/%EC%82%B0%ED%9B%84%EC%A1%B0%EB%A6%AC-%EC%9D%B4%EC%9A%A9%EC%9A%94%EA%B8%88/">맘천사</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-a9" data-id="a9"><div><label for="c-a9" class="t">카시트 설치 점검 + 신생아 CPR 수업</label><div class="d"><p>캘리포니아는 카시트 없이는 퇴원 불가(만 2세까지 후방장착). CHP Redwood City(650-779-2700)·Sheriff·Packard 무료 점검은 예약까지 3~4주. Kaiser "Infant Safety &amp; CPR" 수업 650-299-2433. 자세한 건 출산 준비 노트 카시트 섹션. <a class="src" href="https://www.chp.ca.gov/programs-services/programs/child-safety-seats/">CHP 카시트</a></p></div><div class="by"></div></div></li>
  </ul>
</section>

<section class="phase" id="ph-b">
  <header><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg><h2>병원에서 · D+0~2</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <p class="when">자연분만 24~48시간, 제왕절개 최대 4일 입원. 아빠가 서류를 맡고, 엄마는 회복과 수유에 집중. 2026-10-19 기준으로 공식 출처를 재확인했고, 확인 못 한 항목은 본문에 적었습니다.</p>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-b1" data-id="b1"><div><label for="c-b1" class="t">Birth Certificate Worksheet 정확히 작성하고 사진으로 남기기</label> <span class="dl" data-dplus="2">퇴원 전</span><div class="d"><p>병원 출생등록 담당자가 가져옵니다. 병원이 이걸로 카운티에 등록하고(Health &amp; Safety Code §102400) 부모 손엔 남지 않습니다. 이름 철자·부모 성명(여권과 동일)·엄마 결혼 전 성·주소를 재확인. 등록 후 정정은 CDPH "Affidavit to Amend a Record" 절차. 아기 MRN(Kaiser 의무기록번호)도 이때 메모해 두면 kp.org 연결·예약에 바로 씁니다. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/maternity/labor-delivery/paperwork-for-new-baby">Kaiser: 신생아 서류</a> <a class="src" href="https://www.mymarinhealth.org/programs-services/pregnancy-childbirth/after-delivery/birth-certificates/">Worksheet 작성 안내</a> <a class="src" href="https://law.justia.com/codes/california/code-hsc/division-102/part-1/chapter-3/article-1/section-102400/">HSC §102400</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b2" data-id="b2"><div><label for="c-b2" class="t">Worksheet의 SSN 신청란 "Yes" 체크 (Enumeration at Birth)</label><div class="d"><p>이걸로 SS-5 작성·SSA 방문 없이 2~4주 뒤 카드가 우편으로 옵니다. 부모 체류 신분과 무관하게 미국 출생아는 발급. <a class="src" href="https://www.ssa.gov/faqs/en/questions/KA-10041.html">SSA FAQ</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b3" data-id="b3"><div><label for="c-b3" class="t">Kaiser 신생아 가입 양식 작성 (직장 보험이면 HR에도 별도 신청)</label><div class="d"><p>출생 후 31일까지는 산모 보험으로 커버되지만, 31일 안에 정식 추가해야 합니다. 입원 중 care team이 양식을 줍니다. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.enroll-your-baby-in-your-health-plan">Kaiser: 아기 보험 등록</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b4" data-id="b4"><div><label for="c-b4" class="t">신생아 처치·검사 동의서 이해하고 서명</label><div class="d"><p>비타민K 주사(출혈 예방), 안연고(erythromycin), B형간염 백신 1차, 신생아 선별검사(발뒤꿈치 채혈, 생후 12~48시간), 청력검사, 빌리루빈(황달), 산소포화도(CCHD). 12월 말 출생이면 첫 RSV 시즌 대상이므로 <strong>RSV 항체주사(니르세비맙/Beyfortus 등)</strong>를 병원에서 맞는지 꼭 물어보세요(엄마가 임신 32~36주에 Abrysvo를 맞았으면 보통 불필요). 각 항목의 뜻은 코스 Day 1·Day 9. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.newborn-tests-treatments">Kaiser: 신생아 검사·처치</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b5" data-id="b5"><div><label for="c-b5" class="t">(남아) 포경수술 여부 결정</label><div class="d"><p>개인 선택. 퇴원 전 또는 이후 외래에서 가능. 관리법은 코스 Day 6. <a class="src" href="https://healthy.kaiserpermanente.org/northern-california/health-wellness/healtharticle.circumcision">Kaiser: 포경수술</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b6" data-id="b6"><div><label for="c-b6" class="t">Skin-to-skin: 엄마가 못 하면 아빠가 (앞트임 셔츠)</label><div class="d"><p>출생 직후 첫 1시간(golden hour) 맨 가슴 위에 올려 두면 체온·혈당·심박이 빨리 안정되고 첫 수유가 빨라집니다. 아빠가 해도 같은 효과. <a class="src" href="https://mydoctor.kaiserpermanente.org/mas/article/skin-to-skin-time-1611867">Kaiser: Skin-to-Skin</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b7" data-id="b7"><div><label for="c-b7" class="t">퇴원 서류 보관 + 첫 소아과 예약(생후 3~5일) 확인</label><div class="d"><p>퇴원 요약, 병원 출생기록(발도장 증서: 공식 서류는 아니지만 EDD PFL 증빙으로 사용 가능), 선별검사 안내, 접종 기록. 소아과 첫 방문은 퇴원 시 잡아 줍니다. <a class="src" href="https://mydoctor.kaiserpermanente.org/ncal/article/newborn-visit-day-2-1219928">Kaiser: 신생아 방문</a> <a class="src" href="https://edd.ca.gov/en/disability/pfl_claim_process/">EDD: PFL 증빙</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b8" data-id="b8"><div><label for="c-b8" class="t">회사·국제처에 출생 알리고 휴가 시작일 확정</label><div class="d"><p>CFRA 12주와 PFL 8주는 휴가 시작일 기준으로 셉니다. PFL 청구는 휴가 시작 후 41일 이내이므로 시작일을 적어 두세요. <a class="src" href="https://edd.ca.gov/en/disability/how_to_file_a_pfl_claim_in_sdi_online/">EDD: SDI Online 청구</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-b9" data-id="b9"><div><label for="c-b9" class="t">퇴원: 카시트에 얇은 옷 + 담요, chest clip은 겨드랑이 높이</label><div class="d"><p>두꺼운 패딩은 벨트가 헐거워져 금지. 신생아 인서트 사용. 병원 제공품(기저귀·페리보틀·패드·콧물흡입기)은 챙겨 오기. <a class="src" href="https://healthy.kaiserpermanente.org/northern-california/health-wellness/maternity/find-hospital/redwood-city/after-delivery">Kaiser RWC: 퇴원</a></p></div><div class="by"></div></div></li>
  </ul>
</section>

<section class="phase" id="ph-c">
  <header><svg class="ico" aria-hidden="true"><use href="#i-heart"/></svg><h2>퇴원 후 첫 2주 · D+3~14</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <p class="when">아빠의 일: 소아과·EDD·Kaiser 앱 세팅, 그리고 엄마 상태 관찰.</p>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-c1" data-id="c1"><div><label for="c-c1" class="t">소아과 첫 방문 (생후 3~5일)</label> <span class="dl" data-dplus="4">D+3~5</span><div class="d"><p>체중(출생체중의 7~10% 이내 감소가 정상), 황달, 수유 상태, 탯줄 확인. 질문 목록을 미리 적어 가세요(코스 Day 1). <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.well-child-visits">Kaiser: well-child 방문</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c2" data-id="c2"><div><label for="c-c2" class="t">2주 방문: 출생체중 회복 확인</label> <span class="dl" data-dplus="14">D+14</span><div class="d"><p>생후 10~14일이면 출생체중으로 돌아와야 합니다. 안 되면 수유 점검(IBCLC 상담). Kaiser 24시간 수유 상담·advice nurse 650-299-2015.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c3" data-id="c3"><div><label for="c-c3" class="t">(산모가 근로자라면) SDI 청구 제출</label> <span class="dl" data-dplus="9">D+9부터</span> <span class="dl" data-dplus="49">~D+49</span><div class="d"><p>SDI Online, 의사 인증. 정상분만 6주·제왕절개 8주. 근로 이력이 없으면 해당 없음. <a class="src" href="https://edd.ca.gov/en/disability/disability_insurance/">EDD: SDI</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c4" data-id="c4"><div><label for="c-c4" class="t">(아빠) PFL bonding 청구</label> <span class="dl">휴가 시작 +41일 이내</span><div class="d"><p>myEDD → SDI Online → New Claim → "Paid Family Leave – Bonding", Proof of Relationship에 출생증명서 또는 병원 출생기록(발도장 증서) 업로드. 휴가 시작 전에는 청구할 수 없고, 시작 후 41일 안에. 12개월 내 최대 8주, 나눠 쓸 수 있고 대기기간 없음, 판정 최대 14일. 주급 상한은 2026년 $1,765, 2027년 시작분은 $1,791 전망(EDD 연말 확정). 임금의 70~90%. <a class="src" href="https://edd.ca.gov/en/disability/how_to_file_a_pfl_claim_in_sdi_online/">EDD: 청구 방법</a> <a class="src" href="https://edd.ca.gov/en/disability/faq_pfl_benefits_payments/">PFL FAQ</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c5" data-id="c5"><div><label for="c-c5" class="t">kp.org 아기 계정 연결, 소아과·advice nurse 번호 저장</label><div class="d"><p>kp.org → My Account → Profile &amp; Preferences → "Act for a Family Member" → Add a person(아기 이름·생년월일·MRN, 동거 부모는 즉시 연결). 접종 기록·예약·의사 메시지가 보입니다. 24시간 advice nurse 650-299-2015를 두 사람 폰에 저장. <a class="src" href="https://healthy.kaiserpermanente.org/support/act-for-a-family-member">Kaiser: Act for a Family Member</a></p><p> Day 8에 "언제 전화하나" 표가 있습니다.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c6" data-id="c6"><div><label for="c-c6" class="t">엄마 경고 신호·산후우울 체크는 아빠 담당 (Day 13)</label><div class="d"><p>한 시간에 패드 하나가 흠뻑 젖는 출혈, 38°C 이상 열, 심한 두통·시야 이상, 가슴 통증·숨참, 한쪽 다리 붓고 아픔, 자해·아기를 해칠 생각 → 즉시 병원/911. 2주 넘게 이어지는 우울·불안은 baby blues가 아니라 산후우울증 가능. <a class="src" href="https://www.cdc.gov/hearher/maternal-warning-signs/index.html">CDC Hear Her</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c7" data-id="c7"><div><label for="c-c7" class="t">카운티 출생 등록 완료 확인 (인증본 구매 가능 시점)</label> <span class="dl" data-dplus="14">D+14~21</span><div class="d"><p>병원이 카운티에 등록한 뒤(보통 2~3주) San Mateo County Vital Records에서 인증본을 살 수 있습니다. 전화 650-573-2395로 등록 여부 확인 가능. <a class="src" href="https://www.smchealth.org/post/birth-certificates">SMC Health: 출생증명서</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-c8" data-id="c8"><div><label for="c-c8" class="t">방문객 규칙 정해서 알리기</label><div class="d"><p>손 씻기, 아픈 사람·기침하는 사람 금지, 얼굴·손에 뽀뽀 금지(헤르페스), 생후 2개월까지 사람 많은 곳 피하기. 한국의 삼칠일과 같은 취지(Day 12).</p></div><div class="by"></div></div></li>
  </ul>
</section>

<section class="phase" id="ph-d">
  <header><svg class="ico" aria-hidden="true"><use href="#i-cal"/></svg><h2>마감이 있는 것 · ~D+31</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <p class="when">놓치면 손해가 큰 네 가지: 보험 31일, 영사관 출생신고 1개월, FSA 30일, PFL 41일.</p>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-d1" data-id="d1"><div><label for="c-d1" class="t">출생증명서 인증본 4~5부 구매 ($34/부)</label> <span class="dl" data-dplus="21">D+14~21</span><div class="d"><p>San Mateo County Health, Office of Vital Records — 1600 W. Hillsdale Blvd, Suite 203, San Mateo · 650-573-2395 · 월–금 8:30–16:30. 예약 없이 방문, 키오스크 선서, 5~15분, 현금·수표·카드. 사진 신분증 지참. Clerk-Recorder(555 County Center 1층, RWC, 예약 650-599-1713)는 약 4주 후부터이고 한국 기관용 아포스티유가 필요하면 이쪽 발행본이 바로 됩니다(보건국 발행본은 $12 서명확인 선행). 용도: 미국 여권 1부(처리 중 묶임), 한국 영사관 1부(미반환), EDD·HR 각 1부, 예비 1부 → 최소 5부. <a class="src" href="https://www.smchealth.org/post/birth-certificates">SMC Health</a> <a class="src" href="https://smcacre.gov/county-clerk-recorder/vital-records-fees">수수료</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-d2" data-id="d2"><div><label for="c-d2" class="t">Kaiser + 회사 HR에 아기 보험 추가</label> <span class="dl hard" data-dplus="31">D+31</span><div class="d"><p>출생증명서 또는 병원 출생기록으로 가능. 놓치면 다음 open enrollment까지 무보험 위험. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.enroll-your-baby-in-your-health-plan">Kaiser: 아기 보험 등록</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-d3" data-id="d3"><div><label for="c-d3" class="t">Dependent Care FSA 등 회사 베네핏 변경</label> <span class="dl" data-dplus="30">D+30</span><div class="d"><p>출생은 qualifying life event. 2026년 DCFSA 한도 $7,500(고용주 채택 시). 데이케어 계획이 있을 때만.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-d4" data-id="d4"><div><label for="c-d4" class="t">한국 영사관 출생신고 우편 접수</label> <span class="dl hard" data-dplus="30">출생 후 1개월</span><div class="d"><p>동봉: 출생신고서(한글, 부 또는 모 서명) · 전자적 송부신청서 · 카운티 출생증명서 원본 1부(미반환) · 한글 번역문(영사관 양식, 직접 번역 가능, 공증 불요) · 부모 여권+비자 사본 · 부모 각 가족관계증명서 · 반송봉투 · 수수료(현금/개인수표). USPS Priority로 추적. 주소: Consulate General of the Republic of Korea, 3500 Clay Street, San Francisco, CA 94118, "Attn: 가족관계등록 담당" (408-351-7767 / 415-921-9577, sfkoreapassport@mofa.go.kr). 처리 4주 이내, 결과는 이메일("처리완료"). 기한을 넘기면 과태료 규정(5만원 이하)이 있지만 영사관에서는 사실상 부과하지 않았다는 후기가 많습니다. <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4671/view.do?seq=994219&amp;page=1">SF: 출생신고</a> <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4675/view.do?seq=1340917">우편 접수 안내</a> <a class="src kr" href="https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&amp;csmSeq=699&amp;ccfNo=3&amp;cciNo=4&amp;cnpClsNo=2">생활법령: 재외 출생신고</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-d5" data-id="d5"><div><label for="c-d5" class="t">SSN 카드 도착 확인</label> <span class="dl" data-dplus="28">약 D+28</span><div class="d"><p>SSA 처리 평균 2주 + 우편 최대 2주 ≈ 4주. 6주가 지나도 안 오면 1-800-772-1213 또는 SSA Redwood City 사무소(1718 Broadway, 월–금 9–16시, 방문 전 전화 확인) 방문: Form SS-5 + 아기 출생증명서 + 병원 기록·보험카드 + 부모 여권·I-94. 보험 등록엔 SSN이 필수가 아니지만 세금(CTC)·529·은행 계좌엔 필수. <a class="src" href="https://www.ssa.gov/faqs/en/questions/KA-01969.html">SSA: 도착 기간</a> <a class="src" href="https://www.ssa.gov/ssnumber/ss5doc.htm">SS-5 서류</a></p></div><div class="by"></div></div></li>
  </ul>
</section>

<section class="phase" id="ph-e">
  <header><svg class="ico" aria-hidden="true"><use href="#i-plane"/></svg><h2>여권 둘 · 영사관 · 엄마 검진 · D+30~90</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <p class="when">인증본과 SSN 카드가 비슷하게 도착하는 D+30 전후가 미국 여권의 첫 가능 시점.</p>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-e1" data-id="e1"><div><label for="c-e1" class="t">미국 여권 DS-11 신청 (양 부모 + 아기 출석)</label> <span class="dl" data-dplus="35">D+30~45</span><div class="d"><p>대법원이 2026-06-30 비자 부모의 자녀도 출생 시민이라고 확정했지만(Trump v. Barbara) 8월 행정명령 2건을 둘러싼 소송이 이어지고 있어, 여권이 가장 확실한 시민권 증빙입니다. J-1 연구자·J-2 배우자는 새 행정명령의 대상 범주(외국 정부 직원 등)에 해당하지 않습니다. 준비물: DS-11(온라인 작성·출력, 서명은 현장에서), 출생증명서 원본+사본, 양 부모 한국 여권+비자 원본과 앞뒤 사본, <strong>DS-2019·I-94 출력본</strong>(부모 신분 증빙 요구 초안 대비), 사진 2×2 in(흰 배경, 아기는 흰 천 위에 눕혀 촬영 가능, 우체국 촬영 $15), $100 수표/머니오더(payable to U.S. Department of State) + $35 execution fee 별도(급행 +$60, 1~2일 배송 +$26.87). 한쪽 부모 불참 시 공증 DS-3053(3개월 내). <strong>접수처 주의:</strong> San Mateo County Clerk(555 County Center)는 여권 접수를 중단했고, Redwood City Main Post Office(1100 Broadway, 650-368-1782)는 USPS 안내가 엇갈리니 전화로 확인 후 usps.com 예약. 접수처 검색은 iafdb.travel.state.gov. 처리 routine 4~6주, 급행 2~3주. 16세 미만 여권은 5년 유효. <a class="src" href="https://travel.state.gov/content/travel/en/passports/need-passport/under-16.html">State Dept: 16세 미만</a> <a class="src" href="https://travel.state.gov/en/passports/apply/help/fees.html">수수료</a> <a class="src" href="https://travel.state.gov/en/passports/apply/help/photos.html">사진 규정</a> <a class="src" href="https://www.usps.com/international/passports.htm">USPS 접수</a> <a class="src" href="https://smcacre.gov/passports">SMC Clerk 접수 중단 공지</a> <a class="src" href="https://www.scotusblog.com/2026/09/judge-blocks-trump-second-birthright-citizenship-order/">SCOTUSblog 2026-09-02</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e2" data-id="e2"><div><label for="c-e2" class="t">한국 출생신고 수리 통보 확인 (이메일, 접수 후 2~4주)</label> <span class="dl" data-dplus="55">D+45~60</span><div class="d"><p>안 오면 sfkoreapassport@mofa.go.kr / 408-351-7767. 수리되면 아기의 기본증명서·가족관계증명서가 생깁니다.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e3" data-id="e3"><div><label for="c-e3" class="t">아기 한국 여권 신청 (영사관 방문, 예약 필수)</label> <span class="dl" data-dplus="75">D+60~90</span><div class="d"><p>g4k.go.kr "재외공관 방문예약"은 매월 1일·16일 오전 10시에 열립니다. 준비물: 신청서(자필), 컬러 사진 1매 3.5×4.5 cm(4세 미만은 인화본 지참), 부·모 여권 사본, 법정대리인 동의서(부모 모두), 아기 미국 여권 또는 출생증명서 사본(복수국적자), 우편수령 신청서. SF에서 출생신고했으면 기본증명서 면제. 만 7세 이하 58면 $35 / 26면 $32(현금·수표·카드), 우편수령 $38.25, 3~4주 소요. 한국 입국은 한국 여권으로. <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4667/view.do?seq=1344849&amp;page=1">SF: 미성년자 여권</a> <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4675/view.do?seq=1340956&amp;page=1">방문 예약 안내</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e4" data-id="e4"><div><label for="c-e4" class="t">재외국민등록에 아기 추가 + 기본증명서·가족관계증명서 1통씩 보관</label><div class="d"><p>우편 또는 g4k 온라인. 증명서는 $1/통. <a class="src kr" href="https://overseas.mofa.go.kr/us-sanfrancisco-ko/brd/m_4670/view.do?seq=1239812&amp;page=1">SF: 재외국민등록</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e5" data-id="e5"><div><label for="c-e5" class="t">(엄마) 산후 검진 + SDI 끝나면 PFL bonding 별도 청구</label> <span class="dl" data-dplus="42">D+42 전후</span><div class="d"><p>ACOG는 출산 후 3주 내 첫 연락, 12주 내 종합 검진을 권고. Kaiser는 보통 4~6주. 피임·우울 선별·회복 확인(Day 13). <a class="src" href="https://edd.ca.gov/en/disability/faq_pfl_benefits_payments/">EDD: PFL FAQ</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e6" data-id="e6"><div><label for="c-e6" class="t">아기 2개월 접종 + 검진 예약</label> <span class="dl" data-dplus="60">D+60</span><div class="d"><p>생후 2개월(2027년 2월 말)에 첫 번째 큰 접종 묶음이 있습니다. 일정표와 미국·한국 차이는 코스 Day 9.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e7" data-id="e7"><div><label for="c-e7" class="t">CalKIDS 계정 청구 + ScholarShare 529 연결</label> <span class="dl" data-dplus="90">D+90 전후</span><div class="d"><p>2023-07 이후 캘리포니아 출생아는 주정부가 $100을 자동 적립해 둡니다. calkids.org에서 출생증명서의 Local Registration Number(LRN)·생년월일·출생 카운티로 계정을 청구하면 +$25, ScholarShare 529를 개설해 연결하면 +$50(최대 $175). 출생 등록 후 최대 90일 뒤부터 조회됩니다. 529 개설엔 아기 SSN 필요. <a class="src" href="https://www.calkids.org/">CalKIDS</a> <a class="src" href="https://www.scholarshare529.com/">ScholarShare 529</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-e8" data-id="e8"><div><label for="c-e8" class="t">생명보험·유언장·후견인 지정 검토, W-4 재점검</label><div class="d"><p>2027년 1월부터 resident alien이면 일반 W-4로 바꾸고 Step 3(자녀 공제)을 반영. 자동차보험엔 아기를 추가할 필요가 없습니다.</p></div><div class="by"></div></div></li>
  </ul>
</section>

<section class="phase" id="ph-f">
  <header><svg class="ico" aria-hidden="true"><use href="#i-flag"/></svg><h2>세금 · 국적 · 잊기 쉬운 것</h2><span class="pcount">0/0</span></header>
  <div class="pbar"><i></i></div>
  <ul class="cks">
    <li class="ck"><input type="checkbox" class="cb" id="c-f1" data-id="f1"><div><label for="c-f1" class="t">2027년 4월 세금신고: 아기 부양가족 + Child Tax Credit</label> <span class="dl">2027-04-15</span><div class="d"><p>12월 출생아도 2026년 전체 부양가족. CTC 최대 $2,200(환급형 ACTC 최대 $1,700), 아기와 납세자 모두 신고기한 전에 발급된 유효 SSN 필요(ITIN 불가). 2026년분은 1040-NR인데, IRS Pub 519는 비거주자 중 "한국 거주자"가 과세연도 중 미국에서 함께 산 자녀를 부양가족·CTC로 청구할 수 있다고 봅니다(한미 조세조약). 조약상 한국 거주자 지위 판단이 필요하니 세무 담당자와 확인. 2027년부터는 resident alien(1040)이라 단순해집니다. <a class="src" href="https://www.irs.gov/credits-deductions/individuals/child-tax-credit">IRS: CTC</a> <a class="src" href="https://www.irs.gov/individuals/international-taxpayers/nonresident-aliens-dependents">IRS: NRA 부양가족</a> <a class="src" href="https://www.irs.gov/publications/p519">Pub 519</a></p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-f2" data-id="f2"><div><label for="c-f2" class="t">체류·신분 증빙 장기 보관 (DS-2019·I-94·리스·W-2·재직증명)</label><div class="d"><p>아들의 국적이탈 가능 여부는 부모의 체류 성격으로 판단되므로(아래), 출생 전후의 신분·거주 기록을 모두 보관. 커뮤니티에 도는 "출생 전후 2년 체류·취업 6개월이면 예외"는 현행 시행령·시행규칙에 없는 기준입니다.</p></div><div class="by"></div></div></li>
    <li class="ck"><input type="checkbox" class="cb" id="c-f3" data-id="f3"><div><label for="c-f3" class="t">(아들) 국적이탈 기한 2044-03-31 캘린더 등록 + "원정출산 조항" 이해</label> <span class="dl">만 18세 되는 해 3월 31일</span><div class="d"><p>남자는 만 18세 되는 해 3월 31일까지 국적이탈 신고를 해야 하고, 지나면 병역 해소 전까지 불가(이탈 전 한국 출생신고 필수). 단 국적법 12조 3항: 부모가 "영주할 목적 없이 체류"하는 중에 태어난 아들은 기한 안이라도 병역을 마치거나 면제받아야 이탈할 수 있습니다. 예외(시행규칙 10조의2, 2024-04 개정)는 ① 출생 후 부/모가 외국 영주권·시민권 취득 ② 부/모가 영주권·시민권 신청 중 출생 ③ 출생 후 신청 ④ 이탈 신고 전까지 부/모가 외국에 17년 이상 계속 거주, 네 가지뿐입니다. J-1처럼 비이민 신분이면 법무부가 "영주 목적 없음"으로 볼 가능성이 높으니, 장기 체류·영주권 계획과 함께 생각해 두세요. 딸은 만 22세 전까지 이탈 가능. <a class="src kr" href="https://atlanta.mofa.go.kr/us-atlanta-ko/brd/m_4919/view.do?seq=1108118&amp;page=1">애틀랜타 총영사관: 복수국적</a> <a class="src kr" href="https://www.mma.go.kr/contents.do?mc=usr0000193">병무청: 국외이주자</a> <a class="src kr" href="https://www.moj.go.kr/bbs/immigration/224/576300/artclView.do">법무부 안내</a> <a class="src kr" href="https://korea.legal/wiki/%EA%B5%AD%EC%A0%81%EB%B2%95-%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99-%EC%A0%9C10%EC%A1%B0%EC%9D%982/">시행규칙 10조의2</a></p></div><div class="by"></div></div></li>

<section class="day" data-day="3" id="d3" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-heart"/></svg><div><div class="eyebrow">Day 3 · 수유 I</div><h2>모유수유, 처음 2주가 전부다</h2><p class="lead">젖은 "자주 물릴수록 많이 나오는" 수요-공급 시스템입니다. 처음 2주 동안 자주·깊게 물리고, 기저귀와 체중으로 잘 먹는지 확인하는 법을 배웁니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>신생아는 24시간에 <strong>8~12회</strong>, 원할 때마다. 낮에는 2~3시간, 밤에는 4시간을 넘기면 깨워서 먹입니다.</li>
      <li>젖은 보통 <strong>생후 2~5일</strong>에 돕니다. 그 전엔 양이 적은 초유가 정상이고, 체중이 8~10%까지 빠지는 것도 정상입니다.</li>
      <li>잘 먹는 신호는 <strong>생후 5일 이후 젖은 기저귀 6개 이상 + 노란 변 3~4회 이상 + 하루 15~30 g 증가</strong>입니다.</li>
      <li>통증은 대부분 <strong>얕게 물린 것</strong>이 원인입니다. 입을 크게 벌린 순간 아기를 당겨 유륜까지 깊게 물립니다.</li>
      <li>모유 아기는 생후 며칠부터 <strong>비타민 D 400 IU</strong>를 매일 먹입니다. 한국 자료에는 잘 안 나오지만 미국 소아과학회(AAP) 기준입니다.</li>
    </ol>
  </div>

  <h3>1. 첫 1주: 초유에서 젖 돌기까지</h3>
  <p>초유(colostrum)는 출산 직후 나오는 진하고 양이 적은 첫 젖으로 항체가 풍부합니다. 건강한 만삭아는 출생 후 30분~2시간 안에 첫 수유가 가능하고, 최소 1시간 피부 맞대기(skin-to-skin)가 권장됩니다. <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=breastfeeding-getting-started-90-P02637">Stanford Children's</a></p>
  <p>젖이 도는 것(milk coming in)은 보통 생후 2~5일, 대개 3~5일째입니다. 가슴이 무겁고 따뜻해지면서 양이 급증하고, 이후 12~24시간 안에 젖은 기저귀가 늘고 하루쯤 뒤부터 체중이 오르기 시작해야 정상입니다. <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=breastfeeding-getting-started-90-P02637">Stanford Children's</a></p>
  <p>처음 며칠 체중이 출생체중의 8~10%까지 빠지는 것은 정상 범위이며, 그 뒤 다시 늘어야 합니다. AAP는 퇴원 후 48시간 안에 소아과에서 체중을 확인하라고 권합니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/How-to-Tell-if-Baby-is-Getting-Enough-Milk.aspx">AAP</a></p>

  <h3>2. 얼마나 자주, 얼마나 오래</h3>
  <p>24시간에 8~12회. 낮에는 2~3시간, 밤에는 4시간을 넘기지 않도록 하고, 넘기면 깨워서 먹입니다(출생체중 회복 전까지). 울음은 늦은 배고픔 신호이므로 그 전의 이른 신호에 먹입니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/How-Often-to-Breastfeed.aspx">AAP</a></p>
  <div class="tbl"><table>
    <tr><th>이른 신호 (지금 먹이세요)</th><th>늦은 신호 (먼저 달래고 먹이세요)</th><th>배부름 신호</th></tr>
    <tr><td>손을 입으로 가져감, 입술 오물거림·혀 내밀기, 고개를 돌리며 젖 찾기(rooting), 주먹 쥠</td><td>울음, 몸을 뻗대며 보챔, 얼굴 빨개짐</td><td>입 다물기, 고개 돌리기, 손 펴고 몸이 이완됨, 잠듦</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/mealtime/signs-your-child-is-hungry-or-full.html">CDC 배고픔·배부름 신호</a></p>
  <p>한쪽 젖은 아기가 스스로 놓을 때까지(보통 10~15분 이상) 먹이고, 트림 후 반대쪽을 권합니다. 시계를 보고 끊으면 지방이 많은 뒷젖을 못 먹고 울혈이 생길 수 있습니다. 한국 질병관리청 자료도 같은 원칙입니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/How-Often-to-Breastfeed.aspx">AAP</a> <a class="src kr" href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586">질병관리청</a></p>

  <h3>3. 젖물리기(latch): 4단계</h3>
  <ol class="steps">
    <li>아기의 귀·어깨·엉덩이가 일직선이 되게 안고, 배와 배를 마주 댑니다.</li>
    <li>엄마 손은 C자: 네 손가락은 아래, 엄지는 위, 유륜 뒤쪽을 받칩니다.</li>
    <li>유두로 아기 아랫입술을 건드려 입을 하품하듯 크게 벌리게 합니다.</li>
    <li>크게 벌린 순간 아기를 빠르게 당겨 붙입니다. 머리를 밀지 말고 목과 등을 받칩니다. 아래쪽 유륜이 더 많이 물려야 합니다.</li>
  </ol>
  <div class="tbl"><table>
    <tr><th>잘 물린 신호</th><th>잘못 물린 신호 → 다시 물리기</th></tr>
    <tr><td>입이 크게 벌어지고 입술이 바깥으로 뒤집힘 · 턱이 가슴에 닿고 코는 가까이 · 위보다 아래 유륜이 더 많이 물림 · 리듬 있게 빨고 삼키는 소리 · 처음 몇 번 빨고 나면 통증 없음</td><td>1분 넘게 지속되는 통증 · 볼이 움푹 들어감 · "딸깍" 소리 · 입술이 안으로 말림 · 삼킴이 거의 없음</td></tr>
  </table></div>
  <p>떼어낼 때는 그냥 당기지 말고 <strong>새끼손가락을 입꼬리에 넣어 흡인을 풀고</strong> 다시 물립니다. 그냥 떼면 유두가 손상됩니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/ensuring-proper-latch-on.aspx">AAP</a> <a class="src kr" href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586">질병관리청</a></p>

  <h3>4. 수유 자세</h3>
  <div class="tbl"><table>
    <tr><th>자세</th><th>방법</th><th>특히 유용할 때</th></tr>
    <tr><td>요람(cradle)</td><td>먹이는 쪽 팔꿈치 안쪽에 아기 머리, 배와 배가 마주 보게</td><td>기본 자세</td></tr>
    <tr><td>교차 요람(cross-cradle)</td><td>반대쪽 손으로 아기 목·등을 받쳐 머리 방향을 조절</td><td>신생아, 젖물리기가 어려울 때</td></tr>
    <tr><td>풋볼(football, clutch)</td><td>아기를 옆구리에 끼우고 다리는 엄마 뒤로</td><td>제왕절개 후(절개부 압박 없음), 쌍둥이, 가슴이 크거나 유두가 편평할 때</td></tr>
    <tr><td>옆으로 눕기(side-lying)</td><td>엄마와 아기가 마주 보고 눕고, 엄마 등 뒤에 베개</td><td>제왕절개 후, 밤중 수유. 끝나면 아기는 반드시 자기 잠자리로</td></tr>
    <tr><td>뒤로 기대기(laid-back)</td><td>반쯤 기대 눕고 아기를 배 위에 엎드리게</td><td>사출이 세거나 젖이 너무 많을 때</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Positioning-Your-Baby-For-Breastfeeding.aspx">AAP 자세</a> <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=step-by-step-breastfeeding-holds-138-A90930">Stanford 단계별 자세</a></p>

  <h3>5. "잘 먹고 있다"는 증거: 기저귀와 체중</h3>
  <div class="tbl"><table>
    <tr><th>시기</th><th>젖은 기저귀</th><th>대변</th><th>체중</th></tr>
    <tr><td>생후 1~2일</td><td>하루 2~3개</td><td>1~2회, 검은 태변(meconium)</td><td>출생체중의 8~10%까지 감소 가능</td></tr>
    <tr><td>생후 3~4일</td><td>늘어남</td><td>2회 이상, 녹색→노란색으로 전환</td><td>젖 돌면서 감소 멈춤</td></tr>
    <tr><td>생후 5~7일 이후</td><td><strong>하루 6개 이상</strong>, 소변은 거의 무색~연노랑</td><td><strong>하루 3~4회 이상</strong>, 노랗고 묽으며 알갱이(seedy)</td><td>하루 최소 15 g, 보통 20~30 g 증가(3개월까지)</td></tr>
  </table></div>
  <p>바로 소아과에 연락할 때: 생후 5일 이후에도 젖은 기저귀가 하루 6개 미만, 대부분의 수유 후에도 계속 배고파함, 수유마다 토함, 무기력. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/How-to-Tell-if-Baby-is-Getting-Enough-Milk.aspx">AAP</a> <a class="src" href="https://kidshealth.org/en/parents/feednewborn.html">KidsHealth</a></p>

  <h3>6. 성장 급등기와 집중수유</h3>
  <p>생후 2주~2개월 사이에 성장 급등기(growth spurt)가 와서 갑자기 더 자주, 더 많이 먹으려 합니다. 젖이 부족해진 것이 아니라 수요를 늘려 공급을 올리는 과정입니다. 저녁마다 1시간 간격으로 먹으려 드는 집중수유(cluster feeding)도 CDC가 정상 패턴으로 설명합니다. 서울아산병원 신생아과도 "잦은 수유는 젖 분비를 늘리려는 아기의 노력"이라고 안내합니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Breastfeeding-Mealtime-Milestones.aspx">AAP</a> <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/breastfeeding/how-much-and-how-often.html">CDC</a> <a class="src kr" href="https://www.amc.seoul.kr/asan/depts/neo/K/bbsDetail.do?menuId=4833&amp;contentId=267014">서울아산병원</a></p>

  <h3>7. 울혈·유두 통증·유선염</h3>
  <ul>
    <li><strong>울혈(engorgement)</strong>: 생후 3~5일 젖 돌 때 흔합니다. 예방은 "원할 때마다 자주". 수유 전 따뜻한 찜질·샤워·손으로 조금 짜서 유륜을 부드럽게, 수유 사이에는 냉찜질. 아세트아미노펜·이부프로펜 가능. 차가운 양배추잎은 붓기가 가라앉을 때까지만(계속 쓰면 젖양이 줄 수 있음). <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Engorgement.aspx">AAP</a></li>
    <li><strong>유두 통증</strong>: 대개 얕은 젖물리기가 원인입니다. 깊게 물리고 자세를 바꾸고, 비누로 닦지 말고, 수유 후 젖을 조금 발라 말리세요. 의료용 라놀린(lanolin)은 가능, 일반 크림·로션은 도움이 안 됩니다. 갈라지거나 심하면 IBCLC(국제인증 수유상담가)에게. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Treating-Breast-Pain.aspx">AAP</a></li>
    <li><strong>유선염(mastitis)</strong>: 가슴 한 부위가 붉고 뜨겁고 아프면서 38.3°C 이상 열·몸살 → 당일 진료. 보통 항생제 + 수유나 유축을 계속하는 것이 치료입니다. 젖을 멈추면 오히려 악화되므로 수유를 중단할 이유가 아닙니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Warning-Signs-of-Breastfeeding-Problems.aspx">AAP</a></li>
  </ul>

  <h3>8. 유축과 유축기</h3>
  <p>아기가 직접 잘 먹고 체중이 늘고 있다면 서두를 필요가 없습니다. 아기와 떨어져 있거나(NICU 등) 보충이 필요하면 출산 직후부터 하루 8회 이상(밤 포함) 유축해 공급을 세웁니다. 직장 복귀 전 3~4주부터 냉동 비축을 시작하고, 복귀 후에는 하루 1~3회, 한 번에 최소 10분 이상. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/Expressing-Breastmilk-on-the-Job.aspx">AAP</a></p>
  <p>Kaiser 유축기: 대부분의 Kaiser 플랜은 전동 유축기를 무상 제공합니다. 출산 후 자동전화 1-877-291-5204에 산모 MRN·아기 생년월일·배송지를 입력하면 2~3영업일 내 배송되며, 출산 후 180일 안에 신청해야 합니다(San Mateo County 직원 안내 기준이므로 Member Services로 플랜 확인). <a class="src" href="https://www.smcgov.org/hr/kaiser-health-plan-members-how-get-your-free-breastpump">SMC HR 안내</a></p>
  <p>유축기 세척: 사용 후 매번 분해 → 흐르는 물에 헹굼 → 전용 대야와 솔로 세제 세척 → 공기 건조. 생후 2개월 미만·미숙아·면역저하 아기는 하루 1회 소독(끓이기 5분, 스팀, 식기세척기 sanitize). <a class="src" href="https://www.cdc.gov/hygiene/about/about-breast-pump-hygiene.html">CDC</a></p>

  <h3>9. 모유 보관 (CDC 기준)</h3>
  <div class="tbl"><table>
    <tr><th>상태</th><th>실온(≤25°C / 77°F)</th><th>냉장(≤4°C / 40°F)</th><th>냉동(≤-18°C / 0°F)</th></tr>
    <tr><td>갓 짠 모유</td><td>최대 4시간</td><td>최대 4일</td><td>6개월이 최선, 12개월까지 허용</td></tr>
    <tr><td>해동한 모유</td><td>1~2시간</td><td>완전히 녹은 시점부터 24시간</td><td><strong>재냉동 금지</strong></td></tr>
    <tr><td>먹다 남은 모유</td><td>수유 시작 후 2시간 안에 사용, 그 뒤 폐기</td><td>–</td><td>–</td></tr>
  </table></div>
  <p>데우기는 선택 사항입니다(실온·차게 줘도 됨). 데울 때는 밀봉한 채 따뜻한 물에 담그고, <strong>전자레인지·직접 가열은 금지</strong>. 먹이기 전 손목에 떨어뜨려 온도를 확인하고, 분리된 지방은 살살 돌려 섞습니다. <a class="src" href="https://www.cdc.gov/breastfeeding/breast-milk-preparation-and-storage/handling-breastmilk.html">CDC</a></p>
  <div class="box note"><h4>한국 자료와 다른 점</h4><p>질병관리청 기준은 훨씬 관대합니다(실온 8~10시간, 냉장 최대 8일, 냉동 3~4개월). 미국에서 지내는 동안은 보수적인 CDC 기준을 따르세요. <a class="src kr" href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586">질병관리청</a></p></div>

  <h3>10. 엄마의 식단·카페인·술</h3>
  <ul>
    <li>열량은 임신 전보다 하루 약 330~400 kcal 추가. 특별히 피할 음식은 없고 다양하게. 요오드 290 µg·콜린 550 mg이 필요하므로 산전 비타민을 계속 먹는 것이 보통입니다. <a class="src" href="https://www.cdc.gov/breastfeeding-special-circumstances/hcp/diet-micronutrients/maternal-diet.html">CDC</a></li>
    <li>카페인은 하루 300 mg 이하(커피 2~3잔)면 대체로 괜찮습니다. 미숙아·어린 신생아는 더 줄이세요.</li>
    <li>생선은 FDA/EPA "Best Choices"를 주 2~3회, 고수은 어종(상어·황새치·king mackerel·bigeye tuna)은 피합니다.</li>
    <li>술은 안 마시는 것이 가장 안전. 마신다면 하루 1잔 이하, 1잔당 최소 2시간 뒤 수유. "짜서 버리기(pump and dump)"는 알코올 배출을 앞당기지 않습니다. <a class="src" href="https://www.cdc.gov/breastfeeding-special-circumstances/hcp/vaccine-medication-drugs/alcohol.html">CDC</a></li>
    <li>미역국: 미역은 요오드가 매우 많아 수유 중 과다 섭취는 아기 갑상선에 영향을 줄 수 있다는 보고가 있습니다. 하루 한두 그릇 수준으로, 매끼 먹지는 마세요(Day 13 산후조리 참고).</li>
  </ul>

  <h3>11. 비타민 D와 철분 (AAP)</h3>
  <ul>
    <li><strong>비타민 D 400 IU(10 µg)</strong>를 생후 며칠 안에 시작해 돌까지 매일. 완전·혼합 모유수유 모두 해당하고, 분유도 하루 약 32 oz(950 mL) 미만이면 필요합니다. 액상 드롭 1방울형이 편합니다. <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Vitamin-D-On-the-Double.aspx">AAP</a></li>
    <li><strong>철분</strong>: 모유 아기는 생후 4개월부터 하루 1 mg/kg 액상 철분을, 철분이 든 이유식(고기·철분 강화 시리얼)이 자리 잡을 때까지. 다만 2026년 7월 AAP 철분 임상보고서 개정판은 "6개월까지는 시작"으로 요약돼 있어, <strong>4개월 검진 때 소아과에 "iron drops 언제부터?"를 직접 물어보세요.</strong> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Vitamin-Iron-Supplements.aspx">AAP 보충제</a> <a class="src" href="https://www.healthychildren.org/English/news/Pages/iron-deficiency-anemia-prevention-screening-treatment-AAP-updates-guidance.aspx">AAP 2026 철분 개정</a></li>
    <li>한국 질병관리청 자료는 비타민 D 보충을 언급하지 않습니다. 미국 기준을 따르세요.</li>
  </ul>

  <h3>12. 혼합수유 요령과 Kaiser 지원</h3>
  <p>모유량을 지키려면 <strong>젖을 먼저 물리고</strong> 부족분만 분유로. 젖을 거르는 만큼 공급이 줄므로, 분유를 준 끼니에는 가능하면 유축합니다. 젖병은 모유수유가 자리 잡은 뒤(통상 3~4주) Day 4의 "페이스드" 방식으로 도입하면 젖병 선호를 줄일 수 있습니다. <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/breastfeeding/how-much-and-how-often.html">CDC</a></p>
  <p>Kaiser Northern California 24시간 수유 상담·예약: <strong>1-866-454-8855</strong>. Redwood City 병동에는 수유 전문가(IBCLC)가 있으니 퇴원 전에 젖물리기를 직접 봐 달라고 요청하고, 퇴원 후 1~2일 안에 수유 방문이나 소아과 체중 체크를 잡아 두세요. <a class="src" href="https://healthy.kaiserpermanente.org/northern-california/doctors-locations/breastfeeding-resources">Kaiser NCAL 수유 자원</a></p>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>시계를 보고 수유를 끊기, 한쪽만 5분씩 번갈아 먹이기 (뒷젖을 못 먹음)</li>
      <li>출생체중 회복 전에 밤에 4시간 넘게 재우기</li>
      <li>통증을 참고 계속 얕게 물리기 (유두 손상 → 수유 포기의 흔한 원인)</li>
      <li>유두를 비누로 닦기, 일반 화장품 크림 바르기</li>
      <li>해동한 모유를 다시 얼리기, 모유를 전자레인지로 데우기</li>
      <li>"젖이 부족하다"고 느낄 때 바로 분유로 대체하기 — 먼저 기저귀 수와 체중을 보고, IBCLC와 상담</li>
      <li>유선염이라고 수유를 중단하기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 생후 6일 아기가 잘 먹고 있는지 가장 믿을 만한 신호는?</p><div class="opts"><button type="button" class="opt">수유할 때마다 15분을 채운다</button><button type="button" class="opt">엄마 가슴이 수유 후 가볍게 느껴진다</button><button type="button" class="opt">젖은 기저귀 하루 6개 이상, 노란 변 3~4회 이상, 체중이 늘고 있다</button><button type="button" class="opt">아기가 수유 후 바로 잠든다</button></div><p class="exp" hidden>정답 3. 시간이나 가슴 느낌이 아니라 "나오는 것"(기저귀)과 "느는 것"(체중)이 증거입니다. 생후 5일 이후 젖은 기저귀 6개 미만이면 소아과에 연락하세요.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 수유 중 유두가 계속 아픕니다. 가장 흔한 원인은?</p><div class="opts"><button type="button" class="opt">젖이 너무 많이 나와서</button><button type="button" class="opt">아기가 유륜까지 깊게 물지 않고 유두만 얕게 물어서</button><button type="button" class="opt">수유 간격이 너무 길어서</button><button type="button" class="opt">엄마의 피부가 약해서</button></div><p class="exp" hidden>정답 2. 1분 넘게 지속되는 통증·볼이 움푹 들어감·딸깍 소리는 얕은 젖물리기 신호입니다. 새끼손가락으로 흡인을 풀고 입을 크게 벌린 순간 다시 깊게 물리세요.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 갓 짠 모유를 냉장고에 보관할 수 있는 최대 기간(CDC)은?</p><div class="opts"><button type="button" class="opt">4일</button><button type="button" class="opt">8일</button><button type="button" class="opt">24시간</button><button type="button" class="opt">2주</button></div><p class="exp" hidden>정답 1. 실온 4시간, 냉장 4일, 냉동 6(최대 12)개월. 한국 질병관리청의 8일 기준보다 보수적인 CDC 기준을 따르세요.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 모유수유 아기에게 생후 며칠부터 매일 먹여야 하는 보충제는?</p><div class="opts"><button type="button" class="opt">철분 드롭</button><button type="button" class="opt">유산균</button><button type="button" class="opt">종합비타민</button><button type="button" class="opt">비타민 D 400 IU</button></div><p class="exp" hidden>정답 4. AAP 기준 비타민 D 400 IU를 생후 며칠부터 돌까지. 철분은 4개월 전후부터이며 시작 시점은 소아과와 확인합니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 저녁마다 생후 3주 아기가 1시간마다 젖을 찾습니다. 올바른 해석은?</p><div class="opts"><button type="button" class="opt">젖이 부족해졌으니 분유를 추가해야 한다</button><button type="button" class="opt">집중수유·성장 급등기로 정상이며, 자주 물리면 공급이 늘어난다</button><button type="button" class="opt">아기가 버릇이 나빠진 것이다</button><button type="button" class="opt">밤에 재우기 위해 수유를 제한해야 한다</button></div><p class="exp" hidden>정답 2. 생후 2주~2개월의 성장 급등기와 저녁 집중수유는 CDC·AAP가 정상 패턴으로 설명합니다. 기저귀와 체중이 정상이면 그대로 자주 물리세요.</p></div>
  </div>

<section class="day" data-day="4" id="d4" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-bottle"/></svg><div><div class="eyebrow">Day 4 · 수유 II</div><h2>분유수유와 젖병 위생</h2><p class="lead">분유는 "어떤 브랜드냐"보다 "어떻게 타고, 얼마나 두고, 어떻게 씻느냐"가 안전을 좌우합니다. 생후 2개월 미만에게 적용되는 미국 CDC의 70°C 규칙은 한국 관행과 다르니 꼭 익혀 두세요.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>미국에서 파는 분유는 스토어 브랜드(Kirkland 등)까지 <strong>모두 같은 FDA 영양 기준</strong>입니다. 유럽 분유 온라인 직구는 AAP가 "No".</li>
      <li><strong>생후 2개월 미만</strong>·미숙아는 가루 분유를 <strong>끓였다가 5분 식힌 물(약 70°C)</strong>로 타서 식혀 먹입니다(Cronobacter 예방). 또는 바로 먹이는 액상(RTF)을 씁니다.</li>
      <li><strong>물 먼저, 가루 나중.</strong> 스쿱은 깎아서. 전자레인지 금지.</li>
      <li>탄 분유는 실온 <strong>2시간</strong>, 먹기 시작하면 <strong>1시간</strong>, 냉장 <strong>24시간</strong>. 남은 건 버립니다.</li>
      <li>젖병은 매번 전용 대야·솔로 씻고 공기 건조, <strong>2개월 미만은 하루 1회 소독</strong>. 젖병을 물려 재우거나 괴어 놓지 않습니다.</li>
    </ol>
  </div>

  <h3>1. 분유 종류와 선택</h3>
  <div class="tbl"><table>
    <tr><th>종류</th><th>영어 표기 · 예</th><th>언제</th></tr>
    <tr><td>우유 단백 기반(기본)</td><td>cow's milk-based, iron-fortified (Similac, Enfamil, Gerber Good Start, Kirkland, Bobbie, ByHeart…)</td><td>대부분의 아기. 철분 강화 제품만("low iron" 금지)</td></tr>
    <tr><td>부분/완전 가수분해</td><td>partially / extensively hydrolyzed, "hypoallergenic" (Alimentum, Nutramigen)</td><td>우유 단백 알레르기 등 의사 권고 시. 비쌈</td></tr>
    <tr><td>아미노산 분유</td><td>amino acid-based / elemental</td><td>가수분해 분유도 못 먹는 심한 알레르기. 의사와 상의</td></tr>
    <tr><td>콩 분유</td><td>soy-based</td><td>드문 유당 소화 장애 등. 우유 알레르기 아기의 최대 절반이 콩에도 반응해 <strong>우유 알레르기 대체용으로 비권장</strong>. 영아산통에 효과 근거 없음</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/formula-feeding/Pages/choosing-an-infant-formula.aspx">AAP 분유 선택</a></p>
  <ul>
    <li>미국에서 팔리는 모든 분유는 FDA가 정한 안전·영양 기준(필수 영양소 30종 최소치 등)을 충족해야 합니다. 그래서 일반 우유 기반 분유끼리는 스토어 브랜드를 포함해 <strong>바꿔 먹여도 됩니다</strong>(처방용 특수 분유는 예외). <a class="src" href="https://www.fda.gov/food/infant-formula-homepage/infant-formulas-marketed-us">FDA</a> <a class="src" href="https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/how-should-we-feed-our-baby-if-running-low-on-money.aspx">AAP</a></li>
    <li><strong>유럽 분유(HiPP, Holle 등) 온라인 직구</strong>는 AAP가 한마디로 "No": FDA 감독 밖, 운송 중 온도 관리 불명, 영어 아닌 라벨로 조제 오류, 리콜 통보 지연, 유럽식 단계(0~6/6~12개월) 혼동. 미국 매장에서 정식 유통되는 FDA 등록 제품(Kendamil 등)은 별개입니다. <a class="src" href="https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/Is-it-OK-to-buy-imported-formulas-online.aspx">AAP</a></li>
    <li>집에서 만든 분유, 물 타서 묽게 만들기는 절대 금지(전해질 이상·경련·성장 부진).</li>
    <li>형태: 가루(powder, 가장 싸지만 무균 아님), 농축액(concentrate), 바로 먹이는 액상(ready-to-feed, 무균·가장 비쌈). 생후 2개월 미만·미숙아에게는 RTF가 가장 안전한 선택입니다. <a class="src" href="https://www.cdc.gov/cronobacter/prevention/index.html">CDC Cronobacter</a></li>
  </ul>

  <h3>2. 안전한 조제 (CDC·FDA)</h3>
  <ol class="steps">
    <li>손을 씻고 깨끗한 조리대에서. 물은 미국 수돗물(여과 여부 무관)로 타도 안전합니다. Redwood City 수돗물에는 불소가 들어 있어 치아에 오히려 좋습니다(Day 11).</li>
    <li><strong>생후 2개월 미만, 37주 미만 조산아, 면역저하 아기</strong>: 가루 분유는 물을 끓인 뒤 약 5분만 식혀(약 70°C/158°F) 가루와 섞습니다. CDC 원문: "Very hot water (around 158°F/70°C) is needed to kill these germs." 2개월이 지나고 건강하면 실온 수돗물 조제가 가능합니다.</li>
    <li><strong>물을 먼저 붓고 가루를 나중에.</strong> 통에 적힌 비율(보통 물 2 oz/60 mL당 1스쿱) 그대로, 스쿱은 꾹 누르지 말고 평평하게 깎아서. 물이 많으면 영양 부족, 적으면 탈수.</li>
    <li>뚜껑을 닫고 흔든 뒤, 뜨겁게 탔다면 찬물·얼음물에 담가 체온 정도로 식히고, 손목 안쪽에 떨어뜨려 "따뜻하되 뜨겁지 않음"을 확인합니다.</li>
    <li>데우기는 선택 사항. <strong>전자레인지 금지</strong>(핫스팟 화상). 흐르는 따뜻한 물에 젖병을 데우되 물이 젖꼭지에 닿지 않게.</li>
  </ol>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/formula-feeding/preparation-and-storage.html">CDC 조제·보관</a> <a class="src" href="https://www.cdc.gov/cronobacter/prevention/index.html">CDC Cronobacter 예방</a></p>
  <div class="box note"><h4>한국 관행과 다른 점</h4><p>한국에서는 40~50°C 미지근한 물로 타는 것이 흔하지만, CDC(와 WHO)는 2개월 미만 아기에게 70°C 조제를 권고합니다. 가루 분유는 무균이 아니고, Cronobacter 감염은 드물지만 신생아에게 치명적이기 때문입니다. 하정훈 선생님 영상(#69)도 이 주제를 다룹니다. 가루통은 개봉 후 1개월 내 사용, 스쿱은 마른 상태로.</p></div>

  <h3>3. 조제 후 보관·폐기 시간표</h3>
  <div class="tbl"><table>
    <tr><th>상황</th><th>기한</th></tr>
    <tr><td>조제 후 실온</td><td><strong>2시간</strong> 안에 먹이기 시작</td></tr>
    <tr><td>수유 시작 후</td><td><strong>1시간</strong> 안에 끝내고 남은 것은 버림(침이 섞여 세균 번식)</td></tr>
    <tr><td>바로 안 먹일 때</td><td>즉시 냉장, <strong>24시간</strong> 내 사용</td></tr>
    <tr><td>먹다 남은 분유</td><td>냉장했다가 다시 주기 <strong>금지</strong></td></tr>
    <tr><td>개봉한 RTF·농축액</td><td>뚜껑 덮어 냉장, 라벨 기한(보통 48시간) 내</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/formula-feeding/preparation-and-storage.html">CDC</a></p>

  <h3>4. 젖병·젖꼭지 세척과 소독 (CDC)</h3>
  <ul>
    <li><strong>매 수유 후 세척</strong>: 부품을 모두 분해 → 흐르는 물에 헹굼 → <strong>젖병 전용 대야와 전용 솔</strong>(싱크대에 직접 담그지 않음)에서 뜨거운 비눗물로 닦고 젖꼭지 구멍으로 물을 짜냄 → 헹굼 → 깨끗한 종이타월 위에서 <strong>공기 건조</strong>(행주로 닦지 않음). 식기세척기는 뜨거운 물 + 열건조(heated dry) 또는 sanitize 코스.</li>
    <li><strong>소독(sanitize)</strong>: 생후 2개월 미만·미숙아·면역저하 아기는 <strong>매일 1회</strong>. 건강한 2개월 이상 아기는 매번 꼼꼼히 씻으면 매일 소독이 필수는 아닙니다. 방법: 끓는 물 5분 / 스팀 소독기 / 식기세척기 sanitize 코스 / 무향 표백제 2 tsp + 물 1갤런에 2분.</li>
    <li>건조 후 손 씻고 조립해 전용 찬장에 보관. 젖꼭지는 제조사 권고대로 6주~3개월마다 교체.</li>
  </ul>
  <p class="small muted">출처: <a class="src" href="https://www.cdc.gov/hygiene/about/clean-sanitize-store-infant-feeding-items.html">CDC 젖병 세척·소독</a></p>

  <h3>5. 월령별 수유량 (분유 기준, 아기마다 다름)</h3>
  <div class="tbl"><table>
    <tr><th>월령</th><th>1회 양</th><th>하루 횟수</th><th>하루 총량(대략)</th></tr>
    <tr><td>생후 1주</td><td>30~60 mL (1~2 oz)</td><td>8~12회(2~3시간마다)</td><td>240~600 mL</td></tr>
    <tr><td>2~4주</td><td>60~90 mL (2~3 oz)</td><td>8회 전후(3~4시간마다)</td><td>480~720 mL</td></tr>
    <tr><td>1~2개월</td><td>90~120 mL (3~4 oz)</td><td>6~8회</td><td>600~900 mL</td></tr>
    <tr><td>2~4개월</td><td>120~180 mL (4~6 oz)</td><td>5~7회</td><td>720~950 mL</td></tr>
    <tr><td>4~6개월</td><td>150~210 mL (5~7 oz)</td><td>5~6회</td><td>800~950 mL</td></tr>
    <tr><td>6~12개월(이유식 병행)</td><td>180~240 mL (6~8 oz)</td><td>4~5회</td><td>약 700~950 mL, 이유식 늘면 감소</td></tr>
  </table></div>
  <p>AAP 경험칙: 하루 총량 ≈ 체중 1 lb당 2.5 oz(체중 1 kg당 약 165 mL). <strong>하루 약 32 oz(950 mL)를 넘기지 않는 것이 보통</strong>이며, 1회 7~8 oz 초과나 하루 36 oz 초과가 계속되면 소아과와 상의. 2~4개월 이후나 체중 5.4 kg(12 lb) 이상이면 밤중 수유가 저절로 줄어드는 경우가 많습니다. 표의 2~6개월 구간은 AAP 수치 사이를 보간한 추정치이니 억지로 다 먹이지 말고 배부름 신호(젖꼭지 밀어내기, 고개 돌리기, 잠들기)를 따르세요. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/formula-feeding/Pages/Amount-and-Schedule-of-Formula-Feedings.aspx">AAP 양·일정</a> <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/formula-feeding/how-much-and-how-often.html">CDC</a></p>

  <h3>6. 젖병 먹이는 법과 "페이스드" 수유</h3>
  <p>아기를 반쯤 세워 안고(머리가 팔꿈치 안쪽), 젖꼭지에 분유가 차도록 기울여 공기를 덜 삼키게 합니다. <strong>눕혀서 먹이거나 젖병을 괴어 놓고(propping) 자리를 비우면 안 됩니다</strong>. 질식 위험에 더해 분유가 귀 쪽 관으로 들어가 중이염 위험이 커집니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Bottle-Feeding-How-Its-Done.aspx">AAP</a></p>
  <p>페이스드 보틀 피딩(paced bottle feeding)은 모유와 병행하거나 급하게 먹는 아기에게 수유 전문가들이 가르치는 방법입니다(Stanford Children's는 젖병 쓰는 가족에게 이 방법을 교육한다고 정책에 명시). 요령: 아기를 거의 세워 안기 → 젖꼭지를 윗입술에 대어 스스로 물게 → 젖병을 수평에 가깝게 들어 흐름을 천천히 → 20~30초마다 젖병을 살짝 내려 쉬게 → 중간에 안는 방향 바꾸기 → 배부름 신호가 보이면 남아도 중단. 1회 15~20분이 목표. 젖꼭지는 가장 느린 단계(slow flow)부터 시작합니다. <a class="src" href="https://www.stanfordchildrens.org/content/dam/sch/content-public/services/pdf/infant-feeding-policy-stanford-childrens.pdf">Stanford 수유 정책(PDF)</a></p>

  <h3>7. 젖병 물려 재우기 금지</h3>
  <p>분유·모유·주스를 입에 문 채 잠들면 치아 표면에 당이 머물러 <strong>젖병 충치(baby bottle tooth decay)</strong>가 생기고, 누운 채 먹으면 중이염 위험이 큽니다. 노리개젖꼭지에 단것 묻히기도 금지. <a class="src" href="https://www.healthychildren.org/English/healthy-living/oral-health/Pages/Brushing-Up-on-Oral-Health-Never-Too-Early-to-Start.aspx">AAP</a></p>

  <h3>8. 분유 바꾸기</h3>
  <p>일반 우유 기반 분유끼리는 바로 바꿔도 되고 섞어 써도 됩니다. 변 색·굳기 변화는 흔하고 대개 문제가 아닙니다. 게움·가스·보챔만으로 자주 바꾸는 것은 비권장. 피 섞인 변·심한 습진·체중 정체·수유마다 구토가 있으면 소아과에서 우유 단백 알레르기(CMPA) 평가 후 가수분해 분유를 1~2주 시험합니다. <a class="src" href="https://www.healthychildren.org/English/tips-tools/ask-the-pediatrician/Pages/how-should-we-feed-our-baby-if-running-low-on-money.aspx">AAP</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Why-Babies-Spit-Up.aspx">AAP 게움</a></p>

  <h3>9. 트림, 그리고 게움 vs 구토</h3>
  <ul>
    <li>트림 자세 3가지: ① 어깨에 세워 안고 등 두드리기 ② 무릎에 앉혀 한 손으로 가슴·턱을 받치고 등 두드리기 ③ 무릎에 엎어 머리를 가슴보다 높게 하고 등 문지르기. 분유는 <strong>60~90 mL(2~3 oz)마다</strong>, 모유는 젖 바꿀 때. 몇 분 해도 안 나오면 그냥 계속 먹여도 됩니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/baby-burping-hiccups-and-spit-up.aspx">AAP</a></li>
    <li><strong>게움(spit-up)</strong>: 소량이 힘없이 흘러나오고 아기는 멀쩡함 → 정상. 줄이려면 소량씩 자주, 수유 중·후 트림, 수유 후 20~30분 세워 안기. 등 대고 재워도 게움으로 질식하지 않습니다.</li>
    <li><strong>구토(vomiting), 즉시 연락</strong>: 복근을 쓰며 <strong>분수처럼 뿜는(projectile) 구토가 매 수유 후</strong> 반복(생후 2주~4개월, 유문협착증 의심 → 응급), 초록색(담즙)·피 섞임, 젖은 기저귀 감소·입 마름·무기력, 24시간 넘는 구토, 체중 정체. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Why-Babies-Spit-Up.aspx">AAP</a></li>
  </ul>

  <h3>10. 혼합수유</h3>
  <p>젖을 먼저 물리고 부족분만 분유로. 모유와 분유를 한 병에 섞어도 되지만 보관 기한은 분유 기준(실온 2시간)을 따릅니다. 분유를 준 끼니에는 가능하면 유축해서 공급을 유지하세요. <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/breastfeeding/how-much-and-how-often.html">CDC</a></p>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>유럽 분유 온라인 직구, 집에서 만든 분유, 물 타서 묽게 만들기, "low iron" 분유</li>
      <li>가루를 먼저 넣고 물 붓기, 스쿱을 꾹 눌러 담기</li>
      <li>전자레인지로 데우기</li>
      <li>먹다 남은 분유를 냉장했다 다시 주기, 탄 지 2시간 넘은 분유 먹이기</li>
      <li>젖병을 괴어 놓고 자리 비우기, 눕혀서 먹이기, 젖병 물려 재우기</li>
      <li>젖병 부품을 싱크대에 그냥 담가 씻기, 행주로 닦아 말리기</li>
      <li>게움·가스만으로 분유를 자꾸 바꾸기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="1"><p class="qq">Q1. 생후 3주 아기의 가루 분유를 타는 CDC 권고 방법은?</p><div class="opts"><button type="button" class="opt">40°C 미지근한 정수기 물에 바로 탄다</button><button type="button" class="opt">끓인 물을 5분 식혀(약 70°C) 타고, 찬물에 담가 체온으로 식힌다</button><button type="button" class="opt">전자레인지로 물을 데워 탄다</button><button type="button" class="opt">끓는 물을 바로 붓는다</button></div><p class="exp" hidden>정답 2. 2개월 미만·미숙아·면역저하 아기는 Cronobacter 예방을 위해 70°C 물로 조제합니다. 끓는 물을 바로 부으면 영양소가 파괴되고, 전자레인지는 핫스팟 화상 위험이 있습니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q2. 분유를 탄 뒤 아기가 먹기 시작했습니다. 남은 분유를 언제까지 먹일 수 있나요?</p><div class="opts"><button type="button" class="opt">냉장 보관하면 다음 수유 때까지</button><button type="button" class="opt">실온에서 4시간</button><button type="button" class="opt">먹기 시작한 뒤 1시간, 그 후엔 버린다</button><button type="button" class="opt">24시간</button></div><p class="exp" hidden>정답 3. 침이 섞이면 세균이 번식합니다. 조제 후 실온 2시간, 먹기 시작하면 1시간, 안 먹였으면 냉장 24시간입니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. Costco Kirkland 분유와 Similac의 영양 기준 차이는?</p><div class="opts"><button type="button" class="opt">없다. 미국에서 파는 모든 분유는 같은 FDA 기준을 충족한다</button><button type="button" class="opt">브랜드 제품이 영양소가 더 많다</button><button type="button" class="opt">스토어 브랜드는 철분이 없다</button><button type="button" class="opt">유럽 분유가 가장 안전하다</button></div><p class="exp" hidden>정답 1. FDA 등록 제품은 영양 기준이 동일하고 바꿔 먹여도 됩니다. 유럽 분유 직구는 AAP가 권하지 않습니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 생후 6주 아기가 매 수유 후 분수처럼 뿜어 토합니다. 올바른 대응은?</p><div class="opts"><button type="button" class="opt">분유를 바꿔 본다</button><button type="button" class="opt">양을 줄이고 지켜본다</button><button type="button" class="opt">트림을 더 자주 시킨다</button><button type="button" class="opt">유문협착증일 수 있으니 바로 소아과/응급 연락</button></div><p class="exp" hidden>정답 4. 힘없이 흐르는 게움과 달리, 생후 2주~4개월에 매 수유 후 반복되는 분수형 구토는 유문협착증의 전형적 신호로 응급 평가가 필요합니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 생후 1개월 아기의 젖병 소독 빈도(CDC)는?</p><div class="opts"><button type="button" class="opt">매 수유 후 소독</button><button type="button" class="opt">매 수유 후 세척 + 하루 1회 소독</button><button type="button" class="opt">주 1회 소독</button><button type="button" class="opt">세척만 하면 소독은 필요 없다</button></div><p class="exp" hidden>정답 2. 2개월 미만·미숙아·면역저하 아기는 매일 1회 소독(끓이기 5분, 스팀, 식기세척기 sanitize). 건강한 2개월 이상은 꼼꼼한 세척이면 매일 소독은 필수가 아닙니다.</p></div>
  </div>
