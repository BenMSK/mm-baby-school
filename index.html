<section class="day" data-day="11" id="d11" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-bowl"/></svg><div><div class="eyebrow">Day 11 · 6개월부터</div><h2>이유식·알레르기·치아</h2><p class="lead">6개월 무렵부터 시작하는 이유식은 "무엇을 먼저"보다 "철분과 알레르겐을 제때"가 핵심입니다. 한국식 미음 단계와 미국 지침이 가장 많이 갈리는 과목이기도 합니다. 치아 관리는 첫 이가 나는 순간 시작합니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 6가지</h3>
    <ol>
      <li>이유식은 <strong>생후 약 6개월</strong>, 준비 신호(목 가누기·받치면 앉기·관심·혀 밀어내기 소실)가 갖춰졌을 때. 4개월 전은 금지.</li>
      <li>첫 음식은 <strong>철분·아연</strong>이 많은 것(퓨레한 소고기·닭고기, 철분 강화 시리얼). 쌀만 오래 먹이지 않습니다(비소).</li>
      <li><strong>땅콩·계란은 늦추지 않습니다.</strong> 4~6개월 이후 다른 음식 몇 가지를 먹여 본 뒤 묽게 풀어 소량부터, 이후 주 2~3회 꾸준히. 심한 습진·계란 알레르기가 있으면 먼저 소아과 상담.</li>
      <li>돌 전 <strong>꿀·생우유(음료)·주스 금지</strong>, 물은 6개월부터 하루 4~8 oz만.</li>
      <li>질식: 통포도·견과·핫도그·팝콘 금지, 조각은 1.3 cm 이하, 하이체어에서 어른이 지켜보며.</li>
      <li><strong>첫 이가 나면 불소치약 쌀알 크기</strong>로 하루 2회, 첫 이 후 6개월 안에(돌 전) 첫 치과. 벤조카인 젤·호박 목걸이 금지.</li>
    </ol>
  </div>

  <h3>1. 시작 시기와 준비 신호</h3>
  <p>AAP·WHO·CDC 모두 <strong>생후 약 6개월</strong>. 4개월 이전은 금지입니다. 모유(또는 분유)만으로 약 6개월까지 충분합니다(비타민 D·철분 보충 제외). 준비 신호는 모두 갖춰야 합니다: 목을 잘 가눔, 받쳐 주면 앉음, 음식에 관심(쳐다보고 입 벌림), 혀로 밀어내는 반사(tongue-thrust) 소실, 물건을 입으로 가져감, 출생체중의 2배(약 6 kg). 미숙아는 교정 월령 기준으로 소아과와 상의. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Starting-Solid-Foods.aspx">AAP</a> <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/when-what-and-how-to-introduce-solid-foods.html">CDC</a> <a class="src" href="https://www.who.int/health-topics/complementary-feeding">WHO</a></p>

  <h3>2. 첫 음식: 철분과 아연이 먼저</h3>
  <ul>
    <li>6개월 무렵 태아기 철분 저장이 바닥나므로 첫 음식은 <strong>퓨레한 소고기·닭고기·돼지고기, 철분 강화 영아용 시리얼</strong>(iron-fortified infant cereal). 순서는 정해져 있지 않습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Starting-Solid-Foods.aspx">AAP</a></li>
    <li>쌀 비소 주의: FDA는 영아용 쌀 시리얼의 무기비소 기준치를 100 µg/kg로 두었고, CDC·AAP는 <strong>쌀만 먹이지 말고 오트·보리·멀티그레인을 번갈아</strong> 줄 것을 권합니다. <a class="src" href="https://www.fda.gov/regulatory-information/search-fda-guidance-documents/guidance-industry-action-level-inorganic-arsenic-rice-cereals-infants">FDA</a></li>
    <li>한 번에 한 가지 재료를 3~5일 간격(한국 자료는 3~7일)으로 추가하며 설사·발진·구토를 관찰. 비타민 C 식품(과일·채소)을 고기·시리얼과 함께 주면 철분 흡수가 늘어납니다. <a class="src kr" href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5470">질병관리청</a></li>
  </ul>

  <h3>3. 월령별 진행 (미국 기준)</h3>
  <div class="tbl"><table>
    <tr><th>월령</th><th>질감</th><th>하루 횟수</th><th>1회 양(대략)</th><th>모유/분유</th></tr>
    <tr><td>6개월</td><td>묽은 퓨레 → 되직한 퓨레</td><td>1→2회</td><td>반 숟갈로 시작, 며칠 내 60~120 g</td><td>그대로(주 영양원)</td></tr>
    <tr><td>7~8개월</td><td>으깬(mashed)·덩어리 조금, 8개월 전후 부드러운 핑거푸드 시작</td><td>2~3회</td><td>식품군별 2~4 oz</td><td>하루 24~32 oz</td></tr>
    <tr><td>9~11개월</td><td>잘게 썬 부드러운 가족 음식, 핑거푸드 위주</td><td>3회 + 간식 1~2회</td><td>식품군별 2~4 oz</td><td>약 24 oz</td></tr>
    <tr><td>12개월</td><td>가족 식사(잘게, 부드럽게)</td><td>3끼 + 간식 2회</td><td>하루 약 1,000 kcal</td><td>전지 우유 16~24 oz로 전환</td></tr>
  </table></div>
  <p>10개월까지 덩어리 음식을 시작하지 않으면 섭식 거부·지연이 생길 수 있습니다(WHO·질병관리청). 6~23개월 신호: 손 뻗기·입 벌리기 = 더 달라, 밀어내기·입 다물기·고개 돌리기 = 그만. 억지로 한 숟갈 더는 금물. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/sample-one-day-menu-for-an-8-to-12-month-old.aspx">AAP 8~12개월 식단</a> <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/mealtime/signs-your-child-is-hungry-or-full.html">CDC</a></p>

  <h3>4. 알레르기 유발 식품 조기 도입: 가장 큰 한·미 차이</h3>
  <p>2015년 LEAP 연구에서 고위험 영아에게 땅콩을 일찍 먹이자 땅콩 알레르기가 81% 줄었습니다. 이에 따라 미국 NIAID가 2017년 지침을 내고 AAP가 2019년 임상보고서로 채택했습니다. <strong>늦출수록 알레르기가 는다는 것이 현재 근거</strong>입니다. <a class="src" href="https://www.niaid.nih.gov/diseases-conditions/guidelines-clinicians-and-patients-food-allergy">NIAID</a> <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/when-to-introduce-egg-peanut-butter-and-other-common-food-allergens-to-your-baby-food-allergy-prevention-tips.aspx">AAP</a></p>
  <div class="tbl"><table>
    <tr><th>아기 상태</th><th>땅콩 도입 시기</th><th>방법</th></tr>
    <tr><td><strong>심한 습진 또는 계란 알레르기</strong></td><td>생후 4~6개월, <strong>먼저 소아과 상담</strong>(검사 후 필요 시 진료실에서 첫 시도)</td><td>2개월·4개월 검진 때 미리 상의</td></tr>
    <tr><td>경증~중등도 습진</td><td>약 6개월, 다른 이유식을 몇 가지 먹여 본 뒤</td><td>집에서 가능</td></tr>
    <tr><td>습진·알레르기 없음</td><td>4~6개월 이후 가족 식습관에 맞춰 자유롭게</td><td>집에서 가능</td></tr>
  </table></div>
  <ul>
    <li><strong>땅콩 주는 법</strong>: 통땅콩·덩어리 땅콩버터는 4세까지 질식 위험으로 금지. 부드러운 땅콩버터 2 tsp를 따뜻한 물 2~3 tsp로 묽게 풀거나 퓨레·요거트에 섞어 숟가락으로. 땅콩가루(peanut powder)나 아기용 땅콩 퍼프(Bamba 등)도 가능. 첫날은 아주 소량 → 반응 없으면 늘리고, 이후 <strong>주 2~3회 이상 꾸준히</strong>(NIAID 목표 주 약 6~7 g 땅콩 단백).</li>
    <li><strong>계란</strong>: 완전히 익힌 스크램블·삶은 계란 약 1/3개부터, 역시 꾸준히. 우유 단백(요거트·치즈), 밀, 콩, 생선, 조개류, 참깨, 견과류(가루·버터 형태)도 6개월 전후 다른 음식과 함께 도입합니다.</li>
    <li>미국 9대 알레르겐(라벨 의무 표기): 우유, 계란, 땅콩, 견과류, 콩, 밀, 생선, 갑각류, 참깨. 심한 반응은 땅콩·견과·우유·참깨가 가장 흔합니다. <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Food-Allergies-in-Children.aspx">AAP</a></li>
    <li>새 알레르겐은 <strong>오전·집에서, 아기가 건강할 때</strong>, 2시간은 지켜볼 수 있는 날에. 괜찮았던 음식은 계속 식단에 유지합니다.</li>
  </ul>

  <h3>5. 알레르기 반응: 가벼운 것과 응급</h3>
  <div class="tbl"><table>
    <tr><th>경증(대개 2시간 내)</th><th>응급 — 아나필락시스, 즉시 911</th></tr>
    <tr><td>입 주변 두드러기·발진, 가려움, 구토·설사 1회, 코막힘 → 해당 음식 중단, 사진 찍고 소아과 연락. 의사 지시에 따라 항히스타민</td><td>입술·혀·얼굴 붓기, 쌕쌕거림·기침·목 조임·호흡곤란, 창백·축 늘어짐·의식 저하, 두 기관 이상 동시 증상(피부+소화기 등), 반복 구토. 에피네프린이 있으면 먼저 주사 후 911. 항히스타민은 대용이 아님</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Food-Allergies-in-Children.aspx">AAP 식품 알레르기</a> · 한국 영유아 흔한 원인 식품: 계란·우유·밀·땅콩·메밀·새우·대두·호두 <a class="src kr" href="https://cra.amc.seoul.kr/asan/depts/cra/K/content.do?menuId=5175">서울아산병원</a></p>

  <h3>6. 12개월 전 금지·제한 식품</h3>
  <div class="tbl"><table>
    <tr><th>항목</th><th>규칙</th><th>이유</th></tr>
    <tr><td><strong>꿀</strong></td><td>12개월 전 절대 금지(물·분유·노리개에 묻히기 포함)</td><td>영아 보툴리누스증. 변비, 약한 빨기·울음, 축 처짐, 눈꺼풀 처짐(노출 후 3~30일) <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/infections/Pages/Botulism.aspx">AAP</a></td></tr>
    <tr><td><strong>생우유(음료)</strong></td><td>12개월 전 금지. 플레인 요거트·치즈는 7~8개월부터 가능</td><td>장출혈·철결핍빈혈, 신장 부담 <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/formula-feeding/Pages/Why-Formula-Instead-of-Cows-Milk.aspx">AAP</a></td></tr>
    <tr><td>물</td><td>6개월 전 금지, 6~12개월 하루 120~240 mL(4~8 oz)를 컵으로</td><td>저나트륨혈증·수유량 감소 <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Choose-Water-for-Healthy-Hydration.aspx">AAP</a></td></tr>
    <tr><td>주스</td><td>12개월 전 금지, 1~3세도 하루 4 oz 이하</td><td>영양 이득 없음, 충치 <a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/Where-We-Stand-Fruit-Juice.aspx">AAP</a></td></tr>
    <tr><td>소금·설탕</td><td>간하지 않기, 첨가당 0(24개월까지)</td><td>고염 가공식품(핫도그·런천미트·통조림) 피하기 <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/foods-and-drinks-to-avoid-or-limit.html">CDC</a></td></tr>
    <tr><td>비살균 우유·주스·치즈, 고수은 생선(상어·황새치·king mackerel·bigeye tuna), 카페인·차·탄산</td><td>금지</td><td>세균성 장염, 신경 발달 <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/foods-and-drinks-to-avoid-or-limit.html">CDC</a></td></tr>
    <tr><td>식물성 우유(아몬드·귀리 등)</td><td>12개월 전 음료로 금지. 이후 우유 대체는 두유만</td><td><a class="src" href="https://www.healthychildren.org/English/healthy-living/nutrition/Pages/recommended-drinks-for-young-children-ages-0-5.aspx">AAP 음료 권고</a></td></tr>
  </table></div>

  <h3>7. 질식(choking) 예방</h3>
  <ul>
    <li><strong>약 4세까지 금지</strong>: 핫도그·소시지, 통포도·방울토마토·블루베리 통째, 견과류·씨앗, 팝콘, 생당근·생사과 조각, 큰 고기·치즈 덩어리(스트링치즈), 덩어리 땅콩버터, 딱딱하거나 끈적한 사탕·젤리·마시멜로·껌, 통옥수수알, 건포도. <a class="src" href="https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/Choking-Prevention.aspx">AAP</a> <a class="src" href="https://www.cdc.gov/infant-toddler-nutrition/foods-and-drinks/choking-hazards.html">CDC</a></li>
    <li><strong>안전한 형태</strong>: 익혀서 잇몸으로 으깨질 정도로 부드럽게, 조각은 <strong>1.3 cm(½인치) 이하</strong>. 포도·방울토마토·핫도그는 세로로 4등분. 핑거푸드는 동전 모양이 아니라 <strong>손가락 모양 긴 스틱</strong>(한쪽 끝을 쥐고 반대쪽을 씹도록).</li>
    <li><strong>식사 환경</strong>: 하이체어에 똑바로 앉혀서, 항상 어른이 지켜보며. 유모차·카시트·기어 다니면서 먹이기 금지.</li>
    <li>구역질(gagging: 소리 나고 얼굴 붉어짐, 스스로 해결)과 질식(choking: 소리 없음, 파랗게 됨)을 구분하고, 영아 CPR·하임리히를 미리 배워 두세요(Day 12).</li>
  </ul>

  <h3>8. 아기주도이유식(BLW) vs 퓨레</h3>
  <p>AAP 입장: BLW는 자율성·다양한 질감·과식 방지 등의 장점이 제안되지만 연구가 적습니다. 단점은 <strong>철분·열량 부족 위험</strong>(과일만 먹고 고기를 안 먹음)과 질식 우려. 현실적 절충은 퓨레와 핑거푸드를 섞어 가되, <strong>철분 식품과 알레르겐은 부모가 주도해 챙기는 것</strong>입니다. 스스로 앉지 못하거나 미숙아면 기다리세요. SNS의 "통닭다리 먹는 아기" 영상은 위험합니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/baby-led-weaning-is-it-safe.aspx">AAP</a></p>

  <h3>9. 한국식 이유식 단계와 미국 지침 맞춰 보기</h3>
  <div class="tbl"><table>
    <tr><th>한국 단계</th><th>월령(서울아산병원·질병관리청)</th><th>형태·횟수</th><th>미국 대응</th><th>차이·메모</th></tr>
    <tr><td>초기(미음)</td><td>5~6개월(모유아 5개월·분유아 4~6개월 권고 자료도 있음)</td><td>쌀미음 하루 1회 → 6개월 소고기 추가</td><td>6개월 퓨레 1~2회</td><td>미국은 첫 음식부터 고기·철분 시리얼. 한국엔 철분 강화 영아 시리얼이 없어 <strong>소고기를 6개월에 일찍</strong> 넣는 것이 핵심. 쌀 단독 장기 사용은 비권장</td></tr>
    <tr><td>중기(죽)</td><td>7~9개월</td><td>다진 형태, 하루 2~3회</td><td>7~8개월 mashed + 핑거푸드</td><td>미국은 8개월 전후 핑거푸드 시작을 강조</td></tr>
    <tr><td>후기(진밥)</td><td>10~11개월</td><td>진밥, 하루 3회</td><td>9~11개월 3회 + 간식</td><td>유사</td></tr>
    <tr><td>완료기</td><td>12개월+</td><td>밥·가족식</td><td>12개월 가족식, 생우유</td><td>동일</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src kr" href="https://www.amc.seoul.kr/asan/depts/child/K/bbsDetail.do?menuId=4342&amp;contentId=259927">서울아산병원 이유식</a> <a class="src kr" href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5470">질병관리청 이유기 보충식</a></p>
  <div class="box note"><h4>알레르겐 시기, 왜 다르게 들리나</h4><p>질병관리청 이유기 보충식 페이지는 "견과류·갑각류는 돌 무렵부터"라고 적으면서 같은 페이지에서 "알레르기를 우려해 미리 제한하는 것은 권장되지 않음"이라 하고, 질병관리청 영유아 식이영양 페이지는 "특별한 이유 없이 늦출 필요 없음"으로 미국과 일치합니다. 서울아산병원 소아알레르기과 Q&amp;A에는 "이유 시기를 늦춰 예방"이라는 과거 관점이 남아 있고, 같은 병원 소아소화기영양과는 "아토피 때문에 6개월 이후로 미루지 말 것"으로 안내합니다. <strong>미국 소아과는 4~6개월 땅콩·계란 조기 도입을 권할 것이고, 현재 근거는 그쪽이 강합니다.</strong> 한국 가족에게 "돌 전엔 계란 흰자·땅콩 금지"라는 조언을 들어도 미국 기준을 따르세요. 하정훈·정유미 두 소아과 전문의 채널이 이 내용을 한국어로 설명해 줍니다(아래 영상). <a class="src kr" href="https://www.amc.seoul.kr/asan/depts/child/K/bbsDetail.do?menuId=5285&amp;contentId=260023">서울아산병원 소아소화기영양과</a></p></div>

  <h3>10. 돌 전후 전환</h3>
  <ul>
    <li><strong>생우유</strong>: 12개월부터 전지(whole) 우유 하루 480~720 mL(16~24 oz). 24 oz를 넘으면 철결핍·밥 거부. 2세까지 전지, 이후 저지방. 토들러 분유는 불필요. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/formula-feeding/Pages/Why-Formula-Instead-of-Cows-Milk.aspx">AAP</a></li>
    <li><strong>컵</strong>: 6개월부터 열린 컵·빨대컵으로 연습. 젖병은 12개월부터 줄여 <strong>12~18개월 사이 완전히 떼기</strong>(충치·과식·치열·언어 영향). <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Discontinuing-the-Bottle.aspx">AAP</a></li>
    <li>12개월 검진에서 빈혈(철분) 선별검사 + 납(lead) 검사가 일반적. 모유수유는 원하는 만큼 계속(AAP는 2년 이상 지지).</li>
  </ul>

  <h3>11. 이 나기와 이앓이</h3>
  <p>첫 이(보통 아래 앞니 2개)는 대개 <strong>6개월 전후</strong>. 4~7개월에 시작하는 아기도, 12개월에 하나도 없는 아기도 정상이며 18개월까지 없으면 치과 상담. 순서는 아래 중절치 → 위 중절치 → 측절치 → 첫 어금니 → 송곳니, 젖니 20개는 약 3세에 완성. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/teething-tooth-care/Pages/Babys-First-Tooth-Facts-Parents-Should-Know.aspx">AAP</a></p>
  <div class="tbl"><table>
    <tr><th>이앓이 맞음</th><th>이앓이 아님 → 소아과 연락</th></tr>
    <tr><td>침 많이 흘림, 잇몸 부음·민감, 물건을 씹으려 함, 가벼운 보챔, 체온이 아주 약간 오름, 침 때문에 입 주위 발진</td><td><strong>진짜 발열(직장 체온 38°C/100.4°F 이상)</strong>, 하루 이상 설사, 심하게 우는 것, 콧물·기침. "이 나느라 열나요"는 근거가 없습니다. 생후 3개월 미만의 38°C 이상 발열은 어떤 경우든 응급 평가(이 시기엔 이가 나지도 않음)</td></tr>
  </table></div>
  <div class="tbl"><table>
    <tr><th>해도 됨</th><th>하면 안 됨 (FDA·AAP 경고)</th></tr>
    <tr><td>깨끗한 손가락으로 잇몸 마사지 · 단단한 고무 치발기를 <strong>냉장</strong> 정도로 차게(액체 충전형·돌처럼 얼린 것은 금지) · 차갑고 젖은 거즈·수건 · 6개월 이후 차가운 물 컵 · 많이 힘든 밤엔 소아과 확인 후 아세트아미노펜(6개월 이후 이부프로펜 가능)</td><td><strong>벤조카인(benzocaine) 젤·액</strong>(Orajel, Anbesol 등: 메트헤모글로빈혈증, 사망 사례. FDA는 2세 미만 사용 금지) · <strong>리도카인</strong> · <strong>동종요법 이앓이 정제·젤</strong>(Hyland's 등, 벨라돈나 함량 불균일, FDA 경고·리콜) · <strong>호박 목걸이(amber teething necklace)</strong>(목 졸림 사망·구슬 삼킴, 효과 근거 없음) · 잇몸에 술 바르기</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.fda.gov/consumers/consumer-updates/safely-soothing-teething-pain-infants-and-children">FDA 이앓이 안전 안내</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/teething-tooth-care/Pages/Teething-Pain.aspx">AAP 이앓이</a> · 미국 약국엔 benzocaine 제품이 성인용으로 여전히 진열되어 있으니 라벨의 "under 2 years" 경고를 확인하세요.</p>

  <h3>12. 닦기·불소치약·첫 치과</h3>
  <ul>
    <li><strong>이 나기 전(출생~)</strong>: 하루 1~2회, 특히 마지막 수유 후 깨끗한 젖은 거즈나 실리콘 손가락 칫솔로 잇몸·혀를 닦아 줍니다. <a class="src" href="https://www.aapd.org/resources/parent/faq/">AAPD</a></li>
    <li><strong>첫 이가 나는 순간부터 불소치약(fluoride toothpaste) 쌀알 크기</strong>로 하루 2회(아침 식후·밤 마지막 수유 후, 밤이 더 중요). 3세부터 완두콩 크기. 헹굴 필요 없고 삼켜도 이 양이면 안전. "불소 없는 training toothpaste"는 충치 예방 효과가 없어 미국 지침은 첫 이부터 불소치약입니다. <a class="src" href="https://www.healthychildren.org/English/healthy-living/oral-health/Pages/Brushing-Up-on-Oral-Health-Never-Too-Early-to-Start.aspx">AAP</a> <a class="src" href="https://www.ada.org/resources/ada-library/oral-health-topics/fluoride-topical-and-systemic-supplements">ADA</a></li>
    <li><strong>첫 치과</strong>: 첫 이가 난 뒤 6개월 안에, 늦어도 첫돌 전에 소아치과(pediatric dentist)에서 "dental home" 만들기. Kaiser 의료보험에는 치과가 포함되지 않는 경우가 많으니 가입 플랜의 dental 보장을 확인. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/teething-tooth-care/Pages/Babys-First-Tooth-Facts-Parents-Should-Know.aspx">AAP</a></li>
    <li><strong>불소 바니시(fluoride varnish)</strong>: 첫 이부터 5세까지 6개월마다 소아과·치과에서 발라 줍니다. 예방 서비스라 보통 본인부담 없음. well-visit 때 "fluoride varnish 해 주세요"라고 요청하세요.</li>
    <li><strong>불소 수돗물</strong>: Redwood City 수돗물은 SFPUC(Hetch Hetchy) 광역 상수도로 불소가 첨가되어 있습니다(시 수질보고서 0.5~0.8 ppm, 목표 0.7 mg/L). ADA 기준상 수돗물을 마시고 조제에 쓰면 <strong>불소 드롭은 필요 없습니다</strong>. 생수만 쓰거나 역삼투(RO) 정수기를 쓰면 불소가 제거되므로 6개월 검진 때 소아과에 상의. 불소 수돗물로 분유를 타도 AAP는 안전하다고 봅니다. <a class="src" href="https://www.healthychildren.org/English/healthy-living/oral-health/Pages/FAQ-Fluoride-and-Children.aspx">AAP 불소 FAQ</a> <a class="src" href="https://www.redwoodcity.org/departments/public-works/water/water-quality">Redwood City 수질</a></li>
  </ul>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>4개월 전 이유식, 젖병에 시리얼 타기</li>
      <li>쌀미음만 몇 주씩 단독으로 먹이기 (철분 부족 + 비소)</li>
      <li>"알레르기 예방"으로 땅콩·계란을 돌까지 미루기</li>
      <li>돌 전 꿀·생우유(음료)·주스, 6개월 전 물</li>
      <li>통포도·견과·핫도그·팝콘, 동전 모양 조각, 혼자 두고 먹이기</li>
      <li>벤조카인 젤, 동종요법 이앓이 정제, 호박 목걸이, 돌처럼 얼린 치발기</li>
      <li>젖병 물려 재우기, 돌 지나서도 젖병 계속 쓰기, 토들러 분유</li>
      <li>불소 없는 치약으로 시작하기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 6개월 아기의 첫 이유식으로 미국 지침이 가장 강조하는 것은?</p><div class="opts"><button type="button" class="opt">쌀미음부터 2주</button><button type="button" class="opt">과일 퓨레</button><button type="button" class="opt">퓨레한 고기나 철분 강화 시리얼 등 철분이 많은 음식</button><button type="button" class="opt">채소만</button></div><p class="exp" hidden>정답 3. 6개월엔 태아기 철분 저장이 바닥납니다. 순서는 정해져 있지 않지만 철분·아연 식품을 먼저. 쌀은 비소 때문에 단독 장기 사용을 피하고 곡물을 번갈아 줍니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 습진이 없는 건강한 아기에게 땅콩을 처음 주는 올바른 방법은?</p><div class="opts"><button type="button" class="opt">돌 지나서 땅콩 한 알</button><button type="button" class="opt">4~6개월 이후 다른 음식을 먹여 본 뒤, 땅콩버터를 물에 묽게 풀어 소량부터, 이후 주 2~3회 꾸준히</button><button type="button" class="opt">땅콩버터를 숟가락으로 한가득</button><button type="button" class="opt">알레르기 검사 결과가 나올 때까지 금지</button></div><p class="exp" hidden>정답 2. 조기·지속 노출이 알레르기를 줄입니다(LEAP). 통땅콩·덩어리 땅콩버터는 4세까지 질식 위험. 심한 습진·계란 알레르기가 있을 때만 먼저 소아과 상담.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 돌 전 아기에게 절대 주면 안 되는 것은?</p><div class="opts"><button type="button" class="opt">꿀</button><button type="button" class="opt">플레인 요거트</button><button type="button" class="opt">완전히 익힌 계란</button><button type="button" class="opt">두부</button></div><p class="exp" hidden>정답 1. 꿀은 영아 보툴리누스증 위험으로 12개월 전 금지(노리개에 묻히는 것도). 요거트·치즈는 7~8개월부터, 익힌 계란은 6개월 전후부터 가능합니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 8개월 아기에게 포도를 줄 때 안전한 방법은?</p><div class="opts"><button type="button" class="opt">통째로</button><button type="button" class="opt">반으로 잘라</button><button type="button" class="opt">껍질만 벗겨</button><button type="button" class="opt">세로로 4등분해 1.3 cm 이하로</button></div><p class="exp" hidden>정답 4. 통포도·방울토마토·핫도그는 기도 크기와 같아 가장 위험한 질식 식품입니다. 세로로 4등분하고, 하이체어에서 어른이 지켜봅니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 첫 이가 났습니다. 치약은?</p><div class="opts"><button type="button" class="opt">뱉을 수 있을 때까지 무불소 치약</button><button type="button" class="opt">불소치약을 쌀알 크기로 하루 2회</button><button type="button" class="opt">치약 없이 물로만</button><button type="button" class="opt">완두콩 크기 불소치약</button></div><p class="exp" hidden>정답 2. AAP·ADA는 첫 이부터 불소치약 쌀알(smear) 크기, 3세부터 완두콩 크기. 이 양은 삼켜도 안전하고 무불소 치약은 충치 예방 효과가 없습니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q6. 7개월 아기가 침을 많이 흘리고 보채며 직장 체온 38.6°C입니다. 해석은?</p><div class="opts"><button type="button" class="opt">이앓이 열이니 치발기를 준다</button><button type="button" class="opt">벤조카인 젤을 잇몸에 바른다</button><button type="button" class="opt">이앓이는 진짜 열을 내지 않으므로 감염 가능성, 소아과 연락</button><button type="button" class="opt">호박 목걸이를 채운다</button></div><p class="exp" hidden>정답 3. 이앓이는 체온을 아주 약간 올릴 뿐 38°C 이상의 발열을 일으키지 않습니다. 벤조카인·호박 목걸이는 FDA가 경고한 금지 품목입니다.</p></div>
  </div>

<section class="day" data-day="1" id="d1" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-baby"/></svg><div><div class="eyebrow">Day 1 · 시작</div><h2>첫 72시간: 병원에서 집까지</h2><p class="lead">태어난 직후 병원에서 무슨 일이 일어나는지, 동의서에 적힌 처치가 무엇인지, 신생아의 "이상해 보이지만 정상인" 모습은 무엇인지 알고 가면 첫 사흘이 훨씬 덜 무섭습니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>출생 직후 처치 4가지: <strong>피부접촉 → 비타민K 주사 → 안연고 → B형간염 1차</strong>. 모두 받는 것이 AAP와 한국 질병관리청의 공통 권고입니다.</li>
      <li>퇴원 전 검사 4가지: <strong>선별검사 채혈(12~48시간), 청력, 심장 산소포화도, 빌리루빈</strong>.</li>
      <li>체중은 출생체중의 <strong>7~10%까지 빠지는 게 정상</strong>, 생후 2주쯤 회복. 퇴원 후 <strong>48시간 안에</strong> 소아과에서 체중과 황달을 확인합니다(Kaiser는 보통 생후 3~5일).</li>
      <li>신생아의 좁쌀 여드름, 몽고반점, 딸꾹질, 사시처럼 보이는 눈, 가슴 부풀음은 <strong>정상</strong>입니다.</li>
      <li>황달은 60~85%의 아기에게 나타나지만, <strong>생후 24시간 안에 노래지거나 배·다리까지 번지면 바로 진료</strong>합니다. 햇빛에 두는 것은 치료가 아닙니다.</li>
    </ol>
  </div>

  <h3>1. 분만 직후 순서대로 일어나는 일</h3>
  <ul>
    <li><strong>피부접촉(skin-to-skin, kangaroo care)</strong>: 아기를 기저귀만 채운 채 엄마 가슴 위에 올려 담요로 덮습니다. 심박·호흡 안정, 체온 유지, 모유수유 시작에 도움. 엄마가 못 하면 아빠가 합니다. 졸릴 때는 하지 않습니다(같이 잠들면 위험). <a class="src" href="https://my.clevelandclinic.org/health/treatments/12578-kangaroo-care">Cleveland Clinic</a></li>
    <li><strong>APGAR 점수</strong>: 출생 1분·5분에 심박, 호흡, 근긴장, 반사, 피부색을 각 0~2점(총 10점)으로 평가합니다. 7점 이상이 보통이고, 손발이 파래서 10점은 드뭅니다. 장기 발달과는 무관합니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/prenatal/delivery-beyond/Pages/Apgar-Scores.aspx">AAP</a></li>
    <li><strong>비타민K 근육주사</strong>: 신생아는 혈액 응고에 필요한 비타민K가 부족하게 태어납니다. 주사를 안 맞으면 후기 비타민K 결핍 출혈(생후 1주~6개월, 30~60%가 뇌출혈)이 <strong>81배</strong> 더 흔합니다. 경구제는 효과가 낮고 미국엔 신생아용이 없습니다. <a class="src" href="https://www.cdc.gov/ncbddd/vitamink/facts.html">CDC</a> <a class="src" href="https://kidshealth.org/en/parents/vitamin-k-shot.html">KidsHealth</a></li>
    <li><strong>안연고(erythromycin eye ointment)</strong>: 분만 중 임균에 의한 신생아 결막염·각막 손상 예방. 캘리포니아를 포함한 대부분의 주에서 법적 의무입니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/prenatal/delivery-beyond/Pages/Erythromycin-Ointment.aspx">AAP</a></li>
    <li><strong>B형간염 백신 1차</strong>: 아래 2번 참고.</li>
    <li><strong>모자동실(rooming-in)</strong>: 미국 병원은 아기를 신생아실이 아니라 엄마 병실에 두는 것이 기본입니다. 한국의 신생아실·산후조리원 문화와 가장 다른 점입니다.</li>
  </ul>

  <h3>2. B형간염 출생 접종: 2026년 현재 미국 상황</h3>
  <div class="box note">
    <p><strong>AAP(미국소아과학회)</strong>는 모든 신생아에게 생후 24시간 이내 1차 접종을 유지합니다(2026-01-02 갱신). <strong>한국 질병관리청</strong>도 출생 시(24시간 이내)·1개월·6개월 3회로 같습니다. <a class="src" href="https://www.aap.org/en/patient-care/hepatitis-b/hepatitis-b-vaccine-frequently-asked-questions/">AAP FAQ</a> <a class="src kr" href="https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&amp;menuCd=1102">질병관리청</a></p>
    <p>연방 쪽은 복잡합니다. 2025-12-05 ACIP가 HBsAg 음성 산모의 아기는 "개별 결정"으로 바꾸는 안을 가결했지만, 2026-03-16 연방법원이 AAP v. Kennedy 사건에서 이 투표와 2026년 1월 일정표 메모의 효력을 정지시켜 기존 일정표가 복원됐습니다. 2026-10-19 현재 CDC 공식 일정표는 "출생 시 24시간 이내 1회"를 적고 있고, 정부는 항소 중입니다. <a class="src" href="https://www.cdc.gov/vaccines/hcp/imz-schedules/child-adolescent-age.html">CDC 일정표</a> <a class="src" href="https://www.cidrap.umn.edu/childhood-vaccines/state-us-vaccine-policy-special-edition-mar-17-2026">CIDRAP 2026-03-17</a> <a class="src" href="https://ccf.georgetown.edu/2026/03/31/court-order-presses-pause-on-new-acip-committee-and-changes-to-childhood-vaccination-schedule/">Georgetown CCF</a></p>
    <p><strong>실전</strong>: 12월 출산 전에 상황이 또 바뀔 수 있으니 입원할 때 "Hepatitis B birth dose 되나요?"라고 확인하고, 됩니다. 영아기에 감염되면 약 90%가 만성 B형간염이 되므로 출생 접종이 안전망입니다. <a class="src" href="https://www.cdc.gov/hepatitis-b/hcp/clinical-overview/index.html">CDC</a></p>
  </div>

  <h3>3. 퇴원 전 선별검사 4종</h3>
  <div class="tbl"><table>
    <tr><th>검사</th><th>시기</th><th>내용</th></tr>
    <tr><td>신생아 선별검사 채혈 (CA Newborn Screening)</td><td>생후 <strong>12~48시간</strong>(24시간이 최적), 퇴원 전 필수</td><td>발뒤꿈치 채혈, 80종 이상 질환(대사·호르몬·혈색소·낭성섬유증 등). 종교적 사유로만 거부 가능. 양성 = 진단이 아니라 추가검사 필요 <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Newborn-Screening-Tests.aspx">AAP</a></td></tr>
    <tr><td>청력검사</td><td>퇴원 전(늦어도 1개월)</td><td>작은 이어폰으로 몇 분. 불합격 시 3개월 안에 정밀검사, 6개월 안에 조기개입(1-3-6 원칙) <a class="src" href="https://www.cdc.gov/hearing-loss-children/screening/index.html">CDC</a></td></tr>
    <tr><td>선천성 심장질환 산소포화도(CCHD pulse oximetry)</td><td>퇴원 전(통상 24시간 이후)</td><td>손·발에 센서, 통증 없음. 모든 주에서 시행</td></tr>
    <tr><td>빌리루빈(TcB/TSB)</td><td>퇴원 전 모든 아기 최소 1회; 24시간 내 황달이 보이면 즉시</td><td>피부 측정기 또는 채혈. 48시간 전에 퇴원하면 퇴원 후 2일 내 재진 <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Jaundice.aspx">AAP</a></td></tr>
  </table></div>

  <h3>4. 체중, 퇴원, 첫 소아과 방문</h3>
  <ul>
    <li>생후 며칠간 출생체중의 <strong>7~10%</strong>까지 빠지는 것이 정상이고, 대개 <strong>생후 2주</strong>쯤 회복합니다. <a class="src" href="https://kidshealth.org/en/parents/grownewborn.html">KidsHealth</a></li>
    <li>미국은 자연분만 후 24~48시간, 제왕절개 후 2~4일이면 퇴원하는 것이 보통입니다. AAP는 퇴원 후 <strong>48시간 이내</strong> 체중 확인 진료를 권고하고, Kaiser는 첫 well-child 방문을 보통 <strong>생후 3~5일</strong>에 잡습니다(퇴원 시 예약). 이후 2주·2개월·4개월·6개월. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.pediatric-care">Kaiser</a> <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.caring-for-your-newborn-at-home">Kaiser: 집에서 신생아 돌보기</a></li>
    <li><strong>입원 중 이것만은 물어보기</strong>: ① 빌리루빈 수치와 재검 시점 ② B형간염·RSV 항체주사 접종 여부 ③ 퇴원 후 첫 진료 예약(날짜·장소) ④ advice nurse 전화번호(Day 8).</li>
  </ul>

  <h3>5. 신생아의 "정상" 모습</h3>
  <div class="tbl"><table>
    <tr><th>모습</th><th>설명</th><th>언제 없어지나</th></tr>
    <tr><td>태지(vernix)</td><td>하얗고 기름진 치즈 같은 막</td><td>첫 목욕 때</td></tr>
    <tr><td>머리 모양(molding)</td><td>산도를 지나며 길쭉·뾰족</td><td>1주 안에 둥글어짐</td></tr>
    <tr><td>숨구멍(fontanelle)</td><td>앞쪽(크다)·뒤쪽(작다) 두 곳. 맥박처럼 뛰는 건 정상</td><td>뒤 ~6개월, 앞 12~18개월</td></tr>
    <tr><td>비립종(milia)</td><td>코·턱의 좁쌀 같은 흰 점. 짜지 말 것</td><td>몇 주</td></tr>
    <tr><td>신생아 여드름</td><td>엄마 호르몬 영향, 얼굴의 붉은 좁쌀</td><td>몇 주</td></tr>
    <tr><td>중독성 홍반(erythema toxicum)</td><td>벼룩 물린 듯 붉은 바탕에 노란 점, 생후 1~3일. 절반의 아기에게</td><td>1주</td></tr>
    <tr><td>몽고반점</td><td>엉덩이·등의 푸른 반점. 아시아계 아기 대부분. 미국 의료진은 멍과 구분해 기록합니다</td><td>수년 내 옅어짐</td></tr>
    <tr><td>연어반(stork bite)</td><td>눈꺼풀·이마·목 뒤의 붉은 자국</td><td>18개월 내</td></tr>
    <tr><td>가슴 부풀음, 가성 월경</td><td>엄마 에스트로겐 영향. 남녀 모두 가슴이 커지고 젖이 비칠 수 있음. 여아는 며칠간 흰 분비물·소량 혈성 분비물</td><td>수주</td></tr>
    <tr><td>사시처럼 보이는 눈</td><td>초점 조절 미숙</td><td>2~3개월</td></tr>
    <tr><td>딸꾹질·재채기</td><td>흔하고 질병 아님(재채기는 감기 아님)</td><td>–</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://kidshealth.org/en/parents/newborn-variations.html">KidsHealth</a> <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=newborn-appearance-90-P02691">Stanford Children's</a> <a class="src" href="https://medlineplus.gov/ency/article/002301.htm">MedlinePlus</a></p>
  <ul>
    <li><strong>반사</strong>: 찾기(rooting) ~4개월, 빨기 지속, 모로/놀람 ~2개월, 손바닥 잡기 5~6개월, 걷기 반사 ~2개월, 긴장성 목반사 5~7개월. 있으면 정상, 때가 되면 사라집니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Newborn-Reflexes.aspx">AAP</a></li>
    <li><strong>호흡</strong>: 깨어 있을 때 40~60회/분, 잘 때 30~40회. <strong>주기성 호흡</strong>(5~10초 멈췄다가 빠르게 쉼)은 생후 2~4주에 가장 흔하고 ~6개월에 사라집니다. 피부색·심박 변화가 없으면 정상. 10초 이상(특히 20초 이상) 멈춤, 입술·얼굴이 파랗거나 회색, 깨울 수 없음 → 911. <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=breathing-problems-90-P02666">Stanford</a> <a class="src" href="https://my.clevelandclinic.org/health/symptoms/periodic-breathing">Cleveland Clinic</a></li>
    <li><strong>수면</strong>: 하루 16~18시간, 1~3시간마다 깨서 먹음. 밤낮 구분은 아직 없음. 항상 등 대고 재웁니다(Day 2). <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=newborn-sleep-patterns-90-P02632">Stanford</a></li>
  </ul>

  <h3>6. 첫 주 기저귀: 날짜별 기준</h3>
  <div class="tbl"><table>
    <tr><th>생후</th><th>소변 기저귀</th><th>대변</th><th>색·질감</th></tr>
    <tr><td>1일</td><td>1개 이상</td><td>1~2회</td><td>태변(meconium): 검고 끈적</td></tr>
    <tr><td>2일</td><td>2개 이상</td><td>1~2회</td><td>검정~짙은 녹색</td></tr>
    <tr><td>3일</td><td>3개 이상</td><td>2회 이상</td><td>이행변: 녹색→노란색</td></tr>
    <tr><td>4일</td><td>4개 이상</td><td>2회 이상</td><td>녹황색</td></tr>
    <tr><td>5~7일</td><td><strong>6개 이상</strong>, 거의 무색~연노랑</td><td><strong>3~4회 이상</strong></td><td>노랗고 묽으며 알갱이(seedy)</td></tr>
    <tr><td>2주~1개월</td><td>6개 이상</td><td>거의 매 수유마다</td><td>노란 알갱이변. 분유 아기는 하루 1회나 격일도 정상</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/breastfeeding/Pages/How-to-Tell-if-Baby-is-Getting-Enough-Milk.aspx">AAP</a> <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.caring-for-your-newborn-at-home">Kaiser</a> · 2~4일차의 "n일에 n개" 중간값은 널리 쓰이는 임상 기준입니다. 첫 1개월에 하루 1회 미만 변은 모유 부족 신호일 수 있습니다.</p>

  <h3>7. 황달(jaundice)</h3>
  <ul>
    <li>생후 2~4일 얼굴부터 노래져 가슴·배·팔다리로 내려옵니다. 만삭아의 60~85%에서 나타나고 대부분 생리적이며 1~2주에 좋아집니다. 모유 아기는 한 달쯤 갈 수 있습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Jaundice.aspx">AAP</a> <a class="src kr" href="https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=32022">서울아산병원</a></li>
    <li><strong>바로 진료</strong>: 생후 <strong>24시간 이내</strong> 황달, 황달이 배·팔다리·발바닥까지 번짐, 눈 흰자가 노랗게, 잘 안 깨고 안 먹고 처짐, 만삭아에서 2주 이상(모유 아기 4주 이상) 지속, 흰색·회색 변. <a class="src kr" href="https://health.severance.healthcare/health/encyclopedia/disease/body_board.do?mode=view&amp;articleNo=67086">세브란스</a></li>
    <li>위험 요인: 37주 미만, 퇴원 전 수치 높음, 수유 어려움, 두혈종·멍, 형제가 광선치료를 받은 가족력.</li>
    <li>치료는 <strong>광선치료(phototherapy)</strong>. <strong>햇빛에 두는 것은 안전하지 않습니다</strong>(AAP). 모유수유를 8~12회로 계속하는 것이 황달 해소에 도움. 방치하면 핵황달(뇌 손상)로 갈 수 있어 퇴원 전 검사와 재진이 중요합니다.</li>
    <li>한국 사이트는 "12 mg/dL" 같은 고정 수치를 많이 적지만, AAP 2022 지침은 생후 시간별 노모그램으로 판단하므로 수치만 보고 비교하지 마세요.</li>
  </ul>

  </svg><figcaption>밝은 자연광에서 피부를 살짝 눌러 보면 노란기가 보입니다. 생후 24시간 안의 황달, 눈 흰자가 노래짐, 잘 안 깨고 안 먹음은 바로 진료. <a href="https://www.healthychildren.org/English/ages-stages/baby/Pages/Jaundice.aspx">AAP</a></figcaption></figure>
  <h3>8. 탯줄·생식기: 첫 2주 관리</h3>
  <ul>
    <li><strong>탯줄(dry cord care)</strong>: 알코올 소독 불필요. 깨끗하고 <strong>마르게</strong> 유지하고, 기저귀 앞부분을 접어 탯줄 아래로 내립니다. 떨어질 때까지 통목욕 대신 스펀지 목욕(Day 6). 보통 1~2주에 떨어지고, 피 몇 방울은 정상. <strong>3주</strong>가 지나도 안 떨어지면 진료. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Umbilical-Cord-Care.aspx">AAP</a></li>
    <li><strong>배꼽염 신호 → 당일 진료</strong>: 밑동 주변 피부가 붉어짐, 고름·악취 나는 분비물, 만지면 아파서 욺. 피가 계속 나면 즉시. 한국식 과산화수소·알코올 소독은 AAP 기준으로는 권하지 않습니다(인천성모병원 영상은 참고용).</li>
    <li><strong>남아, 포경수술 후</strong>: 기저귀 갈 때마다 바셀린을 바르고 거즈 교체, 플라스틱 링은 5~10일에 저절로 떨어지고 7~10일에 치유. 첫 주 노란 막은 정상. 6~8시간 소변이 없거나 출혈이 계속되면 진료. <strong>비포경</strong>: 절대 포피를 뒤로 젖히지 말고 겉만 물로 닦습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/prenatal/decisions-to-make/Pages/Circumcision.aspx">AAP</a></li>
    <li><strong>여아</strong>: 항상 <strong>앞에서 뒤로</strong>. 음순 안쪽 흰 분비물은 억지로 닦지 않습니다.</li>
  </ul>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>비타민K·안연고·B형간염 접종을 "한국에선 안 한다더라"로 거절하기 (한국도 다 합니다)</li>
      <li>황달 아기를 창가 햇빛에 두고 기다리기</li>
      <li>비립종·여드름 짜기, 탯줄을 알코올·과산화수소로 매번 소독하기</li>
      <li>비포경 남아의 포피를 뒤로 젖혀 씻기</li>
      <li>졸린 상태로 아기를 가슴에 올리고 눕기</li>
      <li>퇴원 후 첫 소아과 방문을 "괜찮아 보여서" 미루기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="1"><p class="qq">Q1. 비타민K 주사를 맞지 않은 아기에게 늘어나는 위험은?</p><div class="opts"><button type="button" class="opt">황달</button><button type="button" class="opt">후기 비타민K 결핍 출혈(뇌출혈 포함)이 약 81배</button><button type="button" class="opt">알레르기</button><button type="button" class="opt">없다, 선택 사항이다</button></div><p class="exp" hidden>정답 2. CDC 자료 기준 81배. 한국 병원에서도 모든 신생아에게 주사합니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q2. 출생체중 3.4 kg 아기가 생후 3일에 3.15 kg입니다. 해석은?</p><div class="opts"><button type="button" class="opt">위험하니 분유를 바로 추가한다</button><button type="button" class="opt">탈수이니 응급실</button><button type="button" class="opt">약 7% 감소로 정상 범위. 수유·기저귀를 확인하며 2주쯤 회복을 기대</button><button type="button" class="opt">체중계가 고장 났다</button></div><p class="exp" hidden>정답 3. 7~10%(AAP는 8~10%)까지는 정상입니다. 다만 퇴원 후 48시간 내 소아과 체중 확인은 꼭 합니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 황달이 가장 걱정스러운 경우는?</p><div class="opts"><button type="button" class="opt">생후 24시간 안에 노래졌다</button><button type="button" class="opt">생후 3일에 얼굴이 약간 노랗다</button><button type="button" class="opt">모유 아기가 3주째 약간 노랗지만 잘 먹고 잘 큰다</button><button type="button" class="opt">몽고반점이 있다</button></div><p class="exp" hidden>정답 1. 24시간 내 황달은 병적 황달의 대표 신호로 즉시 검사가 필요합니다. 3일째 얼굴 황달은 흔한 생리적 황달, 모유 황달은 한 달까지 갈 수 있습니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 탯줄 관리에 대한 AAP 권고는?</p><div class="opts"><button type="button" class="opt">기저귀 갈 때마다 알코올 소독</button><button type="button" class="opt">과산화수소로 하루 2회</button><button type="button" class="opt">연고를 발라 촉촉하게</button><button type="button" class="opt">깨끗하고 마르게, 기저귀를 접어 아래로, 떨어질 때까지 스펀지 목욕</button></div><p class="exp" hidden>정답 4. 건조 관리(dry cord care). 붉어짐·고름·악취가 있으면 당일 진료입니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 생후 1주 아기가 잘 때 5~10초 숨을 멈췄다가 빠르게 쉽니다. 피부색은 정상입니다.</p><div class="opts"><button type="button" class="opt">무호흡이니 911</button><button type="button" class="opt">주기성 호흡으로 정상. 10초 이상 멈추거나 파래지면 911</button><button type="button" class="opt">감기 초기</button><button type="button" class="opt">엎드려 재워야 한다</button></div><p class="exp" hidden>정답 2. 주기성 호흡은 생후 2~4주에 가장 흔하고 6개월쯤 사라집니다. 기준은 멈춤 10초 이상(특히 20초), 청색, 깨울 수 없음입니다.</p></div>
  </div>

<section class="day" data-day="7" id="d7" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-paci"/></svg><div><div class="eyebrow">Day 7 · 마음 준비</div><h2>울음 달래기</h2><p class="lead">생후 6~8주의 아기는 하루 평균 3시간을 웁니다. 이유가 없어도, 달래도 안 됩니다. 이것이 정상이라는 것을 아는 것 자체가 가장 중요한 준비이고, 그다음이 달래는 기술, 마지막이 "감당이 안 될 때 아기를 내려놓는 법"입니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>울음은 생후 2주부터 늘어 <strong>6~8주에 하루 약 3시간으로 정점</strong>, 3~4개월에 1~2시간으로 줍니다. 저녁 6시~자정에 몰립니다.</li>
      <li><strong>PURPLE 울음기</strong>: 이유 없이, 달래도 안 되고, 아픈 듯한 표정으로, 길게, 저녁에. 아기 잘못도 부모 잘못도 아닙니다.</li>
      <li>달래기 전에 확인: 배고픔 → 기저귀 → 덥거나 추움 → 트림 → 머리카락이 손가락을 감았는지. 그다음 <strong>5S</strong>.</li>
      <li><strong>절대 흔들지 않습니다.</strong> 몇 초의 흔들림으로 뇌출혈·실명·사망. 감당이 안 되면 아기를 안전한 침대에 눕히고 방을 나와 10~15분.</li>
      <li>달래지지 않으면 <strong>체온</strong>을 잽니다. 3개월 미만 직장 체온 38.0°C 이상이면 즉시 전화(Day 8).</li>
    </ol>
  </div>

  <h3>1. 얼마나 우는 게 정상인가</h3>
  <div class="tbl"><table>
    <tr><th>시기</th><th>하루 울음·보챔</th></tr>
    <tr><td>신생아</td><td>1~4시간</td></tr>
    <tr><td>생후 2주부터 증가 → <strong>6~8주 정점</strong></td><td>약 3시간/일, 저녁 6시~자정에 집중</td></tr>
    <tr><td>3~4개월</td><td>1~2시간으로 감소</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Responding-to-Your-Babys-Cries.aspx">AAP 울음에 반응하기</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Colic.aspx">AAP 영아산통</a></p>
  <p><strong>PURPLE 울음기(Period of PURPLE Crying)</strong>는 생후 2주에 시작해 2개월에 정점, 3~5개월에 줄어드는 정상 발달 단계입니다. <strong>P</strong>eak(정점), <strong>U</strong>nexpected(이유 없이), <strong>R</strong>esists soothing(달래도 안 됨), <strong>P</strong>ain-like face(아픈 듯한 표정), <strong>L</strong>ong lasting(길게), <strong>E</strong>vening(저녁). 흔들린 아이 증후군 예방 단체가 만든 개념으로, 미국 병원 퇴원 교육에 자주 포함됩니다. <a class="src" href="https://www.dontshake.org/purple-crying">National Center on Shaken Baby Syndrome</a></p>
  <p><strong>영아산통(colic) "3의 법칙"</strong>: 건강한 아기가 <strong>하루 3시간 이상, 주 3일 이상</strong>(전통적 기준은 3주 이상) 우는 것. 생후 2~5주에 시작해 3~4개월에 좋아집니다. 다리를 끌어올리고 가스를 뀝니다. 질병이 아니지만 <strong>처음에는 소아과에서 탈장·감염 등을 배제</strong>합니다. 가스약(simethicone)·그라이프워터는 효과가 입증되지 않았고, 엄마 식단 제한이나 가수분해 분유는 소아과와 상의 후에. <a class="src" href="https://kidshealth.org/en/parents/colic.html">KidsHealth</a> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Colic.aspx">AAP</a></p>

  <h3>2. 울기 전에 먹이기: 배고픔 신호</h3>
  <div class="tbl"><table>
    <tr><th>초기 (지금 먹이기)</th><th>중기</th><th>후기 (먼저 진정시킨 뒤 먹이기)</th></tr>
    <tr><td>입 오물거림, 입맛 다심, 혀 내밀기, 머리를 좌우로 돌리며 찾기(rooting), 손을 입으로</td><td>몸을 꿈틀, 보채기, 손 빨기</td><td>울음, 얼굴 붉어짐, 몸을 뻗댐. 이 상태로는 젖을 잘 물지 못합니다</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Is-Your-Baby-Hungry-or-Full-Responsive-Feeding-Explained.aspx">AAP 반응 수유</a> · 배부름 신호: 빨기 멈춤, 젖꼭지 밀어냄, 손이 펴지고 몸이 늘어짐, 잠듦.</p>

  <h3>3. 달래기 순서</h3>
  <ol class="steps">
    <li><strong>급한 것부터</strong>: 배고픔(하루 8~12회), 기저귀, 덥거나 추움, 트림, 옷이나 머리카락이 손가락·발가락을 감았는지.</li>
    <li><strong>하비 카프의 5S</strong>(The Happiest Baby on the Block). 자궁 환경을 흉내 내는 방법입니다. <a class="src" href="https://www.happiestbaby.com/blogs/baby/the-5-s-s-for-soothing-babies">Happiest Baby</a>
      <ul>
        <li><strong>Swaddle 속싸개</strong>: 팔은 몸에 붙이고 <strong>엉덩이·다리는 자유롭게</strong>(고관절). 가슴과 천 사이에 손가락 2~3개. <strong>뒤집기 조짐이 보이면(빠르면 2개월) 즉시 중단.</strong> <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Swaddling-Is-it-Safe.aspx">AAP 속싸개</a></li>
        <li><strong>Side/Stomach 옆·엎드려 안기</strong>: <strong>안고 있을 때만</strong>. 재울 때는 반드시 등 대고.</li>
        <li><strong>Shush 쉬- 소리</strong>: 아기 울음만큼 큰 저음의 "쉬-" 또는 백색소음.</li>
        <li><strong>Swing 흔들기</strong>: 머리를 받치고 <strong>2~3 cm 이내의 작은 떨림(jiggle)</strong>. 절대 세게 흔들지 않습니다. 그네·바운서에서 재우지 않습니다(머리가 앞으로 꺾여 기도가 막힘).</li>
        <li><strong>Suck 빨기</strong>: 공갈젖꼭지 또는 손. 모유수유는 자리 잡은 뒤.</li>
      </ul>
    </li>
    <li>걷기·아기띠, 백색소음(선풍기·드라이어 소리), 미지근한 목욕, 깨어 있을 때 무릎에 엎어 올려 등 쓰다듬기.</li>
    <li>다 해 봤고 아기가 건강해 보이면 <strong>등 대고 침대에 눕히고 몇 분 두기</strong>. 짧게 운 뒤 더 빨리 잠드는 아기가 많습니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Responding-to-Your-Babys-Cries.aspx">AAP</a></li>
    <li>달래지지 않으면 <strong>체온 측정</strong>. 직장 체온 38.0°C 이상이면 감염 가능성, 즉시 전화(Day 8).</li>
  </ol>
  <div class="box tip"><h4>돌 전엔 "버릇"이 없습니다</h4><p>생후 몇 달 동안 울음에 빨리 반응해 주는 것이 아기를 버릇없게 만들지 않습니다. 오히려 반응이 빠를수록 나중에 덜 운다는 것이 AAP의 설명입니다. 다만 하정훈 선생님 영상(#798)처럼 "모든 울음을 즉시 해결해야 한다"는 강박은 부모를 지치게 하니, 안전이 확인됐다면 몇 분 두는 것도 괜찮습니다.</p></div>

  <h3>4. 절대 흔들지 말 것: 흔들린 아이 증후군</h3>
  <p>목이 무거운 머리를 못 받치는 시기에는 몇 초의 흔들림으로도 뇌출혈·실명·경련·사망이 생깁니다(학대성 머리 외상, abusive head trauma). 가장 흔한 계기가 <strong>울음</strong>입니다. 감기나 장염으로 오해되기 쉬운 증상(처짐, 구토, 호흡 곤란, 경련, 안 깨어남)이 흔든 뒤 나타나면 <strong>911</strong>. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Abusive-Head-Trauma-Shaken-Baby-Syndrome.aspx">AAP</a></p>
  <div class="box dont"><h4>감당이 안 될 때 할 일 (AAP)</h4>
    <ol>
      <li>심호흡하고 10까지 셉니다.</li>
      <li>아기를 <strong>담요·인형 없는 아기침대에 등 대고 눕히고 방을 나와 10~15분</strong>. 우는 소리가 들려도 괜찮습니다.</li>
      <li>음악 듣기, 배우자·친구에게 전화, 설거지 등으로 진정합니다.</li>
      <li>아직 화가 나 있으면 아기를 안지 말고 상태만 확인합니다.</li>
      <li>진정되면 다시 시도합니다.</li>
      <li>소아과에 전화해 의학적 원인을 확인합니다. 우울하거나 버겁다고 느끼면 산부인과·소아과에 말하세요(Day 13).</li>
    </ol>
    <p>아빠와 엄마가 <strong>교대 신호</strong>를 미리 정해 두세요. "지금 넘겨"라고 말하면 묻지 않고 받는 규칙이면 됩니다. 조부모·도우미에게도 이 페이지를 보여 주세요.</p>
  </div>

  <h3>5. 공갈젖꼭지(pacifier)</h3>
  <ul>
    <li>모유수유가 자리 잡은 뒤(보통 <strong>3~4주</strong>, 한국 학회는 1개월 이후) 시작. 낮잠·밤잠 때 물리면 돌연사(SIDS) 위험이 줄어듭니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/crying-colic/Pages/Pacifiers-and-Thumb-Sucking.aspx">AAP</a> <a class="src kr" href="https://www.pediatrics.or.kr/bbs/index.html?code=infantcare&amp;category=A&amp;page=2&amp;number=8810&amp;mode=view">대한소아청소년과학회</a></li>
    <li>끈으로 목·침대에 묶지 말 것, 한 조각(one-piece) 제품, 방패 지름 1.5인치 이상, 6개월까지 자주 소독, 잠든 뒤 빠지면 다시 넣을 필요 없음, 수유를 대신하거나 미루는 용도로 쓰지 않기.</li>
    <li>꿀이나 단것을 묻히지 않습니다(영아 보툴리누스). <a class="src" href="https://www.cdc.gov/botulism/prevention/index.html">CDC</a></li>
  </ul>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>아기를 흔들기, 던져 올리기, 세게 튕기기 (몇 초로 충분히 다칩니다)</li>
      <li>옆·엎드린 자세로 재우기 (안을 때만 허용)</li>
      <li>그네·바운서·카시트에서 밤잠 재우기</li>
      <li>뒤집기 조짐 후에도 속싸개 계속하기, 다리를 쭉 펴서 꽁꽁 싸기</li>
      <li>달래지지 않는다고 체온을 재지 않고 넘기기</li>
      <li>가스약·그라이프워터·"배앓이 물"로 해결하려 하기 (근거 없음)</li>
      <li>화가 난 상태로 아기를 계속 안고 있기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 생후 7주 아기가 매일 저녁 2~3시간씩 이유 없이 웁니다. 먹고 체온도 정상입니다.</p><div class="opts"><button type="button" class="opt">젖이 부족한 것이다</button><button type="button" class="opt">배앓이 약을 사야 한다</button><button type="button" class="opt">울음의 정점 시기(PURPLE)로 정상. 달래기 순서를 시도하고 안 되면 안전하게 눕히고 쉰다</button><button type="button" class="opt">응급실에 간다</button></div><p class="exp" hidden>정답 3. 6~8주는 하루 3시간까지 우는 정점이며 저녁에 몰립니다. 다만 처음에는 소아과에서 다른 원인을 한 번 배제하는 것이 좋습니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 5S의 "Side/Stomach"는 언제 허용되나요?</p><div class="opts"><button type="button" class="opt">잘 때도 옆으로 눕혀도 된다</button><button type="button" class="opt">안고 달랠 때만. 재울 때는 반드시 등 대고</button><button type="button" class="opt">속싸개를 했으면 엎드려 재워도 된다</button><button type="button" class="opt">3개월 이후부터는 엎드려 재운다</button></div><p class="exp" hidden>정답 2. 옆·엎드린 자세는 달랠 때만. 수면은 돌까지 항상 등 대고(Day 2).</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 아기가 30분째 울고 나는 화가 나기 시작했습니다. AAP가 권하는 행동은?</p><div class="opts"><button type="button" class="opt">아기를 빈 아기침대에 등 대고 눕히고 방을 나와 10~15분 진정한다</button><button type="button" class="opt">조금 더 세게 흔들어 본다</button><button type="button" class="opt">차에 태워 드라이브한다</button><button type="button" class="opt">울음을 그칠 때까지 안고 버틴다</button></div><p class="exp" hidden>정답 1. 안전한 곳에 내려놓고 떨어지는 것이 흔들린 아이 증후군을 막는 핵심입니다. 운전은 화난 상태에서 위험합니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 속싸개를 중단해야 하는 시점은?</p><div class="opts"><button type="button" class="opt">생후 6개월</button><button type="button" class="opt">밤에 잘 자기 시작하면</button><button type="button" class="opt">이가 나면</button><button type="button" class="opt">뒤집기 조짐이 보이는 즉시(빠르면 2개월)</button></div><p class="exp" hidden>정답 4. 속싸개 상태로 뒤집으면 질식 위험이 큽니다. 팔을 뺀 슬립색으로 바꿉니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 공갈젖꼭지에 대한 AAP 권고로 맞는 것은?</p><div class="opts"><button type="button" class="opt">충치 때문에 절대 쓰지 않는다</button><button type="button" class="opt">모유수유가 자리 잡은 3~4주 뒤 잘 때 물리면 돌연사 위험이 줄어든다</button><button type="button" class="opt">꿀을 묻히면 더 잘 문다</button><button type="button" class="opt">끈으로 옷에 묶어 두면 편하다</button></div><p class="exp" hidden>정답 2. 수면 시 공갈젖꼭지는 SIDS 예방 요인입니다. 끈 묶기·꿀 묻히기는 질식·보툴리누스 위험으로 금지.</p></div>
  </div>

<section class="day" data-day="8" id="d8" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-thermo"/></svg><div><div class="eyebrow">Day 8 · 가장 중요한 날</div><h2>아플 때: 열·응급·소아과</h2><p class="lead">이 과목은 두 사람 다 외워야 합니다. 핵심은 한 문장입니다. <strong>생후 3개월 미만 아기의 직장 체온 38.0°C(100.4°F) 이상은 낮밤 상관없이 즉시 전화.</strong> 해열제를 먼저 먹이지 않습니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li>3개월 미만은 <strong>직장 체온</strong>이 표준. 귀·이마 체온계는 덜 정확합니다.</li>
      <li><strong>3개월 미만 38.0°C 이상(또는 36.4°C 미만)</strong> = 즉시 Kaiser advice nurse → 대개 응급실. 증상이 없어도 패혈증·수막염 가능성 때문입니다.</li>
      <li><strong>911</strong>: 호흡 멈춤 10초 이상, 입술·얼굴 청색, 경련, 깨울 수 없음, 축 늘어짐.</li>
      <li>해열제: 아세트아미노펜은 <strong>12주 미만엔 의사 지시 없이 금지</strong>, 이부프로펜은 <strong>6개월 이상</strong>, 아스피린은 <strong>절대 금지</strong>. 4세 미만 감기약 금지.</li>
      <li>Kaiser 24시간 advice nurse 번호를 두 사람 폰에 저장하고, 전화 전에 체온·측정법·마지막 수유·기저귀 수를 적어 둡니다.</li>
    </ol>
  </div>

  <h3>1. 체온 재는 법</h3>
  <ul>
    <li><strong>3개월 미만은 직장 체온(rectal)이 표준.</strong> 디지털 체온계만(수은 금지). 겨드랑이는 가장 부정확, 귀 체온계는 6개월 이후, 이마(temporal)는 가능하지만 직장보다 덜 정확합니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/fever/Pages/How-to-Take-a-Childs-Temperature.aspx">AAP</a></li>
    <li>방법: 끝에 바셀린 → 아기를 무릎에 엎어 놓거나 등 대고 다리를 가슴 쪽으로 → <strong>약 1.3 cm(½인치)</strong>만 부드럽게(저항이 있으면 멈춤) → 삐 소리까지 → 체온계에 "rectal"이라고 표시해 입용과 분리.</li>
    <li><strong>열 = 직장 체온 38.0°C(100.4°F) 이상.</strong> 대한소아청소년과학회도 직장 38.0°C, 겨드랑이 38.0°C 이상이면 진료를 권합니다. <a class="src kr" href="https://www.pediatrics.or.kr/bbs/index.html?code=disease_info&amp;category=&amp;gubun=&amp;page=1&amp;number=8965&amp;mode=view">대한소아청소년과학회</a></li>
    <li><strong>저체온도 위험</strong>: Kaiser는 직장 체온 <strong>36.4°C(97.5°F) 미만</strong>도 "지금 전화" 항목입니다. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.when-to-call-for-problems-in-newborns-care-instructions.aco0315">Kaiser: 신생아 언제 전화하나</a></li>
  </ul>

  <h3>2. 월령별 발열 기준</h3>
  <div class="tbl"><table>
    <tr><th>월령</th><th>기준</th><th>행동</th></tr>
    <tr><td><strong>0~3개월(12주 미만)</strong></td><td>직장 <strong>38.0°C/100.4°F 이상</strong>(또는 36.4°C 미만)</td><td><strong>즉시</strong> advice nurse 전화 → 대개 응급실·당일 진료. 연락이 안 되면 응급실. <strong>해열제를 먼저 먹이지 말고 전화</strong></td></tr>
    <tr><td>3~6개월</td><td>38.0°C 이상 + 처짐·안 먹음·보챔 등 증상, 또는 열이 24시간 이상</td><td>당일 advice nurse 전화</td></tr>
    <tr><td>6~12개월</td><td>열이 24시간 이상, 40°C/104°F 이상 반복, 증상 동반</td><td>당일 전화. 잘 놀고 잘 먹으면 관찰 가능</td></tr>
    <tr><td>모든 월령</td><td>열 + 경련, 호흡곤란, 보라색 반점, 목 뻣뻣, 숨구멍이 부풀거나 꺼짐, 깨우기 어려움</td><td><strong>911 / 응급실</strong></td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/fever/Pages/When-to-Call-the-Pediatrician.aspx">AAP 언제 전화하나</a> <a class="src" href="https://kidshealth.org/en/parents/fever.html">KidsHealth</a></p>
  <p><strong>왜 3개월 미만은 응급인가</strong>: 면역이 미숙해 증상이 거의 없어도 패혈증·수막염·요로감염 같은 심한 세균 감염 확률이 높고, 혈액·소변(때로 척수액) 검사 후 항생제가 필요할 수 있기 때문입니다. 열 자체가 뇌를 손상시키는 것은 아닙니다(AAP "Fever Without Fear"). 위험한 것은 원인입니다. 알코올 마사지·얼음찜질은 금지, 옷은 한 겹, 수분은 충분히. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/fever/Pages/Fever-Without-Fear.aspx">AAP</a></p>

  <h3>3. 응급 분류표: 어디에 연락하나</h3>
  <div class="tbl"><table>
    <tr><th>등급</th><th>상황</th><th>연락</th></tr>
    <tr><td><strong>즉시 911</strong></td><td>호흡 정지 10초 이상, 입술·얼굴이 파랗거나 회색, 숨을 못 쉬는 듯 보임, 경련, 깨울 수 없음, 축 늘어짐, 흔들린 뒤 구토·처짐, 큰 출혈, 머리를 심하게 부딪힌 뒤 이상</td><td>911. 영어가 어려우면 "Korean interpreter, please"</td></tr>
    <tr><td><strong>응급실 또는 advice nurse 즉시</strong></td><td>3개월 미만 발열 38.0°C 이상 또는 36.4°C 미만 · 호흡수 60회/분 이상 지속, 가슴 함몰(retractions), 끙끙(grunting), 콧구멍 벌렁(nasal flaring) · 녹색/노란(담즙) 또는 피 섞인 구토 · 매 수유마다 분수처럼 토함 · 피 섞인 변 · 탈수(6시간 소변 없음, 눈물 없음, 입 마름, 숨구멍 꺼짐) · 생후 24시간 내 황달 또는 급속 악화 · 배꼽 주변 붉고 고름, 탯줄 출혈 지속 · 포경수술 후 6~8시간 소변 없음</td><td>Kaiser advice nurse 24시간 → 안내대로. 불안하면 ER</td></tr>
    <tr><td><strong>당일 진료 / advice nurse</strong></td><td>3개월 이상 발열 + 증상, 열 24시간 이상(2세 미만), 황달이 배·다리로 번짐, 잘 안 먹음·하루 수유 6회 미만, 비정상적으로 오래 또는 이상하게 욺, 유난히 처짐 또는 보챔, 구토 24시간 이상, 변에 점액·피, 탯줄 악취·분비물, 눈 분비물·충혈, 피부 농포</td><td>Kaiser 소아과</td></tr>
    <tr><td><strong>다음 정기 진료 때</strong></td><td>비립종·신생아 여드름·몽고반점, 가끔 게움(체중 잘 늘 때), 딸꾹질·재채기, 가벼운 코막힘, 변 색이 녹색(노랑·갈색·녹색은 모두 정상)</td><td>2주·2개월 검진</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=breathing-problems-90-P02666">Stanford 호흡 위험 신호</a> <a class="src" href="https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/dehydration.aspx">AAP 탈수</a> <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.when-to-call-for-problems-in-newborns-care-instructions.aco0315">Kaiser "지금 전화" 목록</a></p>

  <h3>4. 증상별</h3>
  <ul>
    <li><strong>게움 vs 구토</strong>: 게움은 트림과 함께 힘없이 흘러나오고 아기가 편안함(정상). 구토는 배 근육을 써서 힘차게 뿜음. <strong>매 수유 후 분수처럼(projectile) → 유문협착 의심</strong>, 녹색·노란 담즙·피 → 즉시. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/feeding-nutrition/Pages/Why-Babies-Spit-Up.aspx">AAP</a></li>
    <li><strong>설사</strong>: 모유 아기 변은 원래 묽습니다. 갑자기 횟수·물기가 늘고 피·탈수·열이 있으면 진료. 지사제 금지, 모유·분유는 계속. <a class="src" href="https://kidshealth.org/en/parents/diarrhea.html">KidsHealth</a></li>
    <li><strong>변비</strong>: 힘주는 것 자체는 정상. 딱딱한 변, 변에 피, 10분 넘게 힘줘도 안 나옴, 평소보다 심한 보챔·게움 → 전화. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Infant-Constipation.aspx">AAP</a></li>
    <li><strong>감기·코막힘</strong>: 식염수(saline) 1~2방울 → 벌브 흡입기 또는 NoseFrida(점막이 예민하니 하루 몇 번만, 수유 전·잠자기 전). 가습기는 자주 청소. <strong>4세 미만 OTC 감기약 금지</strong>, <strong>아스피린 절대 금지</strong>(라이 증후군). 1주 지나도 안 좋아지거나 호흡이 빠르거나 열이 3일 이상 → 진료. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/flu/Pages/Caring-for-Your-Childs-Cold-or-Flu.aspx">AAP</a></li>
    <li><strong>RSV</strong>: 감기처럼 시작해 <strong>3~5일째 가장 심합니다</strong>. 빠른 호흡, 콧구멍 벌렁, 머리 끄덕임, 끙끙, 쌕쌕, 가슴 함몰, 8시간에 소변 1개 미만, 창백·청색 → 즉시 전화. 아주 어린 아기는 보챔·처짐·무호흡만 보일 수 있습니다. <strong>예방</strong>: 12월 말 출생은 RSV 시즌 한가운데이므로, 엄마가 임신 32~36주에 Abrysvo를 맞지 않았다면 아기는 출생 시·첫 진료 때 <strong>니르세비맙(Beyfortus)</strong> 등 항체주사 1회(입원 80~90% 감소). Day 9 참고. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/chest-lungs/Pages/RSV-When-Its-More-Than-Just-a-Cold.aspx">AAP RSV</a> <a class="src" href="https://www.cdc.gov/rsv/symptoms/index.html">CDC</a></li>
    <li><strong>탈수</strong>: 소변 기저귀 하루 6개 미만, 입 마름, 눈물 없음, 숨구멍 꺼짐. 심하면 하루 소변 1~2회, 매우 처짐, 손발이 차고 얼룩짐.</li>
  </ul>

  <h3>5. 해열제</h3>
  <div class="tbl"><table>
    <tr><th>약</th><th>최소 월령</th><th>용량</th><th>간격</th><th>하루 최대</th></tr>
    <tr><td>아세트아미노펜 (acetaminophen, Tylenol) 160 mg/5 mL</td><td><strong>12주 미만은 의사 지시 없이 금지</strong>(3개월 미만 발열은 먼저 진료). 예외: 8주 이상 아기의 예방접종 후 열은 의사 승인 후</td><td>10~15 mg/kg</td><td>4~6시간</td><td>5회</td></tr>
    <tr><td>이부프로펜 (ibuprofen, Motrin/Advil)</td><td><strong>6개월 이상</strong>(탈수·구토 중엔 금지)</td><td>5~10 mg/kg</td><td>6~8시간</td><td>4회</td></tr>
    <tr><td>아스피린</td><td><strong>금지</strong></td><td>–</td><td>–</td><td>–</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/medication-safety/Pages/Acetaminophen-for-Fever-and-Pain.aspx">AAP 아세트아미노펜</a> <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/medication-safety/Pages/Ibuprofen-for-Fever-and-Pain.aspx">AAP 이부프로펜</a> · 한국 학회도 10~15 mg/kg으로 같습니다.</p>
  <div class="tbl"><table>
    <tr><th>아세트아미노펜 160 mg/5 mL 체중별</th><th>mL</th><th>mg</th></tr>
    <tr><td>2.7~5.3 kg (6~11 lb)</td><td>1.25 mL</td><td>40</td></tr>
    <tr><td>5.4~7.7 kg (12~17 lb)</td><td>2.5 mL</td><td>80</td></tr>
    <tr><td>8.2~10.4 kg (18~23 lb)</td><td>3.75 mL</td><td>120</td></tr>

  <ul>
    <li><strong>계량은 반드시 주사기(oral syringe) 또는 동봉 컵, mL 단위.</strong> 식탁 숟가락 금지. 0.5 mL와 5 mL를 혼동하지 않기, 눈높이에서 읽기, 상자의 농도(infant vs children's) 확인. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/medication-safety/Pages/Using-Liquid-Medicines.aspx">AAP</a></li>
    <li>복합 감기약(아세트아미노펜 포함)과 같이 주면 과량. 2세 미만은 약을 주기 전에 소아과에 전화.</li>
    <li>한국 시판 시럽 라벨의 "생후 4개월 이상"과 미국 기준(12주)이 다릅니다. 미국 소아과 지시를 따르세요.</li>
  </ul>

  <h3>6. Kaiser 연락처와 전화 전 준비</h3>
  <div class="box tip">
    <ul>
      <li><strong>24시간 advice nurse</strong>: Kaiser Redwood City 소아과 advice/appointments <strong>650-299-2015</strong> · Northern California 공통 <strong>1-866-454-8855</strong> · Member Services 1-800-464-4000(TTY 711). 두 번호 모두 Kaiser 시설 페이지 검색 결과로 확인했으니 입원 중 퇴원 안내지로 재확인하세요. 한국어 통역은 "Korean, please".</li>
      <li><strong>응급실</strong>: Kaiser Permanente Redwood City Medical Center, 1100 Veterans Blvd, Redwood City(24시간). 소아과 외래는 Marshall Medical Offices 905 Maple St 4층.</li>
      <li><strong>전화 전에 적어 둘 것</strong>: 아기 이름·생년월일·MRN, 체온과 측정법(rectal), 언제부터, 마지막 수유 시각과 양, 지난 6시간 소변 기저귀 수, 호흡 모습, 피부색, 먹인 약.</li>
      <li><strong>온라인</strong>: kp.org·Kaiser 앱에서 아기를 proxy로 연결하면 소아과 의사 이메일(비응급, 보통 2영업일 내 답), 비디오 방문·e-visit, 검사 결과(빌리루빈 등) 조회가 됩니다.</li>
      <li><strong>Poison Control</strong> 1-800-222-1222(24시간, 약 과량·이물 삼킴).</li>

  <div class="box dont"><h3>하면 안 되는 것</h3>

      <li>3개월 미만 아기 체온을 귀·이마·겨드랑이로만 재고 안심하기</li>
      <li>아스피린, 4세 미만 감기약, 어른 약 쪼개 주기</li>

      <li>설사에 지사제, 구토에 물만 주기(모유·분유는 계속)</li>
      <li>꿀(12개월 미만), 벤조카인 젤</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 생후 5주 아기가 새벽 2시에 직장 체온 38.2°C입니다. 잘 먹고 보채지도 않습니다.</p><div class="opts"><button type="button" class="opt">타이레놀을 먹이고 아침에 소아과</button><button type="button" class="opt">옷을 벗기고 지켜본다</button><button type="button" class="opt">즉시 advice nurse에 전화하고 안내대로 응급실로</button><button type="button" class="opt">귀 체온계로 다시 재 본다</button></div><p class="exp" hidden>정답 3. 3개월 미만 발열은 증상이 없어도 심한 세균 감염일 수 있어 즉시 평가합니다. 해열제는 먹이지 않고 전화합니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 3개월 미만 아기의 표준 체온 측정법은?</p><div class="opts"><button type="button" class="opt">이마 체온계</button><button type="button" class="opt">직장(rectal) 디지털 체온계, 약 1.3 cm</button><button type="button" class="opt">귀 체온계</button><button type="button" class="opt">겨드랑이</button></div><p class="exp" hidden>정답 2. 귀는 6개월 이후, 겨드랑이는 가장 부정확합니다. 한국에서 흔한 귀·이마 체온계와 다른 점입니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q3. 체중 6 kg 아기에게 의사가 아세트아미노펜(160 mg/5 mL)을 허락했습니다. 1회 용량은?</p><div class="opts"><button type="button" class="opt">5 mL</button><button type="button" class="opt">1.25 mL</button><button type="button" class="opt">10 mL</button><button type="button" class="opt">2.5 mL</button></div><p class="exp" hidden>정답 4. 5.4~7.7 kg 구간은 2.5 mL(80 mg). 체중 kg × 10~15 mg = 60~90 mg과 일치합니다. 주사기로 계량하세요.</p></div>
    <div class="q" data-a="0"><p class="qq">Q4. 즉시 911을 불러야 하는 상황은?</p><div class="opts"><button type="button" class="opt">입술이 파랗고 숨을 10초 이상 쉬지 않는다</button><button type="button" class="opt">하루 종일 딸꾹질을 한다</button><button type="button" class="opt">변이 녹색이다</button><button type="button" class="opt">얼굴에 좁쌀 여드름이 났다</button></div><p class="exp" hidden>정답 1. 청색증·호흡 정지·경련·깨울 수 없음은 911입니다. 나머지는 모두 정상 범위입니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 생후 2개월 아기의 코막힘에 대한 올바른 대처는?</p><div class="opts"><button type="button" class="opt">유아용 감기약</button><button type="button" class="opt">식염수 몇 방울 후 벌브·NoseFrida로 흡입, 가습기</button><button type="button" class="opt">아스피린 소량</button><button type="button" class="opt">꿀물</button></div><p class="exp" hidden>정답 2. 4세 미만 감기약 금지, 아스피린 절대 금지, 꿀은 12개월 미만 금지입니다. 호흡이 빨라지거나 열이 동반되면 전화합니다.</p></div>

  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-sleep"/></svg><div><div class="eyebrow">Day 2 · 생명과 직결</div><h2>안전한 수면</h2><p class="lead">미국에서 해마다 약 3,400명의 아기가 자다가 사망하고, 그중 대부분에서 푹신한 침구·같이 자기·엎드려 재우기가 확인됩니다. 규칙은 단순합니다. "혼자, 등 대고, 맨 침대에". 오늘은 그 이유와 예외까지 익힙니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 5가지</h3>
    <ol>
      <li><strong>등 대고(back to sleep)</strong>, 낮잠까지 매번, 돌까지. 옆으로 재우기도 엎드려 재우기만큼 위험합니다.</li>
      <li><strong>단단하고 평평한</strong> CPSC 기준 아기 침대·배시넷·플레이야드에 몸에 맞는 시트 한 장만. 베개·이불·범퍼·인형·경사 침대·가중 담요 금지.</li>
      <li><strong>같은 방, 다른 침대</strong>로 최소 6개월. 부모 침대·소파에서 함께 잠드는 것이 가장 위험합니다(소파는 최대 67배).</li>
      <li>속싸개는 <strong>뒤집기 조짐(빠르면 2개월)이 보이면 즉시 중단</strong>. 이후엔 슬립색.</li>
      <li>과열 금지: 어른보다 한 겹 더, 방 20~22°C, 실내에서 모자 벗기기. 흡연·니코틴 금지, 모유수유·접종·공갈젖꼭지는 보호 요인.</li>
    </ol>
  </div>

  <h3>0. 냉장고에 붙이는 한 장 요약</h3>
  <div class="tbl"><table>
    <tr><th>하지 말 것</th><th>할 것</th></tr>
    <tr><td>엎드려·옆으로 재우기, 소파·카시트·바운서·그네에서 재우기</td><td>매번(낮잠 포함) <strong>등 대고</strong>, 단단하고 평평한 CPSC 기준 침대·배시넷·플레이야드</td></tr>
    <tr><td>부모 침대·요에서 같이 자기, 특히 4개월 미만·음주·흡연 시</td><td><strong>같은 방, 다른 침대</strong> 최소 6개월</td></tr>
    <tr><td>베개·이불·범퍼·인형·쿠션·경사 침대·가중 담요/속싸개</td><td>몸에 맞는 시트 한 장 + 슬립색(sleep sack)</td></tr>
    <tr><td>실내에서 모자, 과한 겹옷, 22°C 넘는 더운 방</td><td>어른보다 한 겹만 더, 방 20~22°C(68~72°F)</td></tr>
    <tr><td>뒤집기 조짐 후 속싸개</td><td>조짐이 보이면(이르면 2개월) 속싸개 즉시 중단</td></tr>
    <tr><td>흡연·전자담배·니코틴 노출, 음주 후 아기 돌보기</td><td>모유수유, 예방접종, 공갈젖꼭지(모유수유 자리 잡은 뒤)</td></tr>
    <tr><td>"SIDS 예방" 광고하는 모니터·매트리스·포지셔너 믿기</td><td>매일 깨어 있을 때 터미타임</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/A-Parents-Guide-to-Safe-Sleep.aspx">AAP 부모를 위한 안전 수면 가이드</a> <a class="src" href="https://safetosleep.nichd.nih.gov/reduce-risk/reduce">NIH Safe to Sleep</a></p>

  <h3>1. AAP 2022 지침, 항목별로</h3>
  <ul>
    <li><strong>등 대고</strong>: 돌까지 모든 수면. 역류(GERD) 아기도 등 대고 평평하게. 평소 등으로 자던 아기를 엎드리거나 옆으로 눕히면 위험이 최대 45배. 스스로 양방향 뒤집기가 되면 자다 돌아눕는 건 두되, 처음 눕힐 땐 여전히 등으로. <a class="src" href="https://safetosleep.nichd.nih.gov/reduce-risk/reduce">NICHD</a></li>
    <li><strong>단단하고 평평하게</strong>: 경사 10도 초과는 위험. 2022-11-12 발효된 Safe Sleep for Babies Act로 경사 침대(Rock 'n Play류)와 패딩 범퍼는 제조일과 무관하게 판매 금지. 수유 쿠션(Boppy), DockATot류 라운저, 해먹, 인베드 슬리퍼는 수면 금지. <a class="src" href="https://www.cpsc.gov/Business--Manufacturing/Business-Education/Business-Guidance/Safe-Sleep-for-Babies-Act-Business-Guidance">CPSC</a></li>
    <li><strong>침대 기준(CPSC)</strong>: 살 간격 6 cm(2⅜인치, 음료 캔 너비) 이하, 드롭사이드 금지, 매트리스 틈 없음, 나사 모두 조여짐. 중고 크립은 과거 연 50명 사망과 연관되었으니 cpsc.gov 리콜 확인 필수. 배시넷은 손과 무릎으로 일어서기 시작하면(보통 4~5개월) 크립으로. <a class="src" href="https://www.cpsc.gov/safety-education/safety-guides/cribs/crib-safety-tips">CPSC 크립 안전</a> <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/healtharticle.sleep-safety-your-baby">Kaiser</a></li>
    <li><strong>같은 방, 다른 침대</strong>: 부모 침대 가까이 별도 수면 공간에서 최소 6개월. 위험 최대 50% 감소. 침대 공유는 어떤 경우에도 권장하지 않고(쌍둥이끼리도), 수유·달래기로 데려왔다면 잠들기 전에 돌려놓습니다. 특히 위험한 경우: 4개월 미만·조산, 부모의 음주·수면제·대마, 흡연, 푹신한 침구. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/A-Parents-Guide-to-Safe-Sleep.aspx">AAP</a></li>
    <li><strong>부드러운 물건 금지</strong>: 베개, 이불·퀼트, 매트리스 토퍼, 담요, 인형, 범퍼, 포지셔너·웨지, 러비. 머리 모양 베개는 위험하고 효과도 없습니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/Cleft-Craniofacial/Pages/Positional-Skull-Deformities-and-Torticollis.aspx">AAP</a></li>
    <li><strong>속싸개</strong>: 선택 사항이며 SIDS를 줄이지 않습니다. 할 때는 등으로, 가슴과 싸개 사이 손가락 2~3개 여유, 엉덩이·다리는 굽히고 벌릴 수 있게. 뒤집기 조짐이 보이면 즉시 중단(이르면 2개월, 보통 3~4개월). 팔이 자유로운 슬립색은 계속 가능. <strong>가중(weighted) 담요·속싸개는 금지</strong>. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Swaddling-Is-it-Safe.aspx">AAP 속싸개</a></li>
    <li><strong>공갈젖꼭지</strong>: 낮잠·밤잠에 물려주면 위험 감소(잠든 뒤 빠져도 효과). 모유수유는 자리 잡은 뒤, 거부하면 강요하지 않고, 끈·클립으로 걸지 않습니다.</li>
    <li><strong>과열 방지</strong>: 어른보다 한 겹 더. 땀, 뜨거운 가슴, 홍조가 과열 신호. 퇴원 후 실내에서 모자 금지. AAP 권장 실내 20~22°C(68~72°F). 한국 질병관리청은 22~24°C, 영국은 16~20°C를 제시하니 숫자보다 "가슴·목 뒤가 뜨겁거나 땀나면 한 겹 벗기기"가 공통 원칙입니다. <a class="src" href="https://www.healthychildren.org/English/healthy-living/sleep/Pages/healthy-sleep-habits-how-many-hours-does-your-child-need.aspx">AAP</a></li>
    <li><strong>흡연·약물</strong>: 임신 중·출산 후 흡연, 전자담배, 니코틴 노출 금지. 한국 학회 자료에서도 부모 흡연은 위험 2배 이상. 모든 양육자가 음주·약물 없는 상태여야 합니다. <a class="src kr" href="https://www.pediatrics.or.kr/bbs/index.html?code=infantcare&amp;category=A&amp;gubun=E&amp;page=1&amp;number=8810&amp;mode=view">대한소아청소년과학회</a></li>
    <li><strong>보호 요인</strong>: 모유수유(약 6개월 단독), 정기 검진·예방접종.</li>
    <li><strong>앉는 기구에서 재우지 않기</strong>: 카시트·유모차·그네·캐리어는 턱이 가슴 쪽으로 처지면(chin-to-chest) 기도가 막힙니다. 카시트는 주행 중에만. 거기서 잠들면 가능한 한 빨리 평평한 곳으로. <a class="src" href="https://www.stanfordchildrens.org/en/topic/default?id=infant-sleep-90-P02237">Stanford</a></li>
    <li><strong>모니터</strong>: 가정용 심폐 모니터·스마트 양말은 SIDS 예방 근거가 없습니다. 써도 되지만 수칙을 대체할 수 없습니다.</li>
  </ul>
  <div class="tbl"><table>
    <tr><th>방 온도</th><th>옷차림 예시(참고)</th></tr>
    <tr><td>20~22°C (권장)</td><td>긴팔 내복(또는 반팔 바디수트) + 1.0 TOG 전후 슬립색</td></tr>
    <tr><td>18~20°C</td><td>긴팔 내복 + 2.5 TOG 슬립색</td></tr>
    <tr><td>22~24°C</td><td>반팔 바디수트 + 0.5~1.0 TOG 슬립색</td></tr>
    <tr><td>24°C 이상</td><td>기저귀 + 반팔 바디수트, 또는 0.5 TOG 이하</td></tr>
  </table></div>
  <p class="small muted">TOG(보온 등급)는 제조사마다 달라 참고용입니다. 항상 아기 가슴을 만져 확인하세요. <a class="src" href="https://www.lullabytrust.org.uk/safer-sleep-advice/baby-room-temperature/">Lullaby Trust</a></p>

  <h3>2. 숫자로 보는 이유</h3>
  <ul>
    <li>미국 2024년 영아 돌연사(SUID) 약 <strong>3,400명</strong>: SIDS 1,351 / 원인 미상 1,099 / 침대 내 질식·교액 947. 2020~2024 출생 10만 명당 106.6명이고 캘리포니아는 가장 낮은 5개 주에 듭니다. <a class="src" href="https://www.cdc.gov/sudden-infant-death/data-research/data/index.html">CDC</a></li>
    <li>CDC 등록부 분석(2020~2024, 4,861건): 최소 73%에서 안전하지 않은 수면 요인 확인. <strong>푹신한 침구 78%, 같이 자기 59%, 등이 아닌 자세 46%</strong>. 사망의 약 90%가 생후 6개월 미만. <a class="src" href="https://www.cdc.gov/mmwr/volumes/75/wr/mm7535a1.htm">CDC MMWR</a></li>
    <li>한국 2024년 영아돌연사증후군 47명(영아 10만 명당 20.4명, 영아 사망 원인 3위). 대한소아청소년과학회와 서울아산병원 지침도 AAP와 같습니다: 등으로, 단단한 별도 표면, 푹신한 침구 금지, 같은 방 다른 침대 최소 6개월(가능하면 1년). <a class="src kr" href="https://www.pediatrics.or.kr/bbs/index.html?code=infantcare&amp;category=A&amp;gubun=E&amp;page=1&amp;number=8810&amp;mode=view">대한소아청소년과학회</a> <a class="src kr" href="https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=32841">서울아산병원</a></li>
  </ul>
  <div class="box note"><h4>바닥 요에서 같이 자는 한국 문화는?</h4><p>서울아산병원 자료도 "<strong>별도의</strong> 아기 침대나 요"라고 적습니다. 핵심은 부모와 같은 이불·요를 쓰지 않는 것입니다. 다만 미국 AAP/CPSC는 연방 기준을 충족한 크립·배시넷·플레이야드만 권장하므로, 미국 소아과에서 요 사용을 물으면 비권장 답을 들을 가능성이 큽니다. 현실적 절충은 부모 침대(또는 요) 옆에 <strong>플레이야드(Pack 'n Play)나 베드사이드 배시넷</strong>을 두는 것입니다. 바닥 생활이면 플레이야드를 바닥에 놓고, 부모 이불·베개가 아기 쪽으로 넘어오지 않게 거리를 둡니다. 밤중 수유는 소파에서 하지 않고(소파가 더 위험), 수유 전 주변 베개·이불을 치웁니다.</p></div>

  <h3>3. 터미타임과 납작머리 예방</h3>
  <ul>
    <li><strong>깨어 있고 보호자가 보고 있을 때만.</strong> 퇴원 당일부터 시작(탯줄 떨어지기 전에도 가능). 초기 하루 2~3회 × 3~5분 → 생후 7주까지 하루 15~30분. 기저귀 교체 후·낮잠 후가 좋은 타이밍. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/Back-to-Sleep-Tummy-to-Play.aspx">AAP</a></li>
    <li>두상 변형 예방: 짧게 자주 하여 하루 총 1시간 정도까지, 카시트·바운서·그네 시간 제한, 안고 먹일 때 팔 번갈아, 침대에서 머리 두는 방향을 매일 반대로(아기는 빛·사람 쪽으로 고개를 돌립니다).</li>
    <li>사경(torticollis): 한쪽만 보는 상태로 약 85%에 두상 변형이 동반됩니다. 소아 물리치료로 스트레칭. 중등도 이상 납작머리가 5~6개월까지 개선되지 않으면 헬멧 치료를 고려합니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/Cleft-Craniofacial/Pages/Positional-Skull-Deformities-and-Torticollis.aspx">AAP</a></li>
  </ul>

  <h3>4. 월령별 수면 패턴</h3>
  <div class="tbl"><table>
    <tr><th>월령</th><th>24시간 총 수면(낮잠 포함)</th><th>밤잠 특징</th></tr>
    <tr><td>신생아 0~3개월</td><td>14~17시간, 한 번에 1~2시간씩</td><td>밤낮 구분 없음, 2~4시간마다 수유로 깸</td></tr>
    <tr><td>4~7개월</td><td>12~16시간</td><td>6개월쯤 밤에 9시간 이상(짧게 깸 포함), 낮잠 2회 이상 합계 3~4시간</td></tr>
    <tr><td>8~12개월</td><td>12~16시간</td><td>밤 9~12시간, 낮잠 2회(30분~2시간)</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://kidshealth.org/en/parents/sleepnewborn.html">KidsHealth 신생아</a> <a class="src" href="https://kidshealth.org/en/parents/sleep47m.html">4~7개월</a> <a class="src" href="https://kidshealth.org/en/parents/sleep812m.html">8~12개월</a> · 4~12개월 12~16시간은 미국수면의학회(AASM) 합의안을 AAP가 승인한 수치. 규칙적 수면 주기는 생후 4~6개월에야 생기고, 대부분 3개월쯤 6~8시간 연속 수면이 됩니다.</p>
  <div class="tbl"><table>
    <tr><th>월령</th><th>깨어 있는 시간(wake window)</th><th>낮잠 횟수</th></tr>
    <tr><td>0~1개월</td><td>30분~1시간</td><td>4~5회</td></tr>
    <tr><td>1~3개월</td><td>1~2시간</td><td>4~5회 → 3~4회</td></tr>
    <tr><td>3~4개월</td><td>1.25~2.5시간</td><td>3~4회</td></tr>
    <tr><td>5~7개월</td><td>2~3시간</td><td>2~3회</td></tr>
    <tr><td>7~10개월</td><td>2.5~3.5시간</td><td>2회</td></tr>
    <tr><td>10~12개월</td><td>3~4시간</td><td>2회</td></tr>
  </table></div>
  <p class="small muted">출처: <a class="src" href="https://health.clevelandclinic.org/wake-windows-by-age">Cleveland Clinic</a> <a class="src" href="https://huckleberrycare.com/blog/first-year-of-sleep-expectations">Huckleberry</a> · 의학 표준이 아닌 가이드라인입니다. 6개월 미만은 졸림 신호(눈 비비기, 하품, 시선 돌리기, 보채기)와 함께 판단하세요.</p>
  <ul>
    <li><strong>밤낮 구분 돕기</strong>: 낮엔 밝게, 말 걸고 놀고(낮잠 중 생활 소음 OK). 밤엔 어둡고 조용히, 수유·기저귀 때 불 낮추고 말 최소화. 몇 주 걸립니다. 일부러 낮에 안 재워서 밤에 잘 자게 하려는 건 역효과(과피로). 한국 학회는 생후 3~6주부터 밤낮 학습 시작 가능이라고 안내합니다. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/getting-your-baby-to-sleep.aspx">AAP</a> <a class="src kr" href="https://www.pediatrics.or.kr/bbs/index.html?code=infantcare&amp;category=A&amp;gubun=E&amp;page=1&amp;number=8809&amp;mode=view">대한소아청소년과학회</a></li>
    <li><strong>밤중 수유</strong>: 신생아는 체중이 잘 늘 때까지(보통 첫 2주) 길게 자면 3~4시간마다 깨워서 수유. 4~7개월엔 대부분 한밤중 수유가 더는 필요 없지만(모유 아기는 더 깰 수 있음) 중단 시기는 체중·성장을 보고 소아과와 상의. 8~12개월에 밤에 깨는 것은 분리불안으로 흔하며, 안아 올리거나 먹이거나 말을 많이 걸면 더 자주 깨므로 짧게 토닥이고 나옵니다.</li>
    <li><strong>4개월 수면 퇴행</strong>: 수면이 어른처럼 깊은 잠/얕은 잠 주기로 바뀌면서 자주 깨는 시기. 보통 1~2주면 지납니다. 배고픔·기저귀·질병을 먼저 확인하고, 낮에 충분히 먹이고, 졸리지만 깨어 있을 때 눕힙니다. <a class="src" href="https://health.clevelandclinic.org/the-4-month-sleep-regression-what-parents-need-to-know">Cleveland Clinic</a></li>
  </ul>

  <h3>5. 수면교육(sleep training): 언제, 어떻게</h3>
  <ul>
    <li><strong>시작 시기</strong>: AAP는 생후 4개월부터 바로 달려가지 않고 스스로 진정할 시간을 주기 시작하라고 합니다("졸리지만 깨어 있을 때" 눕히기). 퍼버법 같은 본격 수면교육은 약 <strong>6개월</strong>(절반 정도의 아기가 혼자 다시 잠들 수 있는 시기). 6개월 미만에 울려 재우기 계열을 적용한 연구는 없으므로 <strong>6개월 전엔 루틴·밤낮 구분·drowsy-but-awake까지만</strong>. <a class="src" href="https://www.healthychildren.org/English/ages-stages/baby/sleep/Pages/getting-your-baby-to-sleep.aspx">AAP</a> <a class="src" href="https://www.sleepfoundation.org/baby-sleep/ferber-method">Sleep Foundation</a></li>
    <li><strong>근거</strong>: Pediatrics 2016 무작위 시험(6~16개월 43명)에서 점진적 소거·취침시간 늦추기 모두 잠드는 시간을 줄였고, 코르티솔 스트레스 반응·12개월 후 애착·정서·행동 문제에서 대조군과 차이가 없었습니다. 2012년 5년 추적에서도 6세 시점 정서·행동·애착에 해로운 영향이 없었습니다. 부적합: 심한 코골이(수면무호흡 의심), 질병, 발달 문제, 불안정한 가정 상황.</li>
  </ul>
  <div class="tbl"><table>
    <tr><th>방법</th><th>내용</th><th>비고</th></tr>
    <tr><td>점진적 소거(Ferber, check-and-console)</td><td>눕히고 나온 뒤 정해진 간격으로 들어가 짧게 안심(안아 올리거나 먹이지 않음). 간격을 밤마다 늘림</td><td>1일차 3→5→10분, 2일차 5→10→12분, 3일차 10→12→15분… 7일 후에도 변화 없으면 재검토</td></tr>
    <tr><td>완전 소거(extinction, cry it out)</td><td>눕히고 아침까지 들어가지 않음(질병·위험 의심 시 제외)</td><td>빠를 수 있으나 부모가 힘듦</td></tr>
    <tr><td>의자 방법(chair method)</td><td>침대 옆에 앉아 있다가 밤마다 의자를 문 쪽으로 옮겨 결국 방 밖으로</td><td>느리지만 부드러움</td></tr>
    <tr><td>안았다 내려놓기(pick-up-put-down)</td><td>울면 안아서 진정시키고 졸릴 때 다시 눕히기 반복</td><td>어린 월령에 많이 씀</td></tr>
    <tr><td>취침시간 늦추기(bedtime fading)</td><td>실제 잠드는 시각에 맞춰 취침시간을 늦췄다가 서서히 당김</td><td>울리지 않는 계열</td></tr>
  </table></div>
  <p><strong>취침 루틴</strong>: 매일 같은 순서(따뜻한 목욕 → 책 → 노래 → 눕히기), 조명 낮추고 화면 없이. 6~8개월 분리불안으로 깨는 건 정상, 일관되게 짧게 반응합니다. 밤에 깨는 것은 돌 전 내내 정상이며 야경증은 영아기엔 드뭅니다. 한국어 자료는 베싸TV의 수면 영상이 연구 기반으로 잘 정리되어 있습니다(아래).</p>

  <div class="box dont"><h3>하면 안 되는 것</h3>
    <ul>
      <li>엎드려·옆으로 재우기, "토할까 봐" 머리를 높이는 경사·쿠션</li>
      <li>부모 침대·요·소파에서 같이 잠들기, 수유하다 소파에서 졸기</li>
      <li>이불·베개·범퍼·인형·머리 모양 베개를 침대 안에 두기</li>
      <li>카시트·바운서·그네·유모차에서 밤잠 재우기</li>
      <li>가중 담요·가중 속싸개, 뒤집기 조짐 후 속싸개</li>
      <li>실내에서 모자 씌우기, 어른 기준으로 두껍게 입히기</li>
      <li>중고 드롭사이드 크립, 리콜 확인 안 한 중고 침대</li>
      <li>6개월 전 울려 재우기(cry it out)</li>
      <li>"SIDS 예방" 매트리스·모니터를 믿고 수칙을 느슨하게 하기</li>
    </ul>
  </div>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="1"><p class="qq">Q1. 생후 3개월 아기가 자다가 혼자 엎드려 뒤집었습니다. 아직 등으로는 못 돌아옵니다.</p><div class="opts"><button type="button" class="opt">스스로 뒤집었으니 그대로 둔다</button><button type="button" class="opt">등으로 돌려 눕히고, 속싸개는 이미 중단했는지 확인한다</button><button type="button" class="opt">옆으로 눕힌다</button><button type="button" class="opt">쿠션으로 고정한다</button></div><p class="exp" hidden>정답 2. 양방향 뒤집기가 되기 전엔 등으로 돌려놓습니다. 뒤집기가 시작됐으니 속싸개는 즉시 중단하고 팔이 자유로운 슬립색으로 바꿉니다. 포지셔너·쿠션은 금지입니다.</p></div>
    <div class="q" data-a="3"><p class="qq">Q2. AAP 2022 기준 "같은 방, 다른 침대"의 최소 기간은?</p><div class="opts"><button type="button" class="opt">1개월</button><button type="button" class="opt">3개월</button><button type="button" class="opt">1년</button><button type="button" class="opt">6개월(한국 학회는 가능하면 1년)</button></div><p class="exp" hidden>정답 4. 최소 6개월, SIDS 위험 최대 50% 감소. 대한소아청소년과학회는 6개월 이상, 가능하면 1년을 권합니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 아기 침대 안에 있어도 되는 것은?</p><div class="opts"><button type="button" class="opt">몸에 맞는 시트 한 장</button><button type="button" class="opt">얇은 담요 한 장</button><button type="button" class="opt">메쉬가 아닌 패딩 범퍼</button><button type="button" class="opt">작은 인형 하나</button></div><p class="exp" hidden>정답 1. "Bare is best". 담요 대신 슬립색, 패딩 범퍼는 2022년부터 판매 자체가 금지됐습니다.</p></div>
    <div class="q" data-a="2"><p class="qq">Q4. 차에서 카시트에 탄 채 잠든 아기를 집에 데려왔습니다.</p><div class="opts"><button type="button" class="opt">깨지 않게 카시트째 거실에 둔다</button><button type="button" class="opt">카시트째 아기 침대에 넣는다</button><button type="button" class="opt">깨더라도 평평한 아기 침대로 옮긴다</button><button type="button" class="opt">바운서로 옮긴다</button></div><p class="exp" hidden>정답 3. 앉는 기구에서는 턱이 가슴으로 처져 기도가 막힐 수 있습니다. 카시트는 주행 중에만 쓰고, 도착하면 평평한 곳으로 옮깁니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 수면교육(퍼버법 등)을 시작해도 되는 가장 이른 시기로 근거가 있는 것은?</p><div class="opts"><button type="button" class="opt">생후 6주</button><button type="button" class="opt">약 6개월(4개월부터는 스스로 진정할 시간 주기 정도)</button><button type="button" class="opt">돌 이후</button><button type="button" class="opt">신생아 때부터</button></div><p class="exp" hidden>정답 2. 6개월 미만에 울려 재우기 계열을 적용한 연구는 없습니다. 그 전엔 루틴·밤낮 구분·drowsy-but-awake까지만.</p></div>
  </div>

<section class="day" data-day="12" id="d12" hidden>
  <header class="day-h"><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg><div><div class="eyebrow">Day 12 · 집과 바깥</div><h2>생활 안전·외출·방문객</h2><p class="lead">돌 전 아기의 사고는 거의 전부 어른이 "잠깐"이라고 생각한 순간에 일어납니다. 화상·낙상·질식·익사의 숫자 기준, 집안 아기방어 타임라인, 겨울 외출과 손님 규칙, 그리고 영아 CPR의 핵심을 익힙니다.</p></div></header>

  <div class="box key"><h3>오늘의 핵심 6가지</h3>
    <ol>
      <li><strong>온수기 49°C(120°F) 이하</strong>, 젖병 전자레인지 금지, 아기 안고 뜨거운 음료 금지.</li>
      <li>교환대·침대·소파 위에 <strong>한순간도</strong> 혼자 두지 않기. 보행기(baby walker)는 사지 않기.</li>
      <li>욕조에서는 <strong>한 손을 아기에게</strong>. 전화가 와도 아기를 데리고 나갑니다. 목욕 의자는 안전장치가 아닙니다.</li>
      <li>버튼 배터리 삼킴 = 즉시 응급실. 블라인드 줄은 코드리스로. Poison Control <strong>1-800-222-1222</strong>.</li>
      <li>손님: 손 씻기, 아픈 사람 금지, <strong>얼굴·손에 뽀뽀 금지</strong>, 가까운 가족은 아기 만나기 2주 전 Tdap·독감 접종.</li>
      <li>겨울 외출은 산책부터 OK. 어른보다 한 겹 더, 카시트에선 패딩 벗기기. 6개월 미만은 자외선차단제 대신 그늘·옷.</li>
    </ol>
  </div>

  <h3>1. 카시트 핵심</h3>
  <p>캘리포니아 법: 만 2세 미만 후방장착(rear-facing) 필수, 8세 미만 뒷좌석. 가슴 클립은 겨드랑이 높이, 어깨끈은 꼬집기 테스트(pinch test)로 여유가 없게, 카시트 안에서는 <strong>두꺼운 외투·패딩 금지</strong>(얇은 겹옷 후 담요를 위에). 아기를 차 안에 절대 혼자 두지 않습니다. 설치 점검: CHP Redwood City 650-779-2700, Stanford 카시트 피팅 650-736-2981. 제품 비교·설치 영상은 출산 준비 노트 카시트 섹션에 있습니다. <a class="src" href="https://www.chp.ca.gov/programs-services/programs/child-safety-seats/">CHP</a> <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-play/Pages/Cold-Weather-Safety.aspx">AAP 겨울 안전</a></p>

  <h3>2. 화상</h3>
  <ul>
    <li>온수기 최고 온도 <strong>120°F(49°C) 이하</strong>로 설정. 목욕물은 손목 안쪽·팔꿈치로 "따뜻하되 뜨겁지 않게"(흔히 37~38°C로 안내), 5 cm 정도만 받고, 흐르는 수돗물 아래서 목욕 금지(온도 급변). <a class="src" href="https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/Treating-and-Preventing-Burns.aspx">AAP 화상</a></li>
    <li>아기를 안고 커피·차·국을 들지 않기(5세 미만 화상의 27~60%가 뜨거운 액체). 젖병 전자레인지 가열 금지. <a class="src" href="https://healthy.kaiserpermanente.org/health-wellness/health-encyclopedia/he.quick-tips-babyproofing-your-home.te7335">Kaiser 아기방어</a></li>
    <li>응급처치: 찬물(얼음 X)로 식히고 마른 거즈로 덮기. 버터·연고·가루 금지. 얼굴·손·발·생식기·관절 화상, 전기 화상은 병원.</li>
  </ul>

  <h3>3. 낙상</h3>
  <ul>
    <li>기저귀 교환대·침대·소파·의자 위에 한순간도 혼자 두지 않기(안전띠를 채워도). 손 닿는 곳에 물품을 준비한 뒤 눕힙니다. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Make-Babys-Room-Safe.aspx">AAP</a></li>
    <li><strong>보행기(baby walker) 금지</strong>: AAP는 판매 금지를 요구합니다. 1초에 약 1 m 이동, 계단 추락이 최다. 대안은 고정형 액티비티 센터. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Baby-Walkers-A-Dangerous-Choice.aspx">AAP</a></li>
    <li>계단 위·아래 모두 안전문(벽 스터드에 고정), 창문 가드(방충망은 추락을 막지 못함), 침대는 창문에서 멀리. 모빌은 손과 무릎으로 일어서거나 5개월 중 빠른 시점에 제거.</li>
  </ul>

  <h3>4. 질식·흡인·교액</h3>
  <ul>
    <li>작고 둥근 물건(동전·단추·구슬·풍선 조각·장난감 부품)이 최다. 바닥·소파 틈을 자주 확인. <a class="src" href="https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/Choking-Prevention.aspx">AAP</a></li>
    <li><strong>버튼·코인 배터리</strong>: 삼키면 2시간 내 식도 화상 → 즉시 응급실. 리모컨·차 키·소리 나는 카드의 배터리 덮개를 테이프로 고정. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Button-Battery-Injuries-in-Children-A-Growing-Risk.aspx">AAP</a></li>
    <li>소형 강력 자석, 액상 니코틴, 세제 포드는 잠금. <strong>블라인드 줄</strong>은 미국에서 연 약 9명(5세 미만) 교액 사망, 1분 안에 사망 가능 → 코드리스가 유일한 완전 해결. <a class="src" href="https://cpsc.gov/Safety-Education/Safety-Education-Centers/Window-Covering">CPSC</a></li>
    <li>비닐봉지 묶어서 치우기, 공갈젖꼭지 끈·목걸이 금지. 이유식 후 질식 식품은 Day 11.</li>
  </ul>

  <h3>5. 익사</h3>
  <ul>
    <li>아기는 물 <strong>2.5~5 cm(1~2인치)</strong>에서도 수초 만에 소리 없이 익사합니다. 목욕 중엔 항상 손이 닿는 거리에서 한 손을 아기에게. 전화·초인종 → 아기를 데리고 나갑니다. 집안 익사의 대부분이 욕조이고 그중 절반 이상이 1세 미만. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-play/Pages/Infant-Water-Safety.aspx">AAP</a></li>
    <li><strong>목욕 의자(bath seat)·링은 안전장치가 아닙니다.</strong> 뒤집히거나 다리 구멍으로 미끄러져 1983~2009년 174명 사망, 대부분 잠깐 자리를 비운 사이. <a class="src" href="https://www.cpsc.gov/Newsroom/News-Releases/2010/CPSC-Approves-New-Federal-Safety-Standard-for-Infant-Bath-Seats">CPSC</a></li>
    <li>양동이·아이스박스·반려동물 물그릇은 쓰고 바로 비우기, 변기 뚜껑 잠금, 욕실 문 닫기.</li>
  </ul>

  <h3>6. 화재·일산화탄소·총기·리콜</h3>
  <ul>
    <li>연기 감지기: 모든 침실 밖·모든 층, 매달 테스트. CO 감지기: 층마다 1개(침실 근처). 울리면 즉시 나가서 911. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/all-around/Pages/How-to-Prevent-Carbon-Monoxide-Poisoning.aspx">AAP</a></li>
    <li>총기: 가장 안전한 집은 총이 없는 집. 보관한다면 탄약을 빼고, 잠그고, 탄약은 별도 잠금. 다른 집에 아기를 보낼 땐 "잠기지 않은 총이 있나요?"라고 묻습니다. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-home/Pages/Handguns-in-the-Home.aspx">AAP</a></li>
    <li>리콜: cpsc.gov 리콜 검색 + 이메일 알림, 제품 등록카드 제출(크립·카시트). 중고 크립·바운서·슬링은 기준 미달 가능성. <a class="src" href="https://www.cpsc.gov/Recalls">CPSC 리콜</a></li>
    <li>반려동물과 아기를 절대 단둘이 두지 않고, 핥지 못하게(Pasteurella 감염), 아기 침대에서 재우지 않습니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/from-insects-animals/pages/Pets-and-Pasteurella-Infections.aspx">AAP</a></li>
  </ul>

  <h3>7. 집안 아기방어(babyproofing) 타임라인</h3>
  <div class="tbl"><table>
    <tr><th>시기</th><th>해야 할 일</th></tr>
    <tr><td>출산 전(11~12월)</td><td>크립/배시넷/플레이야드 CPSC 기준·리콜 확인, 연기·CO 감지기 설치·테스트, 온수기 120°F, 카시트 설치·점검, Poison Control 1-800-222-1222 저장, 영아 CPR 수업, 가족·방문객 Tdap/독감/COVID 접종</td></tr>
    <tr><td>0~3개월</td><td>교환대 안전띠 + 절대 혼자 두지 않기, 침대는 창문·줄에서 멀리, 뜨거운 음료 들고 안지 않기, 보행기 사지 않기, 반려동물과 단둘이 두지 않기</td></tr>
    <tr><td>3~5개월(뒤집기 시작)</td><td>속싸개 중단, 모빌 제거(5개월), 배시넷→크립(손·무릎으로 일어서면), 크립 매트리스 한 단 낮추기</td></tr>
    <tr><td>6~9개월(앉기·기기 전)</td><td>콘센트 커버, 가구·TV 벽 고정(anchor), 서랍·찬장 잠금(세제·약·화장품 높은 곳에), 계단 안전문 위·아래, 블라인드 코드리스, 작은 물건·버튼배터리 바닥 점검, 변기 잠금, 식탁보 치우기, 식물 독성 확인</td></tr>
    <tr><td>9~12개월(잡고 서기·걷기)</td><td>크립 매트리스 최저 단, 창문 가드, 가구 모서리 보호대, 가스레인지 손잡이 커버·냄비 손잡이 안쪽, 스토브 주변 1 m 금지구역, 소형 가전 플러그 뽑기, 문 끼임 방지</td></tr>
  </table></div>

  <h3>8. 손님과 가족: 코쿠닝(cocooning)</h3>
  <ul>
    <li>아기를 만지기 전 <strong>손 씻기</strong>, 아픈 사람(기침·열·콧물·구토·설사) 방문 금지, 호흡기 감염 유행철엔 마스크 요청 가능(2세 미만 아기에겐 마스크 금지). <a class="src" href="https://kidshealth.org/en/parents/newborn-out.html">KidsHealth</a></li>
    <li><strong>백일해(Tdap)</strong>: 임신부는 매 임신 27~36주에 접종해 아기에게 항체를 전달하고, 아기와 밀접 접촉할 가족·조부모·베이비시터는 <strong>아기 만나기 최소 2주 전</strong> Tdap 완료. 아기 DTaP는 생후 2개월부터라 그 전엔 주변 어른의 접종이 보호막입니다. 가족 전원 독감 백신(매년)과 최신 COVID-19 백신. <a class="src" href="https://www.cdc.gov/pertussis/vaccines/index.html">CDC 백일해</a></li>
    <li><strong>입맞춤 금지(입·얼굴·손)</strong>: 헤르페스(HSV-1, 입술 포진)는 생후 6개월 미만, 특히 첫 몇 주에 치명적일 수 있습니다. 노출 후 2~12일 내 물집·미열 → 즉시 소아과. 포진 있는 사람은 아기를 안지 않습니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/conditions/skin/Pages/Herpes-Simplex-Virus-Cold-Sores.aspx">AAP</a></li>
    <li>한국에서 오시는 조부모께는 출국 2주 전 Tdap·독감 접종을 부탁드리고, 이 페이지의 수면·흔들기 규칙을 미리 공유하세요.</li>
  </ul>

  <h3>9. 외출: 언제부터, 어떻게</h3>
  <ul>
    <li>미국 지침엔 정해진 규칙이 없습니다. 날씨가 좋으면 <strong>산책은 퇴원 후 바로</strong> 가능. 쇼핑몰·극장·비행기 같은 밀폐되고 붐비는 곳은 몇 개월 기다리라는 의사가 많습니다. 비행기 "이상적" 시기는 생후 2~3개월. <a class="src" href="https://kidshealth.org/en/parents/newborn-out.html">KidsHealth</a> <a class="src" href="https://www.healthychildren.org/English/safety-prevention/on-the-go/Pages/Flying-with-Baby.aspx">AAP 비행기</a></li>
    <li><strong>삼칠일(세이레)</strong>: 21일간 외부인 출입을 막던 한국 관습은 "손님 제한·감염 예방"이라는 취지에서 미국의 코쿠닝과 통합니다. 다만 미국 지침은 바깥 산책 자체를 막지 않습니다. 12월 말 출생이면 삼칠일이 1월 중순까지로 독감·RSV 유행철이라, 실내 다중시설을 피하는 것은 어느 기준으로도 합리적입니다.</li>
  </ul>

  <ul>
    <li><strong>겨울 옷 입히기</strong>: 얇은 옷 여러 겹, 어른보다 한 겹 더, 외출 시 모자·장갑·양말(실내 들어오면 모자 벗기고 겹옷 줄이기). 젖은 옷은 저체온을 빨리 일으키니 유모차 레인커버·여벌 옷. 차 안에서는 두꺼운 외투를 벗기고 얇은 옷 + 담요. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-play/Pages/Cold-Weather-Safety.aspx">AAP</a></li>
    <li><strong>햇빛</strong>: 6개월 미만은 자외선차단제를 원칙적으로 쓰지 않고 그늘·긴소매·챙 7.5 cm 모자로. 그늘·옷으로 못 가리는 얼굴 등 작은 부위에만 소량 가능. 6개월 이후 노출 부위에 광범위 SPF 15~30, 민감 피부엔 산화아연·이산화티타늄 미네랄 제품, 2시간마다. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-play/Pages/Sun-Safety.aspx">AAP 햇빛</a></li>
    <li><strong>아기띠 T.I.C.K.S.</strong>: Tight(밀착) · In view(얼굴이 항상 보이게) · Close enough to kiss(입 맞출 높이) · Keep chin off the chest(턱 밑 손가락 1개 여유) · Supported back. 4개월 미만·조산아는 특히 주의(슬링은 C자로 말리기 쉬움, 2003~2016년 슬링 사망 17건). 다리는 M자(고관절). <a class="src" href="https://www.healthychildren.org/English/safety-prevention/on-the-go/Pages/Baby-Carriers.aspx">AAP 아기띠</a></li>
    <li><strong>유모차</strong>: 신생아는 완전히 눕는 모드 또는 카시트 결합만. 잠들면 평평한 곳으로. 담요로 캐노피를 덮지 않기(내부 과열).</li>
    <li><strong>벌레</strong>: 유모차 모기장이 1순위. DEET는 2개월 미만 금지(일반 기준), 2세 미만엔 꼭 필요할 때 최소량. 레몬유칼립투스유는 3세 미만 금지. <a class="src" href="https://www.healthychildren.org/English/safety-prevention/at-play/Pages/Insect-Repellents.aspx">AAP</a></li>
    <li><strong>비행기</strong>: 2세 미만 무릎 동반이 무료지만 AAP·FAA는 좌석 구매 + FAA 승인 카시트 권장(난기류가 기내 아동 부상 1위). 이착륙 때 수유·공갈젖꼭지로 귀 압력 완화.</li>
  </ul>

  <h3>10. 영아 CPR·기도 막힘: 수업이 원칙, 요약은 이것</h3>
  <div class="box warn tip">
    <ul>
      <li><strong>영아(1세 미만) CPR</strong>: 반응·호흡 없으면 911(스피커폰) → 가슴 중앙(유두선 바로 아래)을 두 손가락 또는 두 엄지로 <strong>약 4 cm(1.5인치)</strong> 깊이, <strong>분당 100~120회</strong>, <strong>30회 압박 : 2회 인공호흡</strong>(입으로 코와 입을 함께 덮기).</li>
      <li><strong>기도 막힘</strong>(기침·울음 불가, 파래짐): 팔 위에 엎드려 머리를 낮추고 <strong>등 두드리기 5회 → 뒤집어 가슴 밀기 5회</strong> 반복, 의식을 잃으면 CPR. 기침하고 있으면 그대로 두고 지켜봅니다. <a class="src" href="https://www.healthychildren.org/English/health-issues/injuries-emergencies/Pages/Choking-Prevention.aspx">AAP</a></li>
      <li><strong>수업</strong>: Kaiser NCAL "Infant and Child CPR Workshop"(약 2시간, 부모·조부모 대상). Redwood City 개설 여부·요금은 Health Education 650-299-2433 / HealthEducation.RedwoodCity@kp.org로 확인. 미국 적십자 수업도 가능.</li>
    </ul>
  </div>

      <li>6개월 미만에 자외선차단제 범벅, 2개월 미만에 DEET</li>

  <h3>퀴즈</h3>
  <div class="quiz">
    <div class="q" data-a="2"><p class="qq">Q1. 아기 목욕 중 전화가 울립니다.</p><div class="opts"><button type="button" class="opt">목욕 의자에 앉혀 두고 받는다</button><button type="button" class="opt">30초만 다녀온다</button><button type="button" class="opt">아기를 수건에 싸서 데리고 나가거나 받지 않는다</button><button type="button" class="opt">물을 빼고 다녀온다</button></div><p class="exp" hidden>정답 3. 아기는 2.5 cm 물에서도 수초 만에 소리 없이 익사합니다. 목욕 의자는 안전장치가 아닙니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q2. 생후 10개월 아기가 리모컨 버튼 배터리를 삼킨 것 같습니다. 증상은 없습니다.</p><div class="opts"><button type="button" class="opt">변으로 나오는지 며칠 지켜본다</button><button type="button" class="opt">즉시 응급실로 간다(2시간 내 식도 화상)</button><button type="button" class="opt">토하게 한다</button><button type="button" class="opt">물을 많이 먹인다</button></div><p class="exp" hidden>정답 2. 버튼 배터리는 2시간 안에 식도를 태울 수 있어 즉시 응급 평가가 필요합니다. 토하게 하지 않습니다.</p></div>
    <div class="q" data-a="0"><p class="qq">Q3. 한국에서 오시는 할머니가 출생 직후 아기를 돌봐 주십니다. 출국 전 부탁드릴 것은?</p><div class="opts"><button type="button" class="opt">출국 2주 전 Tdap(백일해)·독감 접종, 입술 포진이 있으면 뽀뽀 금지</button><button type="button" class="opt">특별히 없다</button><button type="button" class="opt">한약 준비</button><button type="button" class="opt">아기 이불과 베개 준비</button></div><p class="exp" hidden>정답 1. 아기 DTaP는 2개월부터라 그 전엔 주변 어른의 접종이 보호막입니다. 이불·베개는 침대에 들어가면 안 됩니다(Day 2).</p></div>
    <div class="q" data-a="3"><p class="qq">Q4. 1월 아침 5°C, 유모차 산책을 나갑니다. 옷은?</p><div class="opts"><button type="button" class="opt">두꺼운 패딩 한 벌</button><button type="button" class="opt">어른과 똑같이</button><button type="button" class="opt">실내 옷 그대로 담요만</button><button type="button" class="opt">얇은 옷 여러 겹으로 어른보다 한 겹 더, 모자·양말, 레인커버·여벌 옷</button></div><p class="exp" hidden>정답 4. 겹옷이 체온 조절에 유리하고, 실내에 들어오면 모자를 벗기고 겹을 줄입니다. 차에 타면 패딩은 벗깁니다.</p></div>
    <div class="q" data-a="1"><p class="qq">Q5. 영아 CPR의 압박:호흡 비율과 깊이는?</p><div class="opts"><button type="button" class="opt">15:2, 2 cm</button><button type="button" class="opt">30:2, 약 4 cm, 분당 100~120회</button><button type="button" class="opt">5:1, 5 cm</button><button type="button" class="opt">압박만 한다</button></div><p class="exp" hidden>정답 2. 1인 구조자 기준 30:2, 가슴 두께의 약 1/3(4 cm), 분당 100~120회. 수업에서 직접 배워 두세요.</p></div>
