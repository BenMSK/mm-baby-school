<section class="day" style="margin-bottom:16px">
  <h3 style="margin-top:0">1. 병원 입원 중 (Labor &amp; Delivery → 산후 병동)</h3>
  <h4>도착·접수</h4>
  <ul>
    <li><strong>Hi, my wife is in labor. Her contractions are about [4] minutes apart. We called the advice nurse and they told us to come in.</strong><br><span class="small muted">아내가 진통 중입니다. 진통 간격이 약 4분이고, advice nurse가 오라고 했습니다.</span></li>
    <li><strong>Her water broke at [2 a.m.]. The fluid was clear.</strong> / <strong>It was greenish.</strong><br><span class="small muted">새벽 2시에 양수가 터졌습니다. 맑았어요 / 녹색이었어요.</span></li>
    <li><strong>She's a Kaiser member. Here's her member ID card and her photo ID.</strong><br><span class="small muted">Kaiser 회원입니다. 회원증과 신분증입니다.</span></li>
    <li><strong>Is it okay if I stay overnight? Where can I sleep?</strong><br><span class="small muted">밤에 같이 있어도 되나요? 어디서 자면 되나요?</span></li>
  </ul>
  <h4>분만 전후 요청</h4>
  <ul>
    <li><strong>We'd like skin-to-skin right after birth. If my wife can't, I'd like to do it.</strong><br><span class="small muted">출생 직후 피부접촉을 원합니다. 아내가 못 하면 제가 하고 싶어요.</span></li>
    <li><strong>Can I cut the cord?</strong> / <strong>Can we do delayed cord clamping?</strong><br><span class="small muted">탯줄을 제가 잘라도 될까요? / 탯줄을 늦게 묶어 주실 수 있나요?</span></li>
    <li><strong>She'd like the epidural now.</strong> / <strong>Her pain is a [7] out of 10. Can she have something for it?</strong><br><span class="small muted">지금 무통주사를 원합니다. / 통증이 10점 만점에 7점이에요. 진통제 가능한가요?</span></li>
    <li><strong>Could you explain what this consent form is for before we sign?</strong><br><span class="small muted">서명 전에 이 동의서가 무엇인지 설명해 주시겠어요?</span></li>
  </ul>
  <h4>신생아 처치·검사</h4>
  <ul>
    <li><strong>Yes, we want the vitamin K shot, the eye ointment, and the hepatitis B birth dose.</strong><br><span class="small muted">비타민K 주사, 안연고, B형간염 출생 접종 모두 원합니다.</span></li>
    <li><strong>Is the RSV antibody shot, nirsevimab (Beyfortus), given here before discharge? Our baby was born in December.</strong><br><span class="small muted">RSV 항체주사(니르세비맙)를 퇴원 전에 여기서 맞나요? 12월에 태어났어요.</span></li>
    <li><strong>Did my wife get the Tdap and the RSV vaccine (Abrysvo) during pregnancy? I'd like to double-check.</strong><br><span class="small muted">아내가 임신 중 Tdap과 RSV 백신을 맞았는지 확인하고 싶습니다.</span></li>
    <li><strong>What was the bilirubin level, and when should it be rechecked?</strong> / <strong>Does he need phototherapy?</strong><br><span class="small muted">빌리루빈 수치가 얼마였고 언제 재검하나요? / 광선치료가 필요한가요?</span></li>
    <li><strong>Did the baby pass the hearing screen?</strong> / <strong>When will we get the newborn screening results?</strong><br><span class="small muted">청력검사 통과했나요? / 신생아 선별검사 결과는 언제 나오나요?</span></li>
    <li><strong>We've decided not to circumcise.</strong> / <strong>We'd like to schedule the circumcision before discharge.</strong><br><span class="small muted">포경수술은 하지 않기로 했습니다. / 퇴원 전에 포경수술 일정을 잡고 싶어요.</span></li>
    <li><strong>How much weight has she lost since birth? Is that within the normal range?</strong><br><span class="small muted">출생 후 체중이 얼마나 빠졌나요? 정상 범위인가요?</span></li>
  </ul>
  <h4>수유·돌보기 배우기</h4>
  <ul>
    <li><strong>Could a lactation consultant come see us? We're having trouble with the latch.</strong><br><span class="small muted">수유 상담사가 와 주실 수 있나요? 젖물리기가 잘 안 됩니다.</span></li>
    <li><strong>Can you show us how to hand-express colostrum?</strong> / <strong>Can we use a hospital pump while we're here?</strong><br><span class="small muted">초유 손 유축법을 보여 주세요. / 입원 중 병원 유축기를 쓸 수 있나요?</span></li>
    <li><strong>Can you show me how to swaddle / bathe / change the diaper / care for the cord stump?</strong><br><span class="small muted">속싸개 / 목욕 / 기저귀 / 탯줄 관리하는 법을 보여 주세요.</span></li>
    <li><strong>How many wet diapers should we expect on day [3]?</strong><br><span class="small muted">생후 3일에 젖은 기저귀가 몇 개 나와야 하나요?</span></li>

<div id="root"></div>
<script id="state" type="application/json">{"birth":"2026-12-28","checks":{},"lessons":{},"updated":0}</script>
<script id="app">
(function(){
"use strict";
var TITLE="M&M 육아 학교";
var FONT="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap";
var RESET=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
var DAYS=14;
var root=document.getElementById("root"), srcEl=document.getElementById("src");
root.appendChild(srcEl.content.cloneNode(true));
var STATE; try{ STATE=JSON.parse(document.getElementById("state").textContent)||{}; }catch(e){ STATE={}; }
STATE.checks=STATE.checks||{}; STATE.lessons=STATE.lessons||{}; if(!STATE.birth) STATE.birth="2026-12-28";
var LS_STATE="mm-school-state", LS_WHO="mm-school-who", LS_THEME="mm-school-theme", LS_VIEW="mm-school-view";
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
function $(s,el){ return (el||root).querySelector(s); }
function $$(s,el){ return Array.prototype.slice.call((el||root).querySelectorAll(s)); }
var DOW=["일","월","화","수","목","금","토"];
function pad(n){ return (n<10?"0":"")+n; }
function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" ("+DOW[d.getDay()]+")"; }
function fmtShort(d){ return (d.getMonth()+1)+"/"+d.getDate()+" ("+DOW[d.getDay()]+")"; }
function birthDate(){ return new Date(STATE.birth+"T00:00:00"); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function months(b,t){ var m=(t.getFullYear()-b.getFullYear())*12+(t.getMonth()-b.getMonth()); if(t.getDate()<b.getDate()) m--; return m; }
function today0(){ var t=new Date(); t.setHours(0,0,0,0); return t; }

// ---- dates (D+N chips, age, roadmap "now" row)
function renderDates(){
  var b=birthDate(), today=today0(), days=Math.round((today-b)/86400000);
  var bi=$("#birth"); if(bi) bi.value=STATE.birth;
  var age=$("#age"), sub=$("#age-s");
  if(age){
    if(days<0){ age.textContent="D-"+(-days); sub.textContent="출산 예정일 "+fmt(b)+" · 태어나면 날짜를 고쳐 주세요"; }
    else { var w=Math.floor(days/7), mo=months(b,today); age.textContent="생후 "+days+"일"; sub.textContent=(mo>=1? mo+"개월 · ":"")+w+"주 "+(days%7)+"일 · "+fmt(b)+" 출생"; }
  }
  $$("[data-dplus]").forEach(function(el){
    var n=parseInt(el.getAttribute("data-dplus"),10), t=addDays(b,n), s=el.querySelector(".dd");
    if(!s){ s=document.createElement("span"); s.className="dd"; el.appendChild(s); }
    s.textContent=fmtShort(t);
    var left=Math.round((t-today)/86400000), ck=el.closest(".ck"), done=ck && ck.classList.contains("done");
    el.classList.toggle("over", left<0 && !done); el.classList.toggle("soon", left>=0 && left<=7 && !done);
  });
  var mo2=days<0? -1 : months(b,today);
  $$("[data-month]").forEach(function(tr){ tr.classList.toggle("now", parseInt(tr.getAttribute("data-month"),10)===mo2); });
}
// ---- checklist
function renderChecks(){
  $$("input.cb[data-id]").forEach(function(cb){
    var c=STATE.checks[cb.getAttribute("data-id")]; cb.checked=!!(c&&c.done);
    var li=cb.closest(".ck"); li.classList.toggle("done", cb.checked);
    var by=li.querySelector(".by"); if(by) by.textContent= cb.checked ? ((c.by? c.by+" · ":"")+new Date(c.at).toLocaleDateString("ko-KR")+" 완료") : "";
  });
  $$(".phase").forEach(function(ph){
    var cbs=$$("input.cb",ph), n=cbs.filter(function(c){return c.checked;}).length;
    var bar=$(".pbar i",ph); if(bar) bar.style.width=(cbs.length? n/cbs.length*100:0)+"%";
    var cnt=$(".pcount",ph); if(cnt) cnt.textContent=n+"/"+cbs.length;
  });
  var all=$$("input.cb", $("#pane-dad")), done=all.filter(function(c){return c.checked;}).length;
  var pb=$("#dad-prog i"); if(pb) pb.style.width=(all.length? done/all.length*100:0)+"%";
  var pc=$("#dad-count"); if(pc) pc.textContent=done+" / "+all.length;
}
// ---- course
var curDay=0;
function showDay(n){
  curDay=n;
  $$(".day").forEach(function(s){ s.hidden = parseInt(s.getAttribute("data-day"),10)!==n; });
  $$(".dchip").forEach(function(c){ c.classList.toggle("on", parseInt(c.getAttribute("data-go"),10)===n); });
  ls(LS_VIEW,"d"+n); if(history.replaceState) history.replaceState(null,"","#d"+n);
  window.scrollTo(0,0); renderLessons();
}
function renderLessons(){
  var n=0;
  for(var i=1;i<=DAYS;i++){
    var ts=STATE.lessons["d"+i], done=!!ts; if(done) n++;
    $$('[data-day-done="'+i+'"]').forEach(function(el){ el.classList.toggle("done-mark", done); });
    var btn=$('.done-btn[data-day="'+i+'"]');
    if(btn){ btn.classList.toggle("on",done); btn.textContent= done ? "완료 ✓ "+new Date(ts).toLocaleDateString("ko-KR")+" · 눌러서 취소" : "Day "+i+" 공부 완료"; }
  }
  var pb=$("#course-prog i"); if(pb) pb.style.width=(n/DAYS*100)+"%";
  var pc=$("#course-count"); if(pc) pc.textContent=n+" / "+DAYS;
}
function setTab(t){
  $$(".tab").forEach(function(b){ b.setAttribute("aria-selected", b.getAttribute("data-tab")===t ? "true":"false"); });
  $$(".pane").forEach(function(p){ p.hidden = p.getAttribute("data-pane")!==t; });
  if(t!=="course"){ ls(LS_VIEW,t); if(history.replaceState) history.replaceState(null,"","#"+t); window.scrollTo(0,0); }
}
function route(){
  var h=(location.hash||"").replace("#",""), m=/^d(\d+)$/.exec(h);
  if(m){ setTab("course"); showDay(parseInt(m[1],10)); return; }
  if(h==="course"){ setTab("course"); showDay(0); return; }
  if(h==="dad"||h==="english"||h==="qa"){ setTab(h); return; }
  var v=ls(LS_VIEW)||"dad", m2=/^d(\d+)$/.exec(v);
  if(m2){ setTab("course"); showDay(parseInt(m2[1],10)); } else { setTab((v==="english"||v==="qa")?v:"dad"); }
}
// ---- Q&A search + category filter (per device, nothing saved)
var qaCat="";
function filterQA(){
  var inp=$("#qa-q"), q=((inp&&inp.value)||"").trim().toLowerCase(), n=0;
  $$(".qa").forEach(function(d){
    var ok=(!qaCat||d.getAttribute("data-cat")===qaCat) && (!q||d.textContent.toLowerCase().indexOf(q)>=0);
    d.hidden=!ok; if(ok){ n++; if(q) d.open=true; }
  });
  $$(".qa-group").forEach(function(g){ g.hidden = !$$(".qa",g).some(function(d){ return !d.hidden; }); });
  $$(".qa-cat").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-cat")===qaCat); });
  var cnt=$("#qa-n"); if(cnt) cnt.textContent=n+"개";
}
root.addEventListener("input", function(ev){ if(ev.target.id==="qa-q") filterQA(); });
function renderAll(){ renderChecks(); renderDates(); renderLessons(); renderMod(); }
function renderMod(){ var m=STATE.updated; var el=$("#last-mod"); if(el) el.textContent = m ? new Date(m).toLocaleString("ko-KR") : "–"; }

// ---- serialize (whole page regenerated from state; same shape as the authored file)
function buildHtml(){
  var css=document.getElementById("css").textContent, app=document.getElementById("app").textContent;
  var json=JSON.stringify(STATE).replace(/</g,"\\u003c");
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>\n'
    +'<title>'+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<meta name="theme-color" content="#FFF8F1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#201A28" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-title" content="육아 학교">\n<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">\n<link rel="stylesheet" href="'+FONT+'">\n'
    +'<style id="css">'+css+'</style>\n<template id="src">'+srcEl.innerHTML+'</template>\n<div id="root"></div>\n'
    +'<script id="state" type="application/json">'+json+'<\/script>\n<script id="app">'+app+'<\/script>\n</body></html>';
}
var syncEl=$("#sync"), msgEl=$("#sync-msg");
function setSync(cls,text,msg){ syncEl.className="sync "+cls; syncEl.textContent=text; msgEl.textContent=msg||""; }
var art=null, mode="boot", timer=null, publishing=false;
function changed(){
  STATE.updated=Date.now(); ls(LS_STATE, JSON.stringify(STATE)); renderMod();
  if(mode==="shared"){ clearTimeout(timer); timer=setTimeout(publish,1500); setSync("busy","저장 대기 중"); }
  else if(mode==="local"){ setSync("local","이 기기에만 저장됨"); }
}
function publish(){
  if(!art||publishing) return; publishing=true; setSync("busy","저장 중…");
  try{ sessionStorage.setItem("mm-school-scroll", String(window.scrollY)); }catch(e){}
  art.publish(buildHtml()).then(function(){ setSync("shared","저장됨 · 새로고침 중"); })
  .catch(function(e){
    publishing=false; var code=e&&e.code;
    if(code==="conflict"){ setSync("busy","다른 기기에서 저장됨 · 새로고침 중"); return; }
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){ mode="local"; setSync("local","이 기기에만 저장됨","편집 권한이 없는 보기입니다. 체크는 이 브라우저에만 남습니다."); return; }
    if(code==="rate_limited"){ setSync("busy","잠시 후 다시 저장"); timer=setTimeout(publish,8000); return; }
    setSync("local","저장 실패 · 이 기기에만 저장됨",(e&&e.message)||"");
    if(code==="upstream_error"){ timer=setTimeout(publish,3000+Math.random()*2000); }
  });
}
// ---- events
root.addEventListener("click", function(ev){
  var t=ev.target.closest("button"); if(!t) return;
  if(t.classList.contains("tab")){ setTab(t.getAttribute("data-tab")); if(t.getAttribute("data-tab")==="course") showDay(curDay); return; }
  if(t.hasAttribute("data-go")){ setTab("course"); showDay(parseInt(t.getAttribute("data-go"),10)); return; }
  if(t.classList.contains("qa-cat")){ qaCat=t.getAttribute("data-cat")||""; filterQA(); return; }
  if(t.hasAttribute("data-tabgo")){ setTab(t.getAttribute("data-tabgo")); return; }
  if(t.classList.contains("done-btn")){ var k="d"+t.getAttribute("data-day"); if(STATE.lessons[k]) delete STATE.lessons[k]; else STATE.lessons[k]=Date.now(); renderLessons(); changed(); return; }
  if(t.classList.contains("opt")){
    var q=t.closest(".q"); if(!q||q.getAttribute("data-done")) return;
    var opts=$$(".opt",q), a=parseInt(q.getAttribute("data-a"),10), i=opts.indexOf(t);
    opts.forEach(function(o,j){ o.classList.toggle("ok", j===a); o.classList.toggle("no", j===i&&i!==a); o.disabled=true; });
    var ex=$(".exp",q); if(ex) ex.hidden=false; q.setAttribute("data-done","1"); return;
  }
  if(t.id==="theme"){ var next=effectiveTheme()==="dark"?"light":"dark"; ls(LS_THEME,next); applyTheme(next); }
});
root.addEventListener("change", function(ev){
  var t=ev.target;
  if(t.classList.contains("cb")){ var id=t.getAttribute("data-id"); if(t.checked) STATE.checks[id]={done:true,at:Date.now(),by:ls(LS_WHO)||""}; else delete STATE.checks[id]; renderChecks(); renderDates(); changed(); }
  else if(t.id==="birth"){ if(t.value){ STATE.birth=t.value; renderDates(); changed(); } }
  else if(t.id==="who"){ ls(LS_WHO,t.value); }
});
window.addEventListener("hashchange", route);
// ---- theme (per device)
var docEl=document.documentElement, themeBtn=$("#theme");
function sysDark(){ try{ return window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; } }
function effectiveTheme(){ var t=docEl.getAttribute("data-theme"); if(t==="dark"||t==="light") return t; return sysDark()?"dark":"light"; }
function applyTheme(t){ if(t==="dark"||t==="light") docEl.setAttribute("data-theme",t); else docEl.removeAttribute("data-theme"); renderThemeBtn(); }
function renderThemeBtn(){ var cur=effectiveTheme(); themeBtn.querySelector(".em").textContent= cur==="dark"?"☀️":"🌙"; themeBtn.querySelector(".lbl").textContent= cur==="dark"?"라이트":"다크"; }
var savedTheme=ls(LS_THEME); if(savedTheme==="dark"||savedTheme==="light") applyTheme(savedTheme); else renderThemeBtn();
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderThemeBtn); }catch(e){}
// ---- boot
// label every body cell with its column header so phones can show each row as a card
$$("table").forEach(function(t){
  var ths=$$("tr:first-child th",t).map(function(th){ return th.textContent.trim(); }); if(!ths.length) return;
  $$("tr",t).slice(1).forEach(function(tr){ Array.prototype.slice.call(tr.children).forEach(function(td,j){ if(ths[j]) td.setAttribute("data-label",ths[j]); }); });
});
var who=$("#who"); if(who) who.value=ls(LS_WHO)||"";
renderAll(); route(); filterQA();
try{ var sy=sessionStorage.getItem("mm-school-scroll"); if(sy){ sessionStorage.removeItem("mm-school-scroll"); window.scrollTo(0,parseInt(sy,10)||0); } }catch(e){}
var hasClaude=!!(window.claude&&typeof window.claude.use==="function");
if(hasClaude){ window.claude.use("artifact").then(function(ns){ if(ns){ art=ns; mode="shared"; setSync("shared","두 사람이 공유 · 페이지에 저장됨"); } else useLocal(); }).catch(useLocal); }
else useLocal();
function useLocal(){
  mode="local";
  var saved=ls(LS_STATE);
  if(saved){ try{ var s=JSON.parse(saved); if(s&&s.updated&&(!STATE.updated||s.updated>STATE.updated)){ STATE=s; STATE.checks=STATE.checks||{}; STATE.lessons=STATE.lessons||{}; renderAll(); } }catch(e){} }
  setSync("local","이 기기에만 저장됨","공유 저장은 claude.ai에서 편집 권한이 있을 때만 됩니다.");
}
})();
